[pytest]

# =========================
# Test discovery
# =========================
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =========================
# Pytest options
# =========================
addopts =
    -ra
    --strict-markers
    --disable-warnings

# =========================
# Markers (UNIFICATI)
# =========================
markers =

    # --- livelli ---
    unit: unit tests
    integration: integration tests
    e2e: end-to-end tests
    smoke: smoke tests

    # --- qualità / robustezza ---
    failure: failure-path tests
    invariant: invariant tests
    guardrail: structural/contract/architecture guardrails

    # --- sistema ---
    core: test su moduli core critici

    # --- concorrenza / stress ---
    concurrency: test multi-thread o concorrenti
    chaos: chaos tests su moduli core

    # --- resilienza ---
    recovery: restart/reconcile/crash-recovery tests

    # --- rete / gateway ---
    net: network / retry / timeout / HTTP tests

    # --- domini specifici ---
    reconciliation: reconciliation engine tests
    safety: safety / emergency-stop / fail-closed tests
    observability: observability / sanitization / metrics tests
    mutation: mutation / property-based tests

    # --- esecuzione ---
    serial: test da NON eseguire in parallelo (xdist): widget Tk reali su un display X condiviso (PFC-001)

    # --- telegram live (richiedono secrets GitHub) ---
    telegram_live: test E2E con Telegram reale (bot + sessione Telethon)

    # --- F-33 full-scope (harness combinatorio ed E2E, #586) ---
    fullscope: test dell'harness F-33 (combinatorio, E2E, tracciabilita' requisiti)
    pf_requirement(*ids): requisiti UNVERIFIED (tracker #586) che il test prova; alimenta requirements_report.json
    stress: stress / long-running / fault injection pesante (solo VPS isolata, mai in CI veloce)
    requires_vps: richiede la VPS di test isolata
    requires_realdata: richiede il feed Delayed Real-Data (F-31) e GO-REALDATA
    requires_xvfb: richiede un display X (Xvfb) e tkinter/customtkinter