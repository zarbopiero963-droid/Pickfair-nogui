name: CloudCLI Auto PR Loop

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to dispatch to CloudCLI PR Fix"
        required: true
        type: string
      dry_run:
        description: "Run PR fix without commit/push"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Force execution"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      extra_handoff:
        description: "Optional extra handoff text"
        required: false
        type: string

  workflow_run:
    workflows:
      - PR Telegram Notify
    types:
      - completed

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: cloudcli-auto-pr-loop-${{ github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-loop:
    name: Dispatch CloudCLI PR Fix from monitor result
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Resolve auto loop request
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            fs.mkdirSync("cloudcli-auto-loop-output", { recursive: true });

            const isManual = context.eventName === "workflow_dispatch";
            const inputs = context.payload.inputs || {};

            let prNumber = "";
            let dryRun = "true";
            let force = "false";
            let extraHandoff = "";

            if (isManual) {
              prNumber = String(inputs.pr_number || "").trim();
              dryRun = String(inputs.dry_run || "true").trim() === "false" ? "false" : "true";
              force = String(inputs.force || "false").trim() === "true" ? "true" : "false";
              extraHandoff = String(inputs.extra_handoff || "").trim();
            } else {
              const workflowRun = context.payload.workflow_run || {};
              const conclusion = String(workflowRun.conclusion || "");
              const pullRequests = workflowRun.pull_requests || [];

              fs.writeFileSync(
                "cloudcli-auto-loop-output/workflow-run.json",
                JSON.stringify(workflowRun, null, 2),
                "utf8"
              );

              if (conclusion !== "success") {
                core.setOutput("should_dispatch", "false");
                core.setOutput("reason", `PR Telegram Notify conclusion is ${conclusion}, not success.`);
                return;
              }

              if (!pullRequests.length) {
                core.setOutput("should_dispatch", "false");
                core.setOutput("reason", "No PR number found in workflow_run.pull_requests.");
                return;
              }

              prNumber = String(pullRequests[0].number || "").trim();

              if (!prNumber) {
                core.setOutput("should_dispatch", "false");
                core.setOutput("reason", "Workflow run PR number was empty.");
                return;
              }

              dryRun = "true";
              force = "false";
              extraHandoff = [
                "Automatic dry-run from CloudCLI Auto PR Loop.",
                "",
                "This was triggered after PR Telegram Notify completed.",
                "Do not commit or push in this automatic dry run.",
                "Use /fix <PR> real from Telegram or run CloudCLI PR Fix manually for real execution.",
              ].join("\n");
            }

            if (!prNumber || !/^\d+$/.test(prNumber)) {
              core.setFailed("Missing or invalid pr_number.");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(prNumber),
            });

            if (pr.state !== "open") {
              core.setOutput("should_dispatch", "false");
              core.setOutput("reason", `PR #${prNumber} is not open. State: ${pr.state}`);
              return;
            }

            const result = {
              shouldDispatch: true,
              prNumber,
              dryRun,
              force,
              extraHandoff,
              prUrl: pr.html_url,
              headBranch: pr.head.ref,
              headSha: pr.head.sha,
              isManual,
            };

            fs.writeFileSync(
              "cloudcli-auto-loop-output/dispatch.json",
              JSON.stringify(result, null, 2),
              "utf8"
            );

            core.setOutput("should_dispatch", "true");
            core.setOutput("pr_number", prNumber);
            core.setOutput("dry_run", dryRun);
            core.setOutput("force", force);
            core.setOutput("extra_handoff", extraHandoff);
            core.setOutput("pr_url", pr.html_url);
            core.setOutput("head_branch", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("reason", "ready");

      - name: Dispatch CloudCLI PR Fix
        if: steps.resolve.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const repoInfo = await github.rest.repos.get({
              owner,
              repo,
            });

            const ref = repoInfo.data.default_branch || "main";

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "cloudcli-pr-fix.yml",
              ref,
              inputs: {
                pr_number: "${{ steps.resolve.outputs.pr_number }}",
                dry_run: "${{ steps.resolve.outputs.dry_run }}",
                force: "${{ steps.resolve.outputs.force }}",
                extra_handoff: `${{ steps.resolve.outputs.extra_handoff }}`,
              },
            });

            core.info("Dispatched cloudcli-pr-fix.yml");

      - name: Upload auto loop logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-auto-pr-loop-logs-${{ github.run_id }}
          path: cloudcli-auto-loop-output/**
          if-no-files-found: ignore

      - name: Notify Telegram dispatched
        if: success() && steps.resolve.outputs.should_dispatch == 'true'
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_URL: ${{ steps.resolve.outputs.pr_url }}
          BRANCH: ${{ steps.resolve.outputs.head_branch }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          FORCE: ${{ steps.resolve.outputs.force }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Auto PR Loop dispatched PR fix",
              "",
              f"PR: #{os.environ.get('PR_NUMBER', '')}",
              f"URL: {os.environ.get('PR_URL', '')}",
              f"Branch: {os.environ.get('BRANCH', '')}",
              f"Head SHA: {os.environ.get('HEAD_SHA', '')}",
              f"Dry run: {os.environ.get('DRY_RUN', '')}",
              f"Force: {os.environ.get('FORCE', '')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY

      - name: Notify Telegram skipped
        if: success() && steps.resolve.outputs.should_dispatch != 'true'
        env:
          REASON: ${{ steps.resolve.outputs.reason }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Auto PR Loop skipped",
              "",
              f"Reason: {os.environ.get('REASON', 'unknown')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY

      - name: Notify Telegram failure
        if: failure()
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Auto PR Loop failed",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "",
              "Check artifact: cloudcli-auto-pr-loop-logs",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY