name: PR Autofix Self-hosted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to autofix"
        required: true
        default: "220"
        type: string
      max_rounds:
        description: "Maximum fix/check/push rounds"
        required: true
        default: "5"
        type: string
      wait_seconds:
        description: "Seconds to wait after each push before reading checks"
        required: true
        default: "120"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr-autofix-selfhosted-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Autofix PR until checks are green
    runs-on: [self-hosted, pickfair-fixer]
    timeout-minutes: 360

    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      MAX_ROUNDS: ${{ github.event.inputs.max_rounds }}
      WAIT_SECONDS: ${{ github.event.inputs.wait_seconds }}

    steps:
      - name: Resolve PR branch
        id: pr
        run: |
          set -euo pipefail

          echo "Resolving PR #${PR_NUMBER} in ${REPO}"

          gh auth status

          gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision \
            > /tmp/pr.json

          cat /tmp/pr.json | jq .

          HEAD_REF="$(jq -r '.headRefName' /tmp/pr.json)"
          HEAD_SHA="$(jq -r '.headRefOid' /tmp/pr.json)"
          PR_URL="$(jq -r '.url' /tmp/pr.json)"

          if [ -z "${HEAD_REF}" ] || [ "${HEAD_REF}" = "null" ]; then
            echo "Could not resolve PR head branch"
            exit 1
          fi

          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare git identity and auth
        run: |
          set -euo pipefail

          git config user.name "pickfair-autofix-bot"
          git config user.email "pickfair-autofix-bot@users.noreply.github.com"

          AUTH_TOKEN="$(gh auth token)"
          git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${REPO}.git"

          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

          mkdir -p .git/info
          {
            echo ".autofix/"
            echo ".venv/"
            echo "__pycache__/"
            echo ".pytest_cache/"
            echo "*.pyc"
          } >> .git/info/exclude

          echo "Current branch:"
          git branch --show-current

          echo "Current SHA:"
          git rev-parse HEAD

          echo "Repo status:"
          git status --short

      - name: Prepare Python environment
        run: |
          set -euo pipefail

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest

          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

          echo "PYTHON_ENV_READY"

      - name: Autofix loop
        run: |
          set -euo pipefail

          if ! [[ "${MAX_ROUNDS}" =~ ^[0-9]+$ ]]; then
            echo "MAX_ROUNDS must be a number"
            exit 1
          fi

          if ! [[ "${WAIT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "WAIT_SECONDS must be a number"
            exit 1
          fi

          mkdir -p .autofix

          is_green() {
            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/pr-checks-current.json || return 1

            echo "Current PR checks:"
            cat .autofix/pr-checks-current.json | jq -r '.[] | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"'

            BLOCKERS="$(
              cat .autofix/pr-checks-current.json \
                | jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length'
            )"

            if [ "${BLOCKERS}" = "0" ]; then
              return 0
            fi

            return 1
          }

          collect_context() {
            local round="$1"
            local sha
            sha="$(git rev-parse HEAD)"

            rm -rf .autofix/context
            mkdir -p .autofix/context

            echo "Collecting GitHub context for round ${round}, SHA ${sha}"

            gh pr view "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision,comments,files,reviews,statusCheckRollup \
              > .autofix/context/pr-view.json

            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/context/pr-checks.json || true

            gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/check-runs.json || echo '[]' > .autofix/context/check-runs.json

            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/issue-comments.json || echo '[]' > .autofix/context/issue-comments.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/review-comments.json || echo '[]' > .autofix/context/review-comments.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/reviews.json || echo '[]' > .autofix/context/reviews.json

            : > .autofix/context/annotations.jsonl

            python3 <<'PY'
import json
import os
import subprocess
from pathlib import Path

ctx = Path(".autofix/context")

def load_json(name, default):
    path = ctx / name
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except Exception:
        return default

def flatten(value):
    if value is None:
        return []
    if isinstance(value, list):
        out = []
        for item in value:
            out.extend(flatten(item))
        return out
    return [value]

raw_check_runs = load_json("check-runs.json", [])
check_run_ids = []

for page in flatten(raw_check_runs):
    if isinstance(page, dict):
        for check in page.get("check_runs", []) or []:
            conclusion = check.get("conclusion") or ""
            status = check.get("status") or ""
            if status != "completed" or conclusion not in {"success", "neutral", "skipped"}:
                check_id = check.get("id")
                if check_id:
                    check_run_ids.append(str(check_id))

for check_id in check_run_ids[:80]:
    try:
        result = subprocess.run(
            [
                "gh",
                "api",
                f"repos/{os.environ['REPO']}/check-runs/{check_id}/annotations?per_page=100",
                "--paginate",
                "--slurp",
            ],
            check=False,
            text=True,
            capture_output=True,
        )
        if result.stdout.strip():
            with (ctx / "annotations.jsonl").open("a", encoding="utf-8") as fh:
                fh.write(result.stdout.strip() + "\n")
    except Exception:
        pass
PY

            python3 <<'PY'
import json
from pathlib import Path

ctx = Path(".autofix/context")

def load_json(name, default):
    path = ctx / name
    try:
        return json.loads(path.read_text(encoding="utf-8"))
    except Exception:
        return default

def flatten(value):
    if value is None:
        return []
    if isinstance(value, list):
        out = []
        for item in value:
            out.extend(flatten(item))
        return out
    return [value]

def clip(text, n=1400):
    text = str(text or "").strip()
    if len(text) <= n:
        return text
    return text[:n] + "\n...[truncated]"

pr = load_json("pr-view.json", {})
checks = load_json("pr-checks.json", [])

raw_check_runs = load_json("check-runs.json", [])
check_runs = []
for page in flatten(raw_check_runs):
    if isinstance(page, dict):
        check_runs.extend(page.get("check_runs", []) or [])

issue_comments = [
    item for item in flatten(load_json("issue-comments.json", []))
    if isinstance(item, dict)
]

review_comments = [
    item for item in flatten(load_json("review-comments.json", []))
    if isinstance(item, dict)
]

reviews = [
    item for item in flatten(load_json("reviews.json", []))
    if isinstance(item, dict)
]

annotations = []
ann_path = ctx / "annotations.jsonl"
if ann_path.exists():
    for line in ann_path.read_text(encoding="utf-8", errors="replace").splitlines():
        line = line.strip()
        if not line:
            continue
        try:
            parsed = json.loads(line)
        except Exception:
            continue
        for item in flatten(parsed):
            if isinstance(item, dict):
                annotations.append(item)

failed_checks = [
    c for c in checks
    if c.get("bucket") in {"fail", "pending", "cancel"}
]

failed_check_runs = [
    {
        "name": c.get("name"),
        "status": c.get("status"),
        "conclusion": c.get("conclusion"),
        "details_url": c.get("details_url"),
        "html_url": c.get("html_url"),
        "output": {
            "title": clip((c.get("output") or {}).get("title"), 400),
            "summary": clip((c.get("output") or {}).get("summary"), 1200),
            "text": clip((c.get("output") or {}).get("text"), 1200),
        },
    }
    for c in check_runs
    if (c.get("conclusion") or "") not in {"success", "neutral", "skipped"}
]

recent_issue_comments = [
    {
        "user": (c.get("user") or {}).get("login"),
        "created_at": c.get("created_at"),
        "updated_at": c.get("updated_at"),
        "body": clip(c.get("body"), 1200),
        "url": c.get("html_url"),
    }
    for c in issue_comments[-50:]
]

recent_review_comments = [
    {
        "user": (c.get("user") or {}).get("login"),
        "path": c.get("path"),
        "line": c.get("line") or c.get("original_line"),
        "created_at": c.get("created_at"),
        "updated_at": c.get("updated_at"),
        "body": clip(c.get("body"), 1200),
        "url": c.get("html_url"),
    }
    for c in review_comments[-100:]
]

recent_reviews = [
    {
        "user": (r.get("user") or {}).get("login"),
        "state": r.get("state"),
        "submitted_at": r.get("submitted_at"),
        "body": clip(r.get("body"), 1200),
        "url": r.get("html_url"),
    }
    for r in reviews[-40:]
]

annotations_small = [
    {
        "path": a.get("path"),
        "start_line": a.get("start_line"),
        "end_line": a.get("end_line"),
        "annotation_level": a.get("annotation_level"),
        "message": clip(a.get("message"), 1200),
        "title": clip(a.get("title"), 500),
        "raw_details": clip(a.get("raw_details"), 1200),
    }
    for a in annotations[:300]
]

context = {
    "pr": {
        "number": pr.get("number"),
        "title": pr.get("title"),
        "url": pr.get("url"),
        "headRefName": pr.get("headRefName"),
        "headRefOid": pr.get("headRefOid"),
        "baseRefName": pr.get("baseRefName"),
        "mergeStateStatus": pr.get("mergeStateStatus"),
        "reviewDecision": pr.get("reviewDecision"),
    },
    "changed_files": pr.get("files", []),
    "failed_or_pending_checks": failed_checks,
    "failed_check_runs": failed_check_runs,
    "annotations": annotations_small,
    "recent_issue_comments": recent_issue_comments,
    "recent_review_comments": recent_review_comments,
    "recent_reviews": recent_reviews,
}

Path(".autofix/context-small.json").write_text(
    json.dumps(context, indent=2, ensure_ascii=False),
    encoding="utf-8",
)
