name: PR Autofix Self-hosted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to autofix"
        required: true
        default: "220"
        type: string
      max_rounds:
        description: "Maximum fix/check/push rounds"
        required: true
        default: "5"
        type: string
      wait_seconds:
        description: "Seconds to wait after each push before reading checks"
        required: true
        default: "180"
        type: string

  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr-autofix-selfhosted-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Autofix PR until checks are green
    runs-on: [self-hosted, pickfair-fixer]
    timeout-minutes: 1200

    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
      MAX_ROUNDS: ${{ github.event.inputs.max_rounds || '5' }}
      WAIT_SECONDS: ${{ github.event.inputs.wait_seconds || '180' }}
      FINAL_REVIEW_WAIT_SECONDS: "90"
      CODEX_QUOTA_SLEEP_SECONDS: "18600"
      CODEX_MAX_ATTEMPTS: "3"
      CODEX_FIX_MODEL: gpt-5.3-codex
      CODEX_REVIEW_MODEL: gpt-5.5
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Resolve PR branch
        id: pr
        run: |
          set -euo pipefail

          telegram_send() {
            local text="$1"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram secrets missing; skipping notification."
              return 0
            fi

            curl -sS \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" \
              >/dev/null || true
          }

          echo "Resolving PR #${PR_NUMBER} in ${REPO}"

          if ! gh auth status >/tmp/gh-auth-status.log 2>&1; then
            cat /tmp/gh-auth-status.log || true
            telegram_send "❌ Pickfair Autofix: token GitHub scaduto/revocato o gh auth non valido.

Repo: ${REPO}
PR: #${PR_NUMBER}

Serve intervento manuale sulla VPS:
su - pickfair
gh auth login"
            exit 1
          fi

          gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision \
            > /tmp/pr.json

          cat /tmp/pr.json | jq .

          HEAD_REF="$(jq -r '.headRefName' /tmp/pr.json)"
          HEAD_SHA="$(jq -r '.headRefOid' /tmp/pr.json)"
          PR_URL="$(jq -r '.url' /tmp/pr.json)"
          MERGE_STATE="$(jq -r '.mergeStateStatus // ""' /tmp/pr.json)"

          if [ -z "${HEAD_REF}" ] || [ "${HEAD_REF}" = "null" ]; then
            telegram_send "❌ Pickfair Autofix: impossibile risolvere la branch della PR.

Repo: ${REPO}
PR: #${PR_NUMBER}
URL: ${PR_URL}"
            exit 1
          fi

          if [ "${MERGE_STATE}" = "DIRTY" ]; then
            telegram_send "❌ Pickfair PR #${PR_NUMBER}: conflitto merge vero.

Branch: ${HEAD_REF}
SHA: ${HEAD_SHA}
Merge state: ${MERGE_STATE}

Serve intervento manuale/prodotto.
URL: ${PR_URL}"
            exit 1
          fi

          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "skip_autofix=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LATEST_MSG="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message' || true)"

            echo "Latest PR head commit message:"
            printf '%s\n' "${LATEST_MSG}"

            if printf '%s\n' "${LATEST_MSG}" | grep -Eq '^(fix: address PR|fix: address final PR review sweep|chore: autofix)'; then
              echo "This pull_request event was caused by the autofix workflow itself. Skipping duplicate run."
              echo "skip_autofix=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

      - name: Checkout PR branch
        if: steps.pr.outputs.skip_autofix != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare repo auth and Python
        if: steps.pr.outputs.skip_autofix != 'true'
        run: |
          set -euo pipefail

          git config user.name "pickfair-autofix-bot"
          git config user.email "pickfair-autofix-bot@users.noreply.github.com"

          AUTH_TOKEN="$(gh auth token)"
          git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${REPO}.git"

          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

          mkdir -p .git/info
          {
            echo ".autofix/"
            echo ".venv/"
            echo "__pycache__/"
            echo ".pytest_cache/"
            echo "*.pyc"
          } >> .git/info/exclude

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

          echo "Current branch:"
          git branch --show-current

          echo "Current SHA:"
          git rev-parse HEAD

          echo "Repo status:"
          git status --short

          echo "PREPARE_OK"

      - name: Autofix loop
        if: steps.pr.outputs.skip_autofix != 'true'
        run: |
          set -euo pipefail

          if ! [[ "${MAX_ROUNDS}" =~ ^[0-9]+$ ]]; then
            echo "MAX_ROUNDS must be a number"
            exit 1
          fi

          if ! [[ "${WAIT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "WAIT_SECONDS must be a number"
            exit 1
          fi

          mkdir -p .autofix/context

          telegram_send() {
            local text="$1"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram secrets missing; skipping notification."
              return 0
            fi

            curl -sS \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" \
              >/dev/null || true
          }

          blockers_text() {
            if [ ! -f .autofix/pr-checks-current.json ]; then
              printf '%s\n' "No check snapshot available."
              return 0
            fi

            jq -r '.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel") | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"' .autofix/pr-checks-current.json | head -40
          }

          check_green() {
            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/pr-checks-current.json || return 1

            echo "Current PR checks:"
            jq -r '.[] | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"' .autofix/pr-checks-current.json

            BLOCKERS="$(jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length' .autofix/pr-checks-current.json)"

            if [ "${BLOCKERS}" = "0" ]; then
              return 0
            fi

            return 1
          }

          notify_ready() {
            local pr_url
            local head_sha
            local review_note

            pr_url="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url --jq '.url')"
            head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"

            if [ -f .autofix/final-review-ready.txt ]; then
              review_note="$(head -20 .autofix/final-review-ready.txt)"
            else
              review_note="Checks are green and final review sweep found no required code changes."
            fi

            telegram_send "✅ Pickfair PR #${PR_NUMBER} verde e pronta al merge.

Branch: ${{ steps.pr.outputs.head_ref }}
SHA: ${head_sha}
Fix model: ${CODEX_FIX_MODEL}
Final review model: ${CODEX_REVIEW_MODEL}

Final review:
${review_note}

URL: ${pr_url}"
          }

          notify_failed() {
            local reason="$1"
            local pr_url
            local head_sha
            local blockers

            pr_url="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url --jq '.url' || echo "${{ steps.pr.outputs.pr_url }}")"
            head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' || git rev-parse HEAD)"
            blockers="$(blockers_text || true)"

            telegram_send "❌ Pickfair PR #${PR_NUMBER} non è pronta al merge.

Reason: ${reason}

Branch: ${{ steps.pr.outputs.head_ref }}
SHA: ${head_sha}

Blocking checks/comments:
${blockers}

URL: ${pr_url}"
          }

          preflight_codex() {
            echo "Running Codex preflight with ${CODEX_FIX_MODEL}..."

            set +e
            timeout 180s codex exec \
              --model "${CODEX_FIX_MODEL}" \
              --dangerously-bypass-approvals-and-sandbox \
              "Rispondi solo: OK_CODEX_PREFLIGHT" \
              > .autofix/codex-preflight.log 2>&1
            result="$?"
            set -e

            cat .autofix/codex-preflight.log || true

            if [ "${result}" != "0" ]; then
              if grep -Eiq "login|auth|unauthorized|not logged|session|expired" .autofix/codex-preflight.log; then
                telegram_send "❌ Pickfair Autofix: login Codex scaduto/non valido.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${CODEX_FIX_MODEL}

Serve intervento manuale sulla VPS:
su - pickfair
codex login"
                exit 1
              fi

              if grep -Eiq "quota|rate limit|usage limit|try again|reset|too many requests" .autofix/codex-preflight.log; then
                telegram_send "⏳ Pickfair Autofix: quota Codex già esaurita in preflight.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${CODEX_FIX_MODEL}

Riprovo tra $((CODEX_QUOTA_SLEEP_SECONDS / 60)) minuti."
                sleep "${CODEX_QUOTA_SLEEP_SECONDS}"
                return 0
              fi

              telegram_send "❌ Pickfair Autofix: Codex non disponibile in preflight.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${CODEX_FIX_MODEL}

Controlla VPS/Codex CLI."
              exit 1
            fi
          }

          run_codex_with_quota_retry() {
            local model="$1"
            local prompt_file="$2"
            local timeout_seconds="$3"
            local attempt=1
            local result=1

            while [ "${attempt}" -le "${CODEX_MAX_ATTEMPTS}" ]; do
              echo "Codex attempt ${attempt}/${CODEX_MAX_ATTEMPTS} with model ${model}"

              set +e
              timeout "${timeout_seconds}s" codex exec \
                --model "${model}" \
                --dangerously-bypass-approvals-and-sandbox \
                "$(cat "${prompt_file}")" \
                2>&1 | tee .autofix/codex-last.log
              result="${PIPESTATUS[0]}"
              set -e

              if [ "${result}" = "0" ]; then
                return 0
              fi

              if grep -Eiq "quota|rate limit|usage limit|try again|reset|too many requests" .autofix/codex-last.log; then
                telegram_send "⏳ Pickfair Autofix: quota Codex esaurita.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${model}
Attempt: ${attempt}/${CODEX_MAX_ATTEMPTS}

Riprovo tra $((CODEX_QUOTA_SLEEP_SECONDS / 60)) minuti."
                sleep "${CODEX_QUOTA_SLEEP_SECONDS}"
                attempt=$((attempt + 1))
                continue
              fi

              if grep -Eiq "login|auth|unauthorized|not logged|session|expired" .autofix/codex-last.log; then
                telegram_send "❌ Pickfair Autofix: login Codex scaduto durante il run.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${model}

Serve intervento manuale sulla VPS:
su - pickfair
codex login"
                return "${result}"
              fi

              return "${result}"
            done

            telegram_send "❌ Pickfair Autofix: quota Codex troppo lunga oltre i retry.

Repo: ${REPO}
PR: #${PR_NUMBER}
Model: ${model}
Attempts: ${CODEX_MAX_ATTEMPTS}

Serve intervento manuale o attendere reset più lungo."
            return 1
          }

          write_fix_prompt() {
            {
              printf '%s\n' 'You are running inside a GitHub self-hosted runner on the existing PR branch.'
              printf '%s\n' ''
              printf '%s\n' 'Objective:'
              printf '%s\n' 'Make this PR merge-ready by fixing all still-valid red checks and review/comment issues visible from GitHub.'
              printf '%s\n' ''
              printf '%s\n' 'Workflow phase: autofix red checks and actionable review comments.'
              printf '%s\n' ''
              printf '%s\n' 'Hard rules:'
              printf '%s\n' '- Work only on the current branch.'
              printf '%s\n' '- Do not create a new branch.'
              printf '%s\n' '- Do not create a new PR.'
              printf '%s\n' '- Do not merge.'
              printf '%s\n' '- Do not post GitHub comments.'
              printf '%s\n' '- Do not use external Codacy or DeepSource APIs.'
              printf '%s\n' '- Use the local repository plus the GitHub context files in .autofix/context/.'
              printf '%s\n' '- If Codacy or DeepSource only expose failed checks without detailed annotations, infer likely static-analysis fixes from code and comments.'
              printf '%s\n' '- Prefer small targeted fixes.'
              printf '%s\n' '- Do not delete tests to make checks pass.'
              printf '%s\n' '- Preserve public API compatibility.'
              printf '%s\n' '- Do not edit generated caches, virtualenv files, or .autofix internals except your own scratch notes.'
              printf '%s\n' '- When changing Python, run or account for py_compile and relevant pytest.'
              printf '%s\n' '- End with a concise summary of files changed and checks run.'
              printf '%s\n' ''
              printf '%s\n' 'Read first:'
              printf '%s\n' '- .autofix/context/README.md'
              printf '%s\n' '- .autofix/context/pr-checks.json'
              printf '%s\n' '- .autofix/context/check-runs-pages.json'
              printf '%s\n' '- .autofix/context/annotations.jsonl'
              printf '%s\n' '- .autofix/context/issue-comments-pages.json'
              printf '%s\n' '- .autofix/context/review-comments-pages.json'
              printf '%s\n' '- .autofix/context/reviews-pages.json'
              printf '%s\n' '- .autofix/context/review-threads.json'
              printf '%s\n' ''
              printf '%s\n' 'Then inspect the repository files directly and apply the smallest safe fix.'
            } > .autofix/prompt.md
          }

          write_final_review_prompt() {
            rm -f .autofix/final-review-ready.txt .autofix/final-review-blocked.txt

            {
              printf '%s\n' 'You are running inside a GitHub self-hosted runner on the existing PR branch.'
              printf '%s\n' ''
              printf '%s\n' 'Objective:'
              printf '%s\n' 'The PR checks are currently green. Before declaring it merge-ready, perform a final review sweep.'
              printf '%s\n' ''
              printf '%s\n' 'Workflow phase: final review sweep after green checks.'
              printf '%s\n' ''
              printf '%s\n' 'Hard rules:'
              printf '%s\n' '- Work only on the current branch.'
              printf '%s\n' '- Do not create a new branch.'
              printf '%s\n' '- Do not create a new PR.'
              printf '%s\n' '- Do not merge.'
              printf '%s\n' '- Do not post GitHub comments.'
              printf '%s\n' '- Do not use external Codacy or DeepSource APIs.'
              printf '%s\n' '- Check the latest issue comments, review comments, review threads, reviews, annotations, and current files.'
              printf '%s\n' '- Ignore duplicate, outdated, resolved, non-actionable, or already-fixed comments.'
              printf '%s\n' '- If you find a still-valid actionable comment, apply the smallest safe code/test fix.'
              printf '%s\n' '- If no code change is needed and the PR is merge-ready, create .autofix/final-review-ready.txt with a short reason.'
              printf '%s\n' '- If you find a still-valid actionable issue but cannot safely fix it, create .autofix/final-review-blocked.txt with the reason.'
              printf '%s\n' ''
              printf '%s\n' 'Read first:'
              printf '%s\n' '- .autofix/context/README.md'
              printf '%s\n' '- .autofix/context/pr-checks.json'
              printf '%s\n' '- .autofix/context/check-runs-pages.json'
              printf '%s\n' '- .autofix/context/annotations.jsonl'
              printf '%s\n' '- .autofix/context/issue-comments-pages.json'
              printf '%s\n' '- .autofix/context/review-comments-pages.json'
              printf '%s\n' '- .autofix/context/reviews-pages.json'
              printf '%s\n' '- .autofix/context/review-threads.json'
              printf '%s\n' ''
              printf '%s\n' 'Then inspect the repository files directly.'
            } > .autofix/final-review-prompt.md
          }

          write_context_readme() {
            {
              printf '%s\n' 'This directory contains the live GitHub PR context for Codex:'
              printf '%s\n' ''
              printf '%s\n' '- pr-view.json: PR title, branch, files, comments, reviews, status rollup'
              printf '%s\n' '- pr-checks.json: current PR checks and links'
              printf '%s\n' '- check-runs-pages.json: check run summaries/output published to GitHub'
              printf '%s\n' '- issue-comments-pages.json: top-level PR conversation comments'
              printf '%s\n' '- review-comments-pages.json: inline review comments'
              printf '%s\n' '- reviews-pages.json: review submissions'
              printf '%s\n' '- review-threads.json: unresolved/outdated review thread metadata from GraphQL, if available'
              printf '%s\n' '- annotations.jsonl: check-run annotations published to GitHub, if any'
            } > .autofix/context/README.md
          }

          collect_context() {
            local round="$1"
            local sha
            local owner
            local repo_name
            local merge_state
            local pr_url

            sha="$(git rev-parse HEAD)"
            owner="${REPO%%/*}"
            repo_name="${REPO#*/}"

            rm -rf .autofix/context
            mkdir -p .autofix/context

            echo "Collecting GitHub context for round ${round}, SHA ${sha}"

            gh pr view "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision,comments,files,reviews,statusCheckRollup \
              > .autofix/context/pr-view.json

            merge_state="$(jq -r '.mergeStateStatus // ""' .autofix/context/pr-view.json)"
            pr_url="$(jq -r '.url // ""' .autofix/context/pr-view.json)"

            if [ "${merge_state}" = "DIRTY" ]; then
              telegram_send "❌ Pickfair PR #${PR_NUMBER}: conflitto merge vero rilevato.

Branch: ${{ steps.pr.outputs.head_ref }}
SHA: ${sha}
Merge state: ${merge_state}

Serve intervento manuale/prodotto.
URL: ${pr_url}"
              exit 1
            fi

            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/context/pr-checks.json || true

            gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/check-runs-pages.json || echo '[]' > .autofix/context/check-runs-pages.json

            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/issue-comments-pages.json || echo '[]' > .autofix/context/issue-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/review-comments-pages.json || echo '[]' > .autofix/context/review-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/reviews-pages.json || echo '[]' > .autofix/context/reviews-pages.json

            gh api graphql \
              -f owner="${owner}" \
              -f name="${repo_name}" \
              -F number="${PR_NUMBER}" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved isOutdated path line comments(first:20) { nodes { author { login } body createdAt url diffHunk } } } } } } }' \
              > .autofix/context/review-threads.json || echo '{}' > .autofix/context/review-threads.json

            : > .autofix/context/annotations.jsonl

            jq -r '.[]?.check_runs[]? | select(((.status // "") != "completed") or ((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))) | .id' \
              .autofix/context/check-runs-pages.json \
              | head -80 \
              | while read -r check_id; do
                  if [ -n "${check_id}" ] && [ "${check_id}" != "null" ]; then
                    gh api "repos/${REPO}/check-runs/${check_id}/annotations?per_page=100" \
                      --paginate \
                      --slurp \
                      >> .autofix/context/annotations.jsonl || true
                    echo >> .autofix/context/annotations.jsonl
                  fi
                done

            write_context_readme
          }

          run_local_tests() {
            echo "Running local verification..."

            CHANGED_PY="$(git diff --name-only HEAD -- '*.py' || true)"

            if [ -n "${CHANGED_PY}" ]; then
              echo "${CHANGED_PY}" | xargs -r python3 -m py_compile
            fi

            if [ -f tests/unit/test_tick_throttle_executor_determinism.py ] && [ -f tests/unit/test_auto_throttle.py ] && [ -f tests/guardrails/test_contract_snapshot_repo.py ]; then
              python3 -m pytest -q \
                tests/unit/test_tick_throttle_executor_determinism.py \
                tests/unit/test_auto_throttle.py \
                tests/guardrails/test_contract_snapshot_repo.py
            else
              python3 -m pytest -q tests/unit tests/guardrails
            fi
          }

          commit_and_push_if_needed() {
            local round="$1"
            local phase="$2"
            local message
            local status_snapshot

            status_snapshot="$(git status --porcelain)"

            if [ -z "${status_snapshot}" ]; then
              echo "No repository changes after Codex."
              return 10
            fi

            echo "Repository changes:"
            git status --short

            run_local_tests

            git add -A
            git reset -- .autofix || true
            git reset -- .venv || true

            if git diff --cached --quiet; then
              echo "No staged changes."
              return 10
            fi

            if [ "${phase}" = "final" ]; then
              message="fix: address final PR review sweep round ${round}"
            else
              message="fix: address PR ${PR_NUMBER} checks round ${round}"
            fi

            git commit -m "${message}"

            NEW_SHA="$(git rev-parse HEAD)"
            echo "Created commit ${NEW_SHA}"

            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

            echo "PUSHED_SHA=${NEW_SHA}"
            return 0
          }

          final_review_sweep() {
            local round="$1"
            local final_push_result

            echo "Checks are green. Waiting ${FINAL_REVIEW_WAIT_SECONDS}s for late reviewer/bot comments..."
            sleep "${FINAL_REVIEW_WAIT_SECONDS}"

            git fetch origin "${{ steps.pr.outputs.head_ref }}"
            git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

            collect_context "${round}-final-review"
            write_final_review_prompt

            echo "Running final review sweep with ${CODEX_REVIEW_MODEL}..."

            if ! run_codex_with_quota_retry "${CODEX_REVIEW_MODEL}" ".autofix/final-review-prompt.md" 1800; then
              notify_failed "Final review Codex run failed."
              exit 1
            fi

            if [ -f .autofix/final-review-blocked.txt ]; then
              cat .autofix/final-review-blocked.txt
              notify_failed "Final review sweep found actionable unresolved comments requiring human/product decision."
              exit 1
            fi

            set +e
            commit_and_push_if_needed "${round}" "final"
            final_push_result="$?"
            set -e

            if [ "${final_push_result}" = "0" ]; then
              echo "Final review sweep pushed another fix."
              return 20
            fi

            if [ "${final_push_result}" = "10" ]; then
              if [ -f .autofix/final-review-ready.txt ]; then
                if check_green; then
                  notify_ready
                  echo "PR_AUTOFIX_GREEN_AND_FINAL_REVIEW_READY"
                  exit 0
                fi

                echo "Checks changed after final review sweep."
                return 20
              fi

              notify_failed "Final review sweep made no code changes but did not write final-review-ready marker."
              exit 1
            fi

            notify_failed "Final review sweep commit/push failed."
            exit "${final_push_result}"
          }

          preflight_codex

          echo "Initial PR check state:"
          if check_green; then
            set +e
            final_review_sweep "initial"
            sweep_result="$?"
            set -e

            if [ "${sweep_result}" = "20" ]; then
              echo "Final review pushed changes. Waiting ${WAIT_SECONDS}s before continuing."
              sleep "${WAIT_SECONDS}"
            fi
          fi

          for round in $(seq 1 "${MAX_ROUNDS}"); do
            echo "=============================="
            echo "AUTOFIX ROUND ${round}/${MAX_ROUNDS}"
            echo "=============================="

            git fetch origin "${{ steps.pr.outputs.head_ref }}"
            git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

            BEFORE_SHA="$(git rev-parse HEAD)"
            echo "Before SHA: ${BEFORE_SHA}"

            if check_green; then
              set +e
              final_review_sweep "${round}"
              sweep_result="$?"
              set -e

              if [ "${sweep_result}" = "20" ]; then
                echo "Final review pushed changes. Waiting ${WAIT_SECONDS}s before continuing."
                sleep "${WAIT_SECONDS}"
                continue
              fi
            fi

            collect_context "${round}"
            write_fix_prompt

            echo "Running Codex autofix with ${CODEX_FIX_MODEL}..."

            if ! run_codex_with_quota_retry "${CODEX_FIX_MODEL}" ".autofix/prompt.md" 2400; then
              notify_failed "Codex autofix failed during round ${round}."
              exit 1
            fi

            set +e
            commit_and_push_if_needed "${round}" "fix"
            push_result="$?"
            set -e

            if [ "${push_result}" = "10" ]; then
              notify_failed "Codex produced no changes while PR checks/comments are still not clean."
              echo "Codex produced no changes while checks are not green."
              exit 1
            fi

            if [ "${push_result}" != "0" ]; then
              notify_failed "Commit/push failed during autofix round ${round}."
              echo "Commit/push failed."
              exit "${push_result}"
            fi

            echo "Waiting ${WAIT_SECONDS}s for GitHub/Codacy/DeepSource checks..."
            sleep "${WAIT_SECONDS}"

            if check_green; then
              set +e
              final_review_sweep "${round}"
              sweep_result="$?"
              set -e

              if [ "${sweep_result}" = "20" ]; then
                echo "Final review pushed changes. Waiting ${WAIT_SECONDS}s before continuing."
                sleep "${WAIT_SECONDS}"
                continue
              fi
            fi

            AFTER_SHA="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"
            echo "After SHA from GitHub: ${AFTER_SHA}"

            if [ "${AFTER_SHA}" = "${BEFORE_SHA}" ]; then
              notify_failed "SHA did not change after attempted push."
              echo "SHA did not change after attempted push. Failing."
              exit 1
            fi
          done

          echo "Reached max rounds (${MAX_ROUNDS}) and PR is still not ready."
          echo "Latest checks:"
          gh pr checks "${PR_NUMBER}" --repo "${REPO}" || true

          notify_failed "Reached max rounds (${MAX_ROUNDS}) and PR is still red or has unresolved actionable comments."
          exit 1