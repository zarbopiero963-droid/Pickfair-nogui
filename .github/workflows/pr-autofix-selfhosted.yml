name: PR Autofix Self-hosted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to autofix"
        required: true
        default: "220"
        type: string
      max_rounds:
        description: "Maximum fix/check/push rounds"
        required: true
        default: "5"
        type: string
      wait_seconds:
        description: "Seconds to wait after each push before reading checks"
        required: true
        default: "120"
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr-autofix-selfhosted-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Autofix PR until checks are green
    runs-on: [self-hosted, pickfair-fixer]
    timeout-minutes: 360

    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number }}
      MAX_ROUNDS: ${{ github.event.inputs.max_rounds }}
      WAIT_SECONDS: ${{ github.event.inputs.wait_seconds }}

    steps:
      - name: Resolve PR branch
        id: pr
        run: |
          set -euo pipefail

          echo "Resolving PR #${PR_NUMBER} in ${REPO}"
          gh auth status

          gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision \
            > /tmp/pr.json

          cat /tmp/pr.json | jq .

          HEAD_REF="$(jq -r '.headRefName' /tmp/pr.json)"
          HEAD_SHA="$(jq -r '.headRefOid' /tmp/pr.json)"
          PR_URL="$(jq -r '.url' /tmp/pr.json)"

          if [ -z "${HEAD_REF}" ] || [ "${HEAD_REF}" = "null" ]; then
            echo "Could not resolve PR head branch"
            exit 1
          fi

          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare repo auth and Python
        run: |
          set -euo pipefail

          git config user.name "pickfair-autofix-bot"
          git config user.email "pickfair-autofix-bot@users.noreply.github.com"

          AUTH_TOKEN="$(gh auth token)"
          git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${REPO}.git"

          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

          mkdir -p .git/info
          {
            echo ".autofix/"
            echo ".venv/"
            echo "__pycache__/"
            echo ".pytest_cache/"
            echo "*.pyc"
          } >> .git/info/exclude

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

          echo "Current branch:"
          git branch --show-current

          echo "Current SHA:"
          git rev-parse HEAD

          echo "Repo status:"
          git status --short

          echo "PREPARE_OK"

      - name: Autofix loop
        run: |
          set -euo pipefail

          if ! [[ "${MAX_ROUNDS}" =~ ^[0-9]+$ ]]; then
            echo "MAX_ROUNDS must be a number"
            exit 1
          fi

          if ! [[ "${WAIT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "WAIT_SECONDS must be a number"
            exit 1
          fi

          mkdir -p .autofix/context

          check_green() {
            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/pr-checks-current.json || return 1

            echo "Current PR checks:"
            jq -r '.[] | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"' .autofix/pr-checks-current.json

            BLOCKERS="$(jq '[.[] | select(.bucket == "fail" or .bucket == "pending" or .bucket == "cancel")] | length' .autofix/pr-checks-current.json)"

            if [ "${BLOCKERS}" = "0" ]; then
              return 0
            fi

            return 1
          }

          collect_context() {
            local round="$1"
            local sha
            sha="$(git rev-parse HEAD)"

            rm -rf .autofix/context
            mkdir -p .autofix/context

            echo "Collecting GitHub context for round ${round}, SHA ${sha}"

            gh pr view "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision,comments,files,reviews,statusCheckRollup \
              > .autofix/context/pr-view.json

            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/context/pr-checks.json || true

            gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/check-runs-pages.json || echo '[]' > .autofix/context/check-runs-pages.json

            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/issue-comments-pages.json || echo '[]' > .autofix/context/issue-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/review-comments-pages.json || echo '[]' > .autofix/context/review-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/reviews-pages.json || echo '[]' > .autofix/context/reviews-pages.json

            : > .autofix/context/annotations.jsonl

            jq -r '.[]?.check_runs[]? | select(((.status // "") != "completed") or ((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))) | .id' \
              .autofix/context/check-runs-pages.json \
              | head -80 \
              | while read -r check_id; do
                  if [ -n "${check_id}" ] && [ "${check_id}" != "null" ]; then
                    gh api "repos/${REPO}/check-runs/${check_id}/annotations?per_page=100" \
                      --paginate \
                      --slurp \
                      >> .autofix/context/annotations.jsonl || true
                    echo >> .autofix/context/annotations.jsonl
                  fi
                done

            cat > .autofix/context/README.md <<'EOF'
This directory contains the live GitHub PR context for Codex:

- pr-view.json: PR title, branch, files, comments, reviews, status rollup
- pr-checks.json: current PR checks and links
- check-runs-pages.json: check run summaries/output published to GitHub
- issue-comments-pages.json: top-level PR conversation comments
- review-comments-pages.json: inline review comments
- reviews-pages.json: review submissions
- annotations.jsonl: check-run annotations published to GitHub, if any
EOF

            cat > .autofix/prompt.md <<'EOF'
You are running inside a GitHub self-hosted runner on the existing PR branch.

Objective:
Make this PR merge-ready by fixing all still-valid red checks and review/comment issues visible from GitHub.

Hard rules:
- Work only on the current branch.
- Do not create a new branch.
- Do not create a new PR.
- Do not merge.
- Do not post GitHub comments.
- Do not use external Codacy or DeepSource APIs.
- Use the local repository plus the GitHub context files in .autofix/context/.
- If Codacy or DeepSource only expose "failed" without detailed annotations, infer likely static-analysis fixes from code and comments.
- Prefer small targeted fixes.
- Do not delete tests to make checks pass.
- Preserve public API compatibility.
- Do not edit generated caches, virtualenv files, or .autofix internals except your own scratch notes.
- When changing Python, run or account for py_compile and relevant pytest.
- End with a concise summary of files changed and checks run.

Start by reading:
- .autofix/context/README.md
- .autofix/context/pr-checks.json
- .autofix/context/check-runs-pages.json
- .autofix/context/annotations.jsonl
- .autofix/context/issue-comments-pages.json
- .autofix/context/review-comments-pages.json

Then inspect the repository files directly and apply the smallest safe fix.
EOF
          }

          run_local_tests() {
            echo "Running local verification..."

            CHANGED_PY="$(git diff --name-only HEAD -- '*.py' || true)"

            if [ -n "${CHANGED_PY}" ]; then
              echo "${CHANGED_PY}" | xargs -r python3 -m py_compile
            fi

            if [ -f tests/unit/test_tick_throttle_executor_determinism.py ] && [ -f tests/unit/test_auto_throttle.py ] && [ -f tests/guardrails/test_contract_snapshot_repo.py ]; then
              python3 -m pytest -q \
                tests/unit/test_tick_throttle_executor_determinism.py \
                tests/unit/test_auto_throttle.py \
                tests/guardrails/test_contract_snapshot_repo.py
            else
              python3 -m pytest -q tests/unit tests/guardrails
            fi
          }

          commit_and_push_if_needed() {
            local round="$1"

            if git diff --quiet && git diff --cached --quiet; then
              echo "No repository changes after Codex."
              return 10
            fi

            echo "Repository changes:"
            git status --short

            run_local_tests

            git add -A
            git reset -- .autofix || true
            git reset -- .venv || true

            if git diff --cached --quiet; then
              echo "No staged changes."
              return 10
            fi

            git commit -m "fix: address PR ${PR_NUMBER} checks round ${round}"

            NEW_SHA="$(git rev-parse HEAD)"
            echo "Created commit ${NEW_SHA}"

            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

            echo "PUSHED_SHA=${NEW_SHA}"
            return 0
          }

          echo "Initial PR check state:"
          if check_green; then
            echo "PR already green. Nothing to do."
            exit 0
          fi

          for round in $(seq 1 "${MAX_ROUNDS}"); do
            echo "=============================="
            echo "AUTOFIX ROUND ${round}/${MAX_ROUNDS}"
            echo "=============================="

            git fetch origin "${{ steps.pr.outputs.head_ref }}"
            git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

            BEFORE_SHA="$(git rev-parse HEAD)"
            echo "Before SHA: ${BEFORE_SHA}"

            collect_context "${round}"

            echo "Running Codex autofix without inner sandbox..."
            timeout 2400s codex exec \
              --dangerously-bypass-approvals-and-sandbox \
              "$(cat .autofix/prompt.md)"

            set +e
            commit_and_push_if_needed "${round}"
            PUSH_RESULT="$?"
            set -e

            if [ "${PUSH_RESULT}" = "10" ]; then
              echo "Codex produced no changes while checks are not green."
              echo "Failing intentionally so this does not look like a fake green."
              exit 1
            fi

            if [ "${PUSH_RESULT}" != "0" ]; then
              echo "Commit/push failed."
              exit "${PUSH_RESULT}"
            fi

            echo "Waiting ${WAIT_SECONDS}s for GitHub/Codacy/DeepSource checks..."
            sleep "${WAIT_SECONDS}"

            if check_green; then
              echo "PR_AUTOFIX_GREEN"
              exit 0
            fi

            AFTER_SHA="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"
            echo "After SHA from GitHub: ${AFTER_SHA}"

            if [ "${AFTER_SHA}" = "${BEFORE_SHA}" ]; then
              echo "SHA did not change after attempted push. Failing."
              exit 1
            fi
          done

          echo "Reached max rounds (${MAX_ROUNDS}) and PR is still not green."
          echo "Latest checks:"
          gh pr checks "${PR_NUMBER}" --repo "${REPO}" || true

          exit 1