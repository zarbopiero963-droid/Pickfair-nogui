name: PR Autofix Self-hosted

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to autofix"
        required: true
        default: "220"
        type: string
      max_rounds:
        description: "Maximum fix/check/push rounds"
        required: true
        default: "5"
        type: string
      wait_seconds:
        description: "Seconds to wait after each push before reading checks"
        required: true
        default: "180"
        type: string

  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: read
  checks: read
  statuses: read

concurrency:
  group: pr-autofix-selfhosted-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  autofix:
    name: Autofix PR until checks are green
    runs-on: [self-hosted, pickfair-fixer]
    timeout-minutes: 1200

    env:
      REPO: ${{ github.repository }}
      PR_NUMBER_FROM_INPUT: ${{ inputs.pr_number }}
      PR_NUMBER_FROM_EVENT: ${{ github.event.pull_request.number }}
      MAX_ROUNDS_FROM_INPUT: ${{ inputs.max_rounds }}
      WAIT_SECONDS_FROM_INPUT: ${{ inputs.wait_seconds }}
      PENDING_POLL_SECONDS: "60"
      PENDING_WAIT_SECONDS: "2700"
      FINAL_REVIEW_WAIT_SECONDS: "90"
      CODEX_QUOTA_SLEEP_SECONDS: "18600"
      CODEX_MAX_ATTEMPTS: "3"
      CODEX_FIX_MODEL: gpt-5.3-codex
      CODEX_REVIEW_MODEL: gpt-5.5
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Resolve PR branch
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="${PR_NUMBER_FROM_INPUT:-${PR_NUMBER_FROM_EVENT:-}}"

          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR number available."
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

          notify() {
            local text="$1"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram secrets missing; notification skipped."
              return 0
            fi

            curl -sS \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" \
              >/dev/null || true
          }

          echo "Resolving PR #${PR_NUMBER} in ${REPO}"

          if ! gh auth status >/tmp/gh-auth-status.log 2>&1; then
            cat /tmp/gh-auth-status.log || true
            notify "❌ Pickfair Autofix: GitHub token scaduto/revocato o gh auth non valido. Repo: ${REPO}. PR: #${PR_NUMBER}. Serve: su - pickfair && gh auth login"
            exit 1
          fi

          gh pr view "${PR_NUMBER}" \
            --repo "${REPO}" \
            --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision \
            > /tmp/pr.json

          cat /tmp/pr.json | jq .

          HEAD_REF="$(jq -r '.headRefName' /tmp/pr.json)"
          HEAD_SHA="$(jq -r '.headRefOid' /tmp/pr.json)"
          PR_URL="$(jq -r '.url' /tmp/pr.json)"
          MERGE_STATE="$(jq -r '.mergeStateStatus // ""' /tmp/pr.json)"

          if [ -z "${HEAD_REF}" ] || [ "${HEAD_REF}" = "null" ]; then
            notify "❌ Pickfair Autofix: impossibile risolvere branch PR #${PR_NUMBER}. URL: ${PR_URL}"
            exit 1
          fi

          if [ "${MERGE_STATE}" = "DIRTY" ]; then
            notify "❌ Pickfair PR #${PR_NUMBER}: conflitto merge vero. Branch: ${HEAD_REF}. SHA: ${HEAD_SHA}. URL: ${PR_URL}"
            exit 1
          fi

          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "skip_autofix=false" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LATEST_MSG="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.commit.message' || true)"

            echo "Latest PR head commit message:"
            printf '%s\n' "${LATEST_MSG}"

            if printf '%s\n' "${LATEST_MSG}" | grep -Eq '^(fix: address PR|fix: address final PR review sweep|fix: restore autofix rescue|chore: autofix)'; then
              echo "Self-triggered autofix commit detected; skipping duplicate run."
              echo "skip_autofix=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

      - name: Checkout PR branch
        if: steps.pr.outputs.skip_autofix != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare repo auth and Python
        if: steps.pr.outputs.skip_autofix != 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "pickfair-autofix-bot"
          git config user.email "pickfair-autofix-bot@users.noreply.github.com"

          AUTH_TOKEN="$(gh auth token)"
          git remote set-url origin "https://x-access-token:${AUTH_TOKEN}@github.com/${REPO}.git"

          git fetch origin "${{ steps.pr.outputs.head_ref }}"
          git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

          mkdir -p .git/info

          {
            echo ".autofix/"
            echo ".venv/"
            echo "__pycache__/"
            echo ".pytest_cache/"
            echo "*.pyc"
          } >> .git/info/exclude

          python3 -m venv .venv
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          if [ -f requirements-test.txt ]; then
            python -m pip install -r requirements-test.txt
          fi

          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
          fi

          python -m pip install pytest
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

          git branch --show-current
          git rev-parse HEAD
          git status --short

      - name: Autofix loop
        if: steps.pr.outputs.skip_autofix != 'true'
        shell: bash
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail

          MAX_ROUNDS="${MAX_ROUNDS_FROM_INPUT:-5}"
          WAIT_SECONDS="${WAIT_SECONDS_FROM_INPUT:-180}"

          if ! [[ "${MAX_ROUNDS}" =~ ^[0-9]+$ ]]; then
            echo "MAX_ROUNDS must be a number"
            exit 1
          fi

          if ! [[ "${WAIT_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "WAIT_SECONDS must be a number"
            exit 1
          fi

          mkdir -p .autofix/context

          notify() {
            local text="$1"

            if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
              echo "Telegram secrets missing; notification skipped."
              return 0
            fi

            curl -sS \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${text}" \
              --data-urlencode "disable_web_page_preview=true" \
              >/dev/null || true
          }

          blockers_text() {
            if [ ! -f .autofix/pr-checks-current.json ]; then
              printf '%s\n' "No check snapshot available."
              return 0
            fi

            jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel" or .state == "FAILURE" or .state == "ACTION_REQUIRED" or .state == "ERROR" or .state == "CANCELLED" or .state == "TIMED_OUT") | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"' .autofix/pr-checks-current.json | head -40
          }

          check_green() {
            local max_wait="${PENDING_WAIT_SECONDS:-2700}"
            local poll="${PENDING_POLL_SECONDS:-60}"
            local elapsed=0
            local total_count
            local red_count
            local pending_count

            while true; do
              if ! gh pr checks "${PR_NUMBER}" \
                --repo "${REPO}" \
                --json name,state,bucket,description,link,workflow \
                > .autofix/pr-checks-current.json 2>.autofix/pr-checks-error.log; then
                cat .autofix/pr-checks-error.log || true
                return 1
              fi

              echo "Current PR checks:"
              jq -r '.[] | "- \(.name): \(.bucket) / \(.state) / \(.description // "")"' .autofix/pr-checks-current.json

              total_count="$(
                jq '[.[] | select(.name != "Autofix PR until checks are green") | select((.workflow // "") != "PR Autofix Self-hosted") | select((.bucket // "") != "skipping") | select((.state // "") != "SKIPPED")] | length' .autofix/pr-checks-current.json
              )"

              red_count="$(
                jq '[.[] | select(.name != "Autofix PR until checks are green") | select((.workflow // "") != "PR Autofix Self-hosted") | select((.bucket // "") != "skipping") | select((.state // "") != "SKIPPED") | select((.bucket == "fail") or (.bucket == "cancel") or (.state == "FAILURE") or (.state == "ACTION_REQUIRED") or (.state == "ERROR") or (.state == "CANCELLED") or (.state == "TIMED_OUT"))] | length' .autofix/pr-checks-current.json
              )"

              pending_count="$(
                jq '[.[] | select(.name != "Autofix PR until checks are green") | select((.workflow // "") != "PR Autofix Self-hosted") | select((.bucket // "") != "skipping") | select((.state // "") != "SKIPPED") | select((.bucket == "pending") or (.state == "QUEUED") or (.state == "IN_PROGRESS") or (.state == "PENDING") or (.state == "WAITING") or (.state == "REQUESTED"))] | length' .autofix/pr-checks-current.json
              )"

              echo "Check classification: total=${total_count}, red=${red_count}, pending=${pending_count}, elapsed=${elapsed}s"

              if [ "${red_count}" != "0" ]; then
                echo "Real failing checks found."
                return 1
              fi

              if [ "${pending_count}" = "0" ] && [ "${total_count}" != "0" ]; then
                echo "All non-self checks are green."
                return 0
              fi

              if [ "${elapsed}" -ge "${max_wait}" ]; then
                notify_failed "Only pending/queued/in-progress checks remained for too long; no real failure available for Codex to fix."
                exit 1
              fi

              echo "Only pending/queued/in-progress checks. Waiting ${poll}s..."
              sleep "${poll}"
              elapsed=$((elapsed + poll))
            done
          }

          notify_ready() {
            local pr_url
            local head_sha
            local review_note

            pr_url="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url --jq '.url')"
            head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"

            if [ -f .autofix/final-review-ready.txt ]; then
              review_note="$(head -20 .autofix/final-review-ready.txt)"
            else
              review_note="Checks green and final review sweep clean."
            fi

            notify "✅ Pickfair PR #${PR_NUMBER} verde e pronta al merge. Branch: ${{ steps.pr.outputs.head_ref }}. SHA: ${head_sha}. Fix model: ${CODEX_FIX_MODEL}. Review model: ${CODEX_REVIEW_MODEL}. Final review: ${review_note}. URL: ${pr_url}"
          }

          notify_failed() {
            local reason="$1"
            local pr_url
            local head_sha
            local blockers

            pr_url="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url --jq '.url' || echo "${{ steps.pr.outputs.pr_url }}")"
            head_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid' || git rev-parse HEAD)"
            blockers="$(blockers_text || true)"

            notify "❌ Pickfair PR #${PR_NUMBER} non pronta. Reason: ${reason}. Branch: ${{ steps.pr.outputs.head_ref }}. SHA: ${head_sha}. Blockers: ${blockers}. URL: ${pr_url}"
          }

          preflight_codex() {
            echo "Running Codex preflight with ${CODEX_FIX_MODEL}..."

            set +e
            timeout 180s codex exec \
              --model "${CODEX_FIX_MODEL}" \
              --dangerously-bypass-approvals-and-sandbox \
              "Rispondi solo: OK_CODEX_PREFLIGHT" \
              > .autofix/codex-preflight.log 2>&1

            local result="$?"
            set -e

            cat .autofix/codex-preflight.log || true

            if [ "${result}" != "0" ]; then
              if grep -Eiq "login|auth|unauthorized|not logged|session|expired" .autofix/codex-preflight.log; then
                notify "❌ Pickfair Autofix: login Codex scaduto/non valido. Repo: ${REPO}. PR: #${PR_NUMBER}. Serve: su - pickfair && codex login"
                exit 1
              fi

              if grep -Eiq "quota|rate limit|usage limit|try again|reset|too many requests" .autofix/codex-preflight.log; then
                notify "⏳ Pickfair Autofix: quota Codex esaurita in preflight. PR #${PR_NUMBER}. Riprovo tra $((CODEX_QUOTA_SLEEP_SECONDS / 60)) minuti."
                sleep "${CODEX_QUOTA_SLEEP_SECONDS}"
                return 0
              fi

              notify "❌ Pickfair Autofix: Codex non disponibile in preflight. PR #${PR_NUMBER}."
              exit 1
            fi
          }

          run_codex_with_quota_retry() {
            local model="$1"
            local prompt_file="$2"
            local timeout_seconds="$3"
            local attempt=1
            local result=1

            while [ "${attempt}" -le "${CODEX_MAX_ATTEMPTS}" ]; do
              echo "Codex attempt ${attempt}/${CODEX_MAX_ATTEMPTS} with model ${model}"

              set +e
              timeout "${timeout_seconds}s" codex exec \
                --model "${model}" \
                --dangerously-bypass-approvals-and-sandbox \
                "$(cat "${prompt_file}")" \
                2>&1 | tee .autofix/codex-last.log

              result="${PIPESTATUS[0]}"
              set -e

              if [ "${result}" = "0" ]; then
                return 0
              fi

              if grep -Eiq "quota|rate limit|usage limit|try again|reset|too many requests" .autofix/codex-last.log; then
                notify "⏳ Pickfair Autofix: quota Codex esaurita. PR #${PR_NUMBER}. Model: ${model}. Attempt: ${attempt}/${CODEX_MAX_ATTEMPTS}. Riprovo tra $((CODEX_QUOTA_SLEEP_SECONDS / 60)) minuti."
                sleep "${CODEX_QUOTA_SLEEP_SECONDS}"
                attempt=$((attempt + 1))
                continue
              fi

              if grep -Eiq "login|auth|unauthorized|not logged|session|expired" .autofix/codex-last.log; then
                notify "❌ Pickfair Autofix: login Codex scaduto durante il run. PR #${PR_NUMBER}. Model: ${model}. Serve: su - pickfair && codex login"
                return "${result}"
              fi

              return "${result}"
            done

            notify "❌ Pickfair Autofix: quota Codex troppo lunga oltre retry. PR #${PR_NUMBER}. Model: ${model}."
            return 1
          }

          write_fix_prompt() {
            {
              printf '%s\n' 'You are running inside a GitHub self-hosted runner on the existing PR branch.'
              printf '%s\n' 'Objective: make this PR merge-ready by fixing all still-valid red checks and actionable review/comment issues visible from GitHub.'
              printf '%s\n' 'Hard rules: work only on current branch; do not create PRs; do not merge; do not post comments; do not use external Codacy or DeepSource APIs; prefer small targeted fixes.'
              printf '%s\n' 'Read .autofix/context files first, then inspect repository files directly and apply the smallest safe fix.'
            } > .autofix/prompt.md
          }

          write_final_review_prompt() {
            rm -f .autofix/final-review-ready.txt .autofix/final-review-blocked.txt

            {
              printf '%s\n' 'You are running inside a GitHub self-hosted runner on the existing PR branch.'
              printf '%s\n' 'The PR checks are currently green. Perform a final review sweep before declaring merge-ready.'
              printf '%s\n' 'Read latest issue comments, review comments, review threads, reviews, annotations, checks, and current files.'
              printf '%s\n' 'Ignore duplicate, outdated, resolved, non-actionable, or already-fixed comments.'
              printf '%s\n' 'If a still-valid actionable comment exists, apply the smallest safe fix.'
              printf '%s\n' 'If no code change is needed and PR is merge-ready, create .autofix/final-review-ready.txt with a short reason.'
              printf '%s\n' 'If a human/product decision is required, create .autofix/final-review-blocked.txt with the reason.'
            } > .autofix/final-review-prompt.md
          }

          write_context_readme() {
            {
              printf '%s\n' 'Live GitHub PR context for Codex:'
              printf '%s\n' '- pr-view.json'
              printf '%s\n' '- pr-checks.json'
              printf '%s\n' '- check-runs-pages.json'
              printf '%s\n' '- annotations.jsonl'
              printf '%s\n' '- issue-comments-pages.json'
              printf '%s\n' '- review-comments-pages.json'
              printf '%s\n' '- reviews-pages.json'
              printf '%s\n' '- review-threads.json'
            } > .autofix/context/README.md
          }

          collect_context() {
            local round="$1"
            local sha
            local owner
            local repo_name
            local merge_state
            local pr_url

            sha="$(git rev-parse HEAD)"
            owner="${REPO%%/*}"
            repo_name="${REPO#*/}"

            rm -rf .autofix/context
            mkdir -p .autofix/context

            echo "Collecting GitHub context for round ${round}, SHA ${sha}"

            gh pr view "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json number,title,url,headRefName,headRefOid,baseRefName,mergeStateStatus,reviewDecision,comments,files,reviews,statusCheckRollup \
              > .autofix/context/pr-view.json

            merge_state="$(jq -r '.mergeStateStatus // ""' .autofix/context/pr-view.json)"
            pr_url="$(jq -r '.url // ""' .autofix/context/pr-view.json)"

            if [ "${merge_state}" = "DIRTY" ]; then
              notify "❌ Pickfair PR #${PR_NUMBER}: conflitto merge vero. SHA: ${sha}. URL: ${pr_url}"
              exit 1
            fi

            gh pr checks "${PR_NUMBER}" \
              --repo "${REPO}" \
              --json name,state,bucket,description,link,workflow \
              > .autofix/context/pr-checks.json || true

            gh api "repos/${REPO}/commits/${sha}/check-runs?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/check-runs-pages.json || echo '[]' > .autofix/context/check-runs-pages.json

            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/issue-comments-pages.json || echo '[]' > .autofix/context/issue-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/review-comments-pages.json || echo '[]' > .autofix/context/review-comments-pages.json

            gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
              --paginate \
              --slurp \
              > .autofix/context/reviews-pages.json || echo '[]' > .autofix/context/reviews-pages.json

            gh api graphql \
              -f owner="${owner}" \
              -f name="${repo_name}" \
              -F number="${PR_NUMBER}" \
              -f query='query($owner:String!, $name:String!, $number:Int!) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved isOutdated path line comments(first:20) { nodes { author { login } body createdAt url diffHunk } } } } } } }' \
              > .autofix/context/review-threads.json || echo '{}' > .autofix/context/review-threads.json

            : > .autofix/context/annotations.jsonl

            jq -r '.[]?.check_runs[]? | select(((.status // "") != "completed") or ((.conclusion // "") as $c | ($c != "success" and $c != "neutral" and $c != "skipped"))) | .id' \
              .autofix/context/check-runs-pages.json \
              | head -80 \
              | while read -r check_id; do
                  if [ -n "${check_id}" ] && [ "${check_id}" != "null" ]; then
                    gh api "repos/${REPO}/check-runs/${check_id}/annotations?per_page=100" \
                      --paginate \
                      --slurp \
                      >> .autofix/context/annotations.jsonl || true
                    echo >> .autofix/context/annotations.jsonl
                  fi
                done

            write_context_readme
          }

          run_local_tests() {
            echo "Running local verification..."

            local changed_py
            changed_py="$(git diff --name-only HEAD -- '*.py' || true)"

            if [ -n "${changed_py}" ]; then
              echo "${changed_py}" | xargs -r python3 -m py_compile
            fi

            if [ -f tests/unit/test_tick_throttle_executor_determinism.py ] && [ -f tests/unit/test_auto_throttle.py ] && [ -f tests/guardrails/test_contract_snapshot_repo.py ]; then
              python3 -m pytest -q \
                tests/unit/test_tick_throttle_executor_determinism.py \
                tests/unit/test_auto_throttle.py \
                tests/guardrails/test_contract_snapshot_repo.py
            else
              python3 -m pytest -q tests/unit tests/guardrails
            fi
          }

          commit_and_push_if_needed() {
            local round="$1"
            local phase="$2"
            local message
            local status_snapshot

            status_snapshot="$(git status --porcelain)"

            local ahead_count
            ahead_count="0"

            if git rev-parse "origin/${PR_HEAD_REF}" >/dev/null 2>&1; then
              ahead_count="$(git rev-list --count "origin/${PR_HEAD_REF}..HEAD" 2>/dev/null || echo 0)"
            fi

            if [ -z "${status_snapshot}" ] && [ "${ahead_count}" != "0" ]; then
              echo "Local commits ahead of origin detected: ${ahead_count}"
              git push origin "HEAD:${PR_HEAD_REF}"
              local pushed_sha
              pushed_sha="$(git rev-parse HEAD)"
              echo "PUSHED_SHA=${pushed_sha}"
              return 0
            fi

            if [ -z "${status_snapshot}" ]; then
              echo "No repository changes after Codex."
              return 10
            fi

            git status --short
            run_local_tests

            git add -A
            git reset -- .autofix || true
            git reset -- .venv || true

            if git diff --cached --quiet; then
              echo "No staged changes."
              return 10
            fi

            if [ "${phase}" = "final" ]; then
              message="fix: address final PR review sweep round ${round}"
            elif [ "${phase}" = "rescue" ]; then
              message="fix: restore autofix rescue round ${round}"
            else
              message="fix: address PR ${PR_NUMBER} checks round ${round}"
            fi

            git commit -m "${message}"

            local new_sha
            new_sha="$(git rev-parse HEAD)"

            echo "Created commit ${new_sha}"

            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"

            echo "PUSHED_SHA=${new_sha}"
            return 0
          }

          final_review_sweep() {
            local round="$1"
            local final_push_result

            echo "Checks are green. Waiting ${FINAL_REVIEW_WAIT_SECONDS}s for late reviewer/bot comments..."
            sleep "${FINAL_REVIEW_WAIT_SECONDS}"

            git fetch origin "${{ steps.pr.outputs.head_ref }}"
            git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"
            restore_rescue_patch_if_available

            collect_context "${round}-final-review"
            write_final_review_prompt

            if ! run_codex_with_quota_retry "${CODEX_REVIEW_MODEL}" ".autofix/final-review-prompt.md" 1800; then
              notify_failed "Final review Codex run failed."
              exit 1
            fi

            if [ -f .autofix/final-review-blocked.txt ]; then
              cat .autofix/final-review-blocked.txt
              notify_failed "Final review sweep found actionable unresolved comments requiring human/product decision."
              exit 1
            fi

            set +e
            commit_and_push_if_needed "${round}" "final"
            final_push_result="$?"
            set -e

            if [ "${final_push_result}" = "0" ]; then
              echo "Final review sweep pushed another fix."
              return 20
            fi

            if [ "${final_push_result}" = "10" ]; then
              if [ -f .autofix/final-review-ready.txt ]; then
                if check_green; then
                  notify_ready
                  echo "PR_AUTOFIX_GREEN_AND_FINAL_REVIEW_READY"
                  exit 0
                fi

                echo "Checks changed after final review sweep."
                return 20
              fi

              notify_failed "Final review sweep made no code changes but did not write final-review-ready marker."
              exit 1
            fi

            notify_failed "Final review sweep commit/push failed."
            exit "${final_push_result}"
          }


          save_rescue_patch() {
            local exit_code="$1"
            local ts
            local dir
            local ahead_count
            local has_rescue=0

            if [ "${exit_code}" = "0" ]; then
              return 0
            fi

            ts="$(date -u +%Y%m%d-%H%M%S)"
            dir="${HOME}/autofix-rescue/pr-${PR_NUMBER}/${ts}"
            mkdir -p "${dir}"

            {
              echo "repo=${REPO}"
              echo "pr_number=${PR_NUMBER}"
              echo "branch=${PR_HEAD_REF}"
              echo "exit_code=${exit_code}"
              echo "date_utc=${ts}"
              echo "head=$(git rev-parse HEAD 2>/dev/null || true)"
              echo "origin_branch=origin/${PR_HEAD_REF}"
            } > "${dir}/state.txt" || true

            git status --short > "${dir}/git-status.txt" 2>/dev/null || true
            git diff > "${dir}/worktree.diff" 2>/dev/null || true
            git diff --cached > "${dir}/staged.diff" 2>/dev/null || true

            ahead_count="0"
            if git rev-parse "origin/${PR_HEAD_REF}" >/dev/null 2>&1; then
              ahead_count="$(git rev-list --count "origin/${PR_HEAD_REF}..HEAD" 2>/dev/null || echo 0)"
              if [ "${ahead_count}" != "0" ]; then
                git format-patch --stdout "origin/${PR_HEAD_REF}..HEAD" > "${dir}/commits.patch" 2>/dev/null || true
              fi
            fi

            if [ -s "${dir}/worktree.diff" ] || [ -s "${dir}/staged.diff" ] || [ -s "${dir}/commits.patch" ]; then
              has_rescue=1
            fi

            if [ "${has_rescue}" = "1" ]; then
              cp .autofix/codex-last.log "${dir}/codex-last.log" 2>/dev/null || true
              cp .autofix/pr-checks-current.json "${dir}/pr-checks-current.json" 2>/dev/null || true
              mkdir -p "${HOME}/autofix-rescue/pr-${PR_NUMBER}"
              echo "${dir}" > "${HOME}/autofix-rescue/pr-${PR_NUMBER}/latest.txt"
              notify "🛟 Pickfair Autofix rescue salvato. PR: #${PR_NUMBER}. Branch: ${PR_HEAD_REF}. Path VPS: ${dir}. Al prossimo run provo a recuperarlo automaticamente."
            else
              rm -rf "${dir}" || true
            fi

            return "${exit_code}"
          }

          restore_rescue_patch_if_available() {
            local latest
            local dir
            local restored=0

            latest="${HOME}/autofix-rescue/pr-${PR_NUMBER}/latest.txt"

            if [ ! -f "${latest}" ]; then
              return 0
            fi

            dir="$(cat "${latest}")"

            if [ ! -d "${dir}" ]; then
              rm -f "${latest}" || true
              return 0
            fi

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Working tree not clean; skipping rescue restore."
              return 0
            fi

            echo "Found rescue patch: ${dir}"

            if [ -s "${dir}/commits.patch" ]; then
              if git am --3way "${dir}/commits.patch"; then
                notify "🛟 Pickfair Autofix: rescue commits.patch ripristinata automaticamente. PR: #${PR_NUMBER}. Branch: ${PR_HEAD_REF}. Path: ${dir}"
                rm -f "${latest}" || true
                return 0
              fi
              git am --abort || true
            fi

            if [ -s "${dir}/staged.diff" ]; then
              if git apply --index "${dir}/staged.diff"; then
                restored=1
              fi
            fi

            if [ -s "${dir}/worktree.diff" ]; then
              if git apply "${dir}/worktree.diff"; then
                restored=1
              fi
            fi

            if [ "${restored}" = "1" ]; then
              notify "🛟 Pickfair Autofix: rescue patch ripristinata automaticamente. PR: #${PR_NUMBER}. Branch: ${PR_HEAD_REF}. Path: ${dir}"
              rm -f "${latest}" || true
              return 0
            fi

            notify "⚠️ Pickfair Autofix: rescue patch trovata ma non applicabile automaticamente. PR: #${PR_NUMBER}. Branch: ${PR_HEAD_REF}. Path VPS: ${dir}. Serve controllo manuale con git apply o git am."
            return 1
          }

          trap 'save_rescue_patch "$?"' EXIT

          preflight_codex

          if check_green; then
            set +e
            final_review_sweep "initial"
            sweep_result="$?"
            set -e

            if [ "${sweep_result}" = "20" ]; then
              sleep "${WAIT_SECONDS}"
            fi
          fi

          for round in $(seq 1 "${MAX_ROUNDS}"); do
            echo "=============================="
            echo "AUTOFIX ROUND ${round}/${MAX_ROUNDS}"
            echo "=============================="

            git fetch origin "${{ steps.pr.outputs.head_ref }}"
            git checkout -B "${{ steps.pr.outputs.head_ref }}" "origin/${{ steps.pr.outputs.head_ref }}"

            if ! restore_rescue_patch_if_available; then
              notify_failed "Rescue patch exists but cannot be applied automatically."
              exit 1
            fi

            set +e
            commit_and_push_if_needed "${round}" "rescue"
            rescue_push_result="$?"
            set -e

            if [ "${rescue_push_result}" = "0" ]; then
              echo "Rescue restored and pushed. Waiting ${WAIT_SECONDS}s for checks."
              sleep "${WAIT_SECONDS}"
              continue
            fi

            if [ "${rescue_push_result}" != "10" ]; then
              notify_failed "Rescue commit/push failed."
              exit "${rescue_push_result}"
            fi

            before_sha="$(git rev-parse HEAD)"
            echo "Before SHA: ${before_sha}"

            if check_green; then
              set +e
              final_review_sweep "${round}"
              sweep_result="$?"
              set -e

              if [ "${sweep_result}" = "20" ]; then
                sleep "${WAIT_SECONDS}"
                continue
              fi
            fi

            collect_context "${round}"
            write_fix_prompt

            if ! run_codex_with_quota_retry "${CODEX_FIX_MODEL}" ".autofix/prompt.md" 2400; then
              notify_failed "Codex autofix failed during round ${round}."
              exit 1
            fi

            set +e
            commit_and_push_if_needed "${round}" "fix"
            push_result="$?"
            set -e

            if [ "${push_result}" = "10" ]; then
              notify_failed "Codex produced no changes while PR checks/comments are still not clean."
              exit 1
            fi

            if [ "${push_result}" != "0" ]; then
              notify_failed "Commit/push failed during autofix round ${round}."
              exit "${push_result}"
            fi

            echo "Waiting ${WAIT_SECONDS}s for checks..."
            sleep "${WAIT_SECONDS}"

            if check_green; then
              set +e
              final_review_sweep "${round}"
              sweep_result="$?"
              set -e

              if [ "${sweep_result}" = "20" ]; then
                sleep "${WAIT_SECONDS}"
                continue
              fi
            fi

            after_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefOid --jq '.headRefOid')"

            echo "After SHA from GitHub: ${after_sha}"

            if [ "${after_sha}" = "${before_sha}" ]; then
              notify_failed "SHA did not change after attempted push."
              exit 1
            fi
          done

          gh pr checks "${PR_NUMBER}" --repo "${REPO}" || true

          notify_failed "Reached max rounds (${MAX_ROUNDS}) and PR is still red or has unresolved actionable comments."

          exit 1