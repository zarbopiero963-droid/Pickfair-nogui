name: CloudCLI Health
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      run_agent_smoke:
        description: "Run CloudCLI Codex agent smoke test"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: cloudcli-health
  cancel-in-progress: false

jobs:
  health:
    name: Check CloudCLI API and agent
    runs-on: ubuntu-latest

    env:
      CLOUDCLI_API_KEY: ${{ secrets.CLOUDCLI_API_KEY }}
      CLOUDCLI_BASE_URL: ${{ secrets.CLOUDCLI_BASE_URL }}
      CLOUDCLI_ENVIRONMENT_ID: ${{ secrets.CLOUDCLI_ENVIRONMENT_ID }}
      CLOUDCLI_PROJECT_NAME: ${{ secrets.CLOUDCLI_PROJECT_NAME }}
      CLOUDCLI_REPO_PATH: ${{ secrets.CLOUDCLI_REPO_PATH }}
      CLOUDCLI_PROVIDER: ${{ secrets.CLOUDCLI_PROVIDER }}
      CLOUDCLI_MODEL: ${{ secrets.CLOUDCLI_MODEL }}

    steps:
      - name: Run CloudCLI health check
        env:
          RUN_AGENT_SMOKE: ${{ inputs.run_agent_smoke }}
        run: |
          set -euo pipefail
          mkdir -p cloudcli-output

          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          out_dir = Path("cloudcli-output")
          out_dir.mkdir(exist_ok=True)

          api_key = os.environ.get("CLOUDCLI_API_KEY", "").strip()
          base_url = os.environ.get("CLOUDCLI_BASE_URL", "").strip() or "https://cloudcli.ai/api/v1"
          env_id = os.environ.get("CLOUDCLI_ENVIRONMENT_ID", "").strip()
          project = os.environ.get("CLOUDCLI_PROJECT_NAME", "").strip()
          repo_path = os.environ.get("CLOUDCLI_REPO_PATH", "").strip()
          provider = os.environ.get("CLOUDCLI_PROVIDER", "").strip() or "codex"
          model = os.environ.get("CLOUDCLI_MODEL", "").strip() or "gpt-5.3-codex"
          run_smoke = os.environ.get("RUN_AGENT_SMOKE", "false").strip().lower() == "true"

          missing = [
              name for name, value in {
                  "CLOUDCLI_API_KEY": api_key,
                  "CLOUDCLI_ENVIRONMENT_ID": env_id,
                  "CLOUDCLI_PROJECT_NAME": project,
                  "CLOUDCLI_REPO_PATH": repo_path,
              }.items()
              if not value
          ]

          if missing:
              raise SystemExit(f"Missing required config: {', '.join(missing)}")

          def request_json(method, path, payload=None):
              url = base_url.rstrip("/") + path
              data = None
              headers = {
                  "X-API-KEY": api_key,
                  "Accept": "application/json",
              }

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(url, data=data, headers=headers, method=method)

              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"HTTP {exc.code} {method} {url}\n{body}") from exc

              if not raw.strip():
                  return {}

              return json.loads(raw)

          env_info = request_json("GET", f"/environments/{env_id}")
          (out_dir / "environment.json").write_text(json.dumps(env_info, indent=2), encoding="utf-8")

          status = str(env_info.get("status", ""))
          print(f"CloudCLI environment status: {status}")
          print(f"CloudCLI environment name: {env_info.get('name', '')}")
          print(f"CloudCLI project: {project}")
          print(f"CloudCLI repo path: {repo_path}")
          print(f"CloudCLI provider/model: {provider}/{model}")

          if status != "running":
              print("Starting CloudCLI environment...")
              start_info = request_json("POST", f"/environments/{env_id}/start")
              (out_dir / "start.json").write_text(json.dumps(start_info, indent=2), encoding="utf-8")

              for attempt in range(1, 37):
                  time.sleep(5)
                  env_info = request_json("GET", f"/environments/{env_id}")
                  status = str(env_info.get("status", ""))
                  print(f"Start poll {attempt}: {status}")

                  if status == "running":
                      break

              if status != "running":
                  raise SystemExit("CloudCLI environment did not become running.")

          if not run_smoke:
              print("RUN_AGENT_SMOKE=false; skipping agent smoke test.")
              (out_dir / "summary.txt").write_text("CloudCLI API health OK; smoke skipped.\n", encoding="utf-8")
              sys.exit(0)

          message = f"""
          CLOUDCLI HEALTH CHECK TEST ONLY.

          Do not modify files.
          Do not commit.
          Do not push.
          Do not create a PR.

          Work only in this repository path:
          {repo_path}

          Run these shell commands if available:
          pwd
          cd "{repo_path}" && git status --short
          cd "{repo_path}" && git branch --show-current
          cd "{repo_path}" && git remote -v

          Return the marker CLOUDCLI_HEALTH_OK and then this exact summary format:

          project_path: <path>
          branch: <branch>
          git_status: <status>
          git_remote: <remote>
          ready: yes/no
          """

          payload = {
              "environmentId": env_id,
              "projectName": project,
              "message": message,
              "provider": provider,
              "model": model,
              "createBranch": False,
              "createPR": False,
          }

          (out_dir / "agent-payload.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          url = base_url.rstrip("/") + "/agent/execute"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "X-API-KEY": api_key,
                  "Content-Type": "application/json",
                  "Accept": "text/event-stream",
              },
              method="POST",
          )

          print("Calling CloudCLI agent execute...")
          chunks = []

          try:
              with urllib.request.urlopen(req, timeout=900) as resp:
                  for raw_line in resp:
                      line = raw_line.decode("utf-8", errors="replace")
                      print(line, end="")
                      chunks.append(line)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"HTTP {exc.code} POST {url}\n{body}") from exc

          sse_text = "".join(chunks)
          (out_dir / "agent-sse.log").write_text(sse_text, encoding="utf-8")

          if "CLOUDCLI_HEALTH_OK" not in sse_text:
              raise SystemExit("CloudCLI health marker CLOUDCLI_HEALTH_OK not found in agent output.")

          (out_dir / "summary.txt").write_text("CloudCLI API and agent health OK.\n", encoding="utf-8")
          PY

      - name: Upload CloudCLI health logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-health-logs-${{ github.run_id }}
          path: cloudcli-output/**
          if-no-files-found: ignore