name: PR Self Check Refresh

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      dry_run:
        description: "Only report what would be rerun"
        required: false
        default: "false"
  workflow_run:
    workflows:
      - PR Merge Readiness
      - PR Autofix Safe Supervisor
    types: [completed]
  check_run:
    types: [completed, rerequested]

concurrency:
  group: pr-self-check-refresh-${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  refresh-self-checks:
    name: Refresh stale self checks
    if: >-
      ${{
        github.event_name != 'check_run' ||
        (
          github.event.check_run.pull_requests[0].number &&
          (
            contains(github.event.check_run.name, 'Merge readiness') ||
            contains(github.event.check_run.name, 'Safe PR autofix')
          )
        )
      }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      MAX_RERUN_ATTEMPTS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}

      - name: Refresh stale self checks
        run: |
          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR number for this event; nothing to refresh."
            exit 0
          fi

          python3 scripts/pr_refresh_self_checks.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER"
