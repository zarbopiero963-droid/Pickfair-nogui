name: Telegram Command Bridge

"on":
  workflow_dispatch:
    inputs:
      process_existing:
        description: "Process old pending Telegram messages"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: telegram-command-bridge
  cancel-in-progress: false

jobs:
  bridge:
    name: Poll Telegram and dispatch CloudCLI Controller
    runs-on: ubuntu-latest

    steps:
      - name: Poll Telegram commands
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROCESS_EXISTING: ${{ github.event.inputs.process_existing || 'false' }}
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const token = String(process.env.TELEGRAM_BOT_TOKEN || "").trim();
            const allowedChatId = String(process.env.TELEGRAM_CHAT_ID || "").trim();
            const processExisting = String(process.env.PROCESS_EXISTING || "false") === "true";

            const STATE_VARIABLE = "TELEGRAM_LAST_UPDATE_ID";

            if (!token || !allowedChatId) {
              core.setFailed("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID.");
              return;
            }

            async function telegram(method, params) {
              const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
                method: "POST",
                body: new URLSearchParams(params),
              });

              const body = await response.text();

              if (!response.ok) {
                throw new Error(`Telegram ${method} failed: ${response.status} ${body}`);
              }

              return JSON.parse(body);
            }

            async function sendMessage(text) {
              await telegram("sendMessage", {
                chat_id: allowedChatId,
                text,
                disable_web_page_preview: "true",
              });
            }

            async function getRepoVariable(name) {
              try {
                const { data } = await github.rest.actions.getRepoVariable({
                  owner,
                  repo,
                  name,
                });

                return data.value || "";
              } catch (err) {
                if (err.status === 404) return null;
                throw err;
              }
            }

            async function setRepoVariable(name, value) {
              const current = await getRepoVariable(name);

              if (current === null) {
                await github.rest.actions.createRepoVariable({
                  owner,
                  repo,
                  name,
                  value: String(value),
                });
              } else {
                await github.rest.actions.updateRepoVariable({
                  owner,
                  repo,
                  name,
                  value: String(value),
                });
              }
            }

            async function dispatchController(inputs) {
              const repoInfo = await github.rest.repos.get({
                owner,
                repo,
              });

              const ref = repoInfo.data.default_branch || "main";

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "cloudcli-controller.yml",
                ref,
                inputs,
              });
            }

            function helpText() {
              return [
                "Pickfair CloudCLI commands",
                "",
                "/task Title | Long task description",
                "Create a new branch and PR through CloudCLI. Real execution.",
                "",
                "/task-dry Title | Long task description",
                "Send a new task to CloudCLI in dry-run mode. No edits, commits, push, or PR.",
                "",
                "/fix 220",
                "Run PR fix handoff for PR #220 in dry-run mode.",
                "",
                "/fix 220 real",
                "Run PR fix handoff for PR #220 and allow commit/push to same PR branch.",
                "",
                "/fix 220 force",
                "Force PR fix dry-run.",
                "",
                "/fix 220 real force",
                "Force PR fix real execution.",
                "",
                "/health",
                "Run CloudCLI API health check.",
                "",
                "/health smoke",
                "Run CloudCLI health check plus Codex agent smoke.",
                "",
                "/help",
              ].join("\n");
            }

            function normalizeText(value) {
              return String(value || "").trim();
            }

            function compactWords(value) {
              return String(value || "").trim().replace(/\s+/g, " ");
            }

            function parseTask(rawText, dryRun) {
              const withoutCommand = rawText
                .replace(/^\/task-dry(@[A-Za-z0-9_]+)?\s*/i, "")
                .replace(/^\/task(@[A-Za-z0-9_]+)?\s*/i, "")
                .trim();

              if (!withoutCommand) {
                return {
                  kind: "error",
                  message: dryRun
                    ? "Usage: /task-dry Title | Long task description"
                    : "Usage: /task Title | Long task description",
                };
              }

              const parts = withoutCommand.split("|");
              const title = String(parts.shift() || "").trim();
              const text = parts.join("|").trim() || title;

              if (!title || !text) {
                return {
                  kind: "error",
                  message: dryRun
                    ? "Usage: /task-dry Title | Long task description"
                    : "Usage: /task Title | Long task description",
                };
              }

              return {
                kind: "dispatch",
                inputs: {
                  mode: "new-task",
                  pr_number: "",
                  task_title: title,
                  task_text: text,
                  dry_run: dryRun ? "true" : "false",
                  force: "false",
                  run_agent_smoke: "false",
                  extra_handoff: "",
                },
              };
            }

            function parseCommand(text) {
              const rawText = normalizeText(text);

              if (!rawText.startsWith("/")) {
                return null;
              }

              const compact = compactWords(rawText);
              const words = compact.split(" ");
              const command = words[0].split("@")[0].toLowerCase();
              const args = words.slice(1);

              const hasSmoke = args.some(arg => ["smoke", "--smoke"].includes(arg.toLowerCase()));
              const hasForce = args.some(arg => ["force", "--force"].includes(arg.toLowerCase()));
              const isReal = args.some(arg => ["real", "--real", "live", "--live"].includes(arg.toLowerCase()));
              const firstNumber = args.find(arg => /^\d+$/.test(arg));

              if (command === "/help" || command === "/start") {
                return {
                  kind: "help",
                };
              }

              if (command === "/health") {
                return {
                  kind: "dispatch",
                  inputs: {
                    mode: "health",
                    pr_number: "",
                    task_title: "",
                    task_text: "",
                    dry_run: "true",
                    force: "false",
                    run_agent_smoke: hasSmoke ? "true" : "false",
                    extra_handoff: "",
                  },
                };
              }

              if (command === "/task") {
                return parseTask(rawText, false);
              }

              if (command === "/task-dry") {
                return parseTask(rawText, true);
              }

              if (command === "/fix") {
                if (!firstNumber) {
                  return {
                    kind: "error",
                    message: "Usage: /fix 220 OR /fix 220 real OR /fix 220 real force",
                  };
                }

                return {
                  kind: "dispatch",
                  inputs: {
                    mode: "pr-fix",
                    pr_number: firstNumber,
                    task_title: "",
                    task_text: "",
                    dry_run: isReal ? "false" : "true",
                    force: hasForce ? "true" : "false",
                    run_agent_smoke: "false",
                    extra_handoff: "",
                  },
                };
              }

              return {
                kind: "error",
                message: [
                  `Unknown command: ${command}`,
                  "",
                  helpText(),
                ].join("\n"),
              };
            }

            const lastValue = await getRepoVariable(STATE_VARIABLE);
            const lastUpdateId = lastValue ? Number(lastValue) : 0;

            const params = {
              timeout: "0",
              allowed_updates: JSON.stringify(["message"]),
            };

            if (lastUpdateId > 0) {
              params.offset = String(lastUpdateId + 1);
            }

            const updatesResponse = await telegram("getUpdates", params);
            const updates = updatesResponse.result || [];

            if (!updates.length) {
              core.info("No Telegram updates.");
              return;
            }

            const maxUpdateId = Math.max(...updates.map(update => update.update_id));

            if (!lastValue && !processExisting) {
              await setRepoVariable(STATE_VARIABLE, String(maxUpdateId));

              await sendMessage([
                "Telegram Command Bridge initialized.",
                "",
                "Old pending messages were ignored.",
                "Now send:",
                "",
                "/help",
              ].join("\n"));

              core.info(`Initialized ${STATE_VARIABLE}=${maxUpdateId}`);
              return;
            }

            let processed = 0;

            for (const update of updates) {
              const message = update.message || {};
              const messageText = message.text || "";
              const chatId = String(message.chat?.id || "");

              if (chatId !== allowedChatId) {
                core.info(`Ignoring message from unauthorized chat: ${chatId}`);
                continue;
              }

              const parsed = parseCommand(messageText);

              if (!parsed) {
                core.info(`Ignoring non-command message: ${messageText}`);
                continue;
              }

              processed += 1;

              if (parsed.kind === "help") {
                await sendMessage(helpText());
                continue;
              }

              if (parsed.kind === "error") {
                await sendMessage(`Error:\n${parsed.message}`);
                continue;
              }

              if (parsed.kind === "dispatch") {
                await dispatchController(parsed.inputs);

                await sendMessage([
                  "Command received and dispatched to CloudCLI Controller.",
                  "",
                  `Mode: ${parsed.inputs.mode}`,
                  `PR: ${parsed.inputs.pr_number || "n/a"}`,
                  `Task title: ${parsed.inputs.task_title || "n/a"}`,
                  `Dry run: ${parsed.inputs.dry_run}`,
                  `Force: ${parsed.inputs.force}`,
                  `Agent smoke: ${parsed.inputs.run_agent_smoke}`,
                  "",
                  `Controller: https://github.com/${owner}/${repo}/actions/workflows/cloudcli-controller.yml`,
                ].join("\n"));
              }
            }

            await setRepoVariable(STATE_VARIABLE, String(maxUpdateId));

            core.info(`Processed commands: ${processed}`);
            core.info(`Updated ${STATE_VARIABLE}=${maxUpdateId}`);