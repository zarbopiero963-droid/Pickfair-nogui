name: ci-master-gate

# PFC-002 (M156). Tolti due duplicati dimostrati:
# - `dynamic` (ci-dynamic-intelligent annidato): lo stesso workflow parte gia'
#   da solo su ogni pull_request, quindi la copia annidata rifaceva detect, le
#   lane di modulo, mutation e merge-simulation-hard una seconda volta;
# - `merge-simulation-hard`: parte gia' da solo su ogni pull_request.
# La suite completa non gira piu' qui dentro (backstop di ogni lane): gira una
# volta sola nel check `full-suite`.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  # Un push nuovo sulla stessa PR rende inutile il run dello SHA superato.
  group: ci-master-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trading-engine:
    uses: ./.github/workflows/trading-engine.yml

  order-manager:
    uses: ./.github/workflows/order-manager.yml

  execution-guard:
    uses: ./.github/workflows/execution-guard.yml

  risk-middleware:
    uses: ./.github/workflows/risk-middleware.yml

  runtime-controller:
    uses: ./.github/workflows/runtime-controller.yml

  money-management:
    uses: ./.github/workflows/money-management.yml

  telegram-listener:
    uses: ./.github/workflows/telegram-listener.yml

  copy-engine:
    uses: ./.github/workflows/copy-engine.yml

  simulation-broker:
    uses: ./.github/workflows/simulation-broker.yml

  session-manager:
    uses: ./.github/workflows/session-manager.yml

  rate-limiter:
    uses: ./.github/workflows/rate-limiter.yml

  live-gate:
    uses: ./.github/workflows/live-gate.yml

  chaos-critical:
    uses: ./.github/workflows/chaos-critical.yml

  mutation-guardrails:
    uses: ./.github/workflows/mutation-guardrails.yml
