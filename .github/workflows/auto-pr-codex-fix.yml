name: Auto PR Codex Fix

"on":
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to fix"
        required: true
        type: string
      force:
        description: "Force run even if this handoff/head was already attempted"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Run Codex and checks but do not commit/push"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  workflow_run:
    workflows: ["PR Telegram Notify"]
    types: [completed]

permissions:
  contents: write
  pull-requests: read
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: auto-pr-codex-fix-${{ github.event.inputs.pr_number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-fix:
    name: Run Codex CLI on VPS and push PR fix
    runs-on: self-hosted

    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Prepare directories
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/handoff"
          mkdir -p "$GITHUB_WORKSPACE/codex-output"
          mkdir -p "$HOME/pickfair-auto-state"
          echo "Directories prepared."

      - name: Download Codex task handoff from PR Telegram Notify run
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: codex-pr-*-task-handoff
          merge-multiple: true
          path: ${{ runner.temp }}/handoff

      - name: Find latest Codex task handoff for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
          HANDOFF_DIR: ${{ runner.temp }}/handoff
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = process.env.PR_NUMBER;
            const handoffDir = process.env.HANDOFF_DIR;

            fs.mkdirSync(handoffDir, { recursive: true });

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: "pr-telegram-notify.yml",
              status: "completed",
              per_page: 50,
            });

            for (const run of runs) {
              if (run.conclusion !== "success") continue;

              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });

              const artifact = artifacts.find(a =>
                a.name === `codex-pr-${prNumber}-task-handoff`
              );

              if (!artifact) continue;

              const zip = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
                archive_format: "zip",
              });

              const zipPath = path.join(handoffDir, "handoff.zip");
              fs.writeFileSync(zipPath, Buffer.from(zip.data));

              core.info(`Downloaded artifact ${artifact.name} from run ${run.id}`);
              return;
            }

            core.warning(`No codex-pr-${prNumber}-task-handoff artifact found. Generating fallback handoff for PR ${prNumber}.`);

            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: Number(prNumber),
            });

            const fallback = [
              "# Codex PR task handoff",
              "",
              `PR: #${prNumber}`,
              `Branch: ${pr.data.head.ref}`,
              `Head SHA: ${pr.data.head.sha}`,
              `Base branch: ${pr.data.base.ref}`,
              "Status: REPAIR REQUIRED / FALLBACK HANDOFF",
              "",
              "This fallback handoff was generated because no PR Telegram Notify artifact was found.",
              "The Auto PR Codex Fix workflow will append rich PR context before invoking Codex.",
              "",
              "Instructions:",
              "- Repair only the current PR.",
              "- Read the rich PR context appended below.",
              "- Prioritize failing checks, review comments, and bot feedback.",
              "- Keep changes minimal.",
              "- Run focused tests when possible.",
              "",
            ].join("\n");

            const fallbackPath = path.join(
              handoffDir,
              `codex-pr-${prNumber}-task-handoff-fallback.md`
            );

            fs.writeFileSync(fallbackPath, fallback, "utf8");
            core.info(`Generated fallback handoff: ${fallbackPath}`);
            return;

      - name: Unzip manual handoff artifact
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/handoff/handoff.zip" ]; then
            cd "$RUNNER_TEMP/handoff"
            unzip -o handoff.zip
            rm -f handoff.zip
          fi

      - name: Select handoff file and extract PR metadata
        id: handoff
        run: |
          set -euo pipefail

          HANDOFF_FILE="$(find "$RUNNER_TEMP/handoff" -maxdepth 3 -type f -name 'codex-pr-*-task-handoff-*.md' | head -n 1 || true)"

          if [ -z "$HANDOFF_FILE" ]; then
            echo "No handoff file found."
            find "$RUNNER_TEMP/handoff" -maxdepth 4 -type f -print || true
            exit 1
          fi

          echo "Handoff file: $HANDOFF_FILE"

          PR_NUMBER="$(grep -m1 '^PR: #' "$HANDOFF_FILE" | sed -E 's/^PR: #([0-9]+).*/\1/' || true)"
          BRANCH="$(grep -m1 '^Branch:' "$HANDOFF_FILE" | sed -E 's/^Branch:[[:space:]]*//' || true)"
          HEAD_SHA="$(grep -m1 '^Head SHA:' "$HANDOFF_FILE" | sed -E 's/^Head SHA:[[:space:]]*//' || true)"
          BASE_BRANCH="$(grep -m1 '^Base branch:' "$HANDOFF_FILE" | sed -E 's/^Base branch:[[:space:]]*//' || true)"

          if [ -z "$PR_NUMBER" ] || [ -z "$BRANCH" ] || [ -z "$HEAD_SHA" ]; then
            echo "Could not parse PR_NUMBER / BRANCH / HEAD_SHA from handoff."
            echo "Parsed:"
            echo "PR_NUMBER=$PR_NUMBER"
            echo "BRANCH=$BRANCH"
            echo "HEAD_SHA=$HEAD_SHA"
            exit 1
          fi

          if grep -q 'Status: CLEAN / ALL GREEN' "$HANDOFF_FILE"; then
            echo "Handoff says PR is already clean/all green. Skipping Codex."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

          HASH="$(sha256sum "$HANDOFF_FILE" | awk '{print $1}')"
          SHORT_HASH="${HASH:0:20}"

          echo "handoff_file=$HANDOFF_FILE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_branch=${BASE_BRANCH:-main}" >> "$GITHUB_OUTPUT"
          echo "handoff_hash=$SHORT_HASH" >> "$GITHUB_OUTPUT"

          echo "PR_NUMBER=$PR_NUMBER"
          echo "BRANCH=$BRANCH"
          echo "HEAD_SHA=$HEAD_SHA"
          echo "BASE_BRANCH=${BASE_BRANCH:-main}"
          echo "HANDOFF_HASH=$SHORT_HASH"

      - name: Stop if clean
        if: steps.handoff.outputs.should_run == 'false'
        run: |
          echo "No Codex run needed because handoff is clean/all green."

      - name: Check duplicate and attempt guard
        if: steps.handoff.outputs.should_run == 'true'
        id: guard
        env:
          FORCE: ${{ github.event.inputs.force || 'false' }}
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
          HEAD_SHA: ${{ steps.handoff.outputs.head_sha }}
          HANDOFF_HASH: ${{ steps.handoff.outputs.handoff_hash }}
          MAX_ATTEMPTS_PER_HEAD: "3"
        run: |
          set -euo pipefail

          STATE_DIR="$HOME/pickfair-auto-state/pr-$PR_NUMBER"
          mkdir -p "$STATE_DIR"

          ATTEMPT_FILE="$STATE_DIR/${HEAD_SHA}-${HANDOFF_HASH}.attempted"
          HEAD_ATTEMPTS="$(find "$STATE_DIR" -maxdepth 1 -type f -name "${HEAD_SHA}-*.attempted" | wc -l | tr -d ' ')"

          echo "Existing attempts for this head: $HEAD_ATTEMPTS"

          if [ "$FORCE" != "true" ] && [ -f "$ATTEMPT_FILE" ]; then
            echo "Already attempted this PR/head/handoff state."
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$FORCE" != "true" ] && [ "$HEAD_ATTEMPTS" -ge "$MAX_ATTEMPTS_PER_HEAD" ]; then
            echo "Maximum attempts reached for this PR head."
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          touch "$ATTEMPT_FILE"
          echo "should_continue=true" >> "$GITHUB_OUTPUT"

      - name: Stop duplicate or max attempts
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'false'
        run: |
          echo "Auto-fix attempt skipped because this state was already attempted or max attempts were reached."

      - name: Checkout PR branch
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        run: |
          set -euo pipefail
          git config user.name "pickfair-codex-auto"
          git config user.email "actions@github.com"
          git remote -v

      - name: Checkout and verify exact PR branch
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          EXPECTED_BRANCH: ${{ steps.handoff.outputs.branch }}
        run: |
          set -euo pipefail

          git fetch origin "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          git checkout -B "$EXPECTED_BRANCH" "origin/$EXPECTED_BRANCH"

          CURRENT_BRANCH="$(git branch --show-current)"

          if [ "$CURRENT_BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "Wrong branch."
            echo "Current: $CURRENT_BRANCH"
            echo "Expected: $EXPECTED_BRANCH"
            exit 1
          fi

          if [ "$CURRENT_BRANCH" = "main" ] || [ "$CURRENT_BRANCH" = "master" ]; then
            echo "Refusing to work on main/master."
            exit 1
          fi

          if ! git remote -v | grep -q origin; then
            echo "NEEDS_MANUAL_UPDATE_BRANCH"
            echo "No origin remote configured."
            exit 1
          fi

          git reset --hard "origin/$EXPECTED_BRANCH"

      - name: Verify Codex CLI login
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        run: |
          set -euo pipefail

          if ! command -v codex >/dev/null 2>&1; then
            echo "Codex CLI not found on self-hosted runner."
            echo "Install it first: npm install -g @openai/codex"
            exit 1
          fi

          codex --version || true

          if [ ! -d "$HOME/.codex" ]; then
            echo "Codex config directory not found: $HOME/.codex"
            echo "Run codex login once on the VPS runner user."
            exit 1
          fi

          echo "Codex CLI available."

      - name: Build rich Codex prompt context
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail

          mkdir -p .autofix/context codex-output

          echo "Building rich Codex prompt context for PR #${PR_NUMBER}"

          if ! gh pr view "$PR_NUMBER" \
            --json number,title,url,headRefName,headRefOid,mergeStateStatus,comments,reviews,files,statusCheckRollup \
            > .autofix/context/pr-view.json; then
            echo "::warning::gh pr view failed; using minimal PR context"
            printf '{"number":%s,"comments":[],"reviews":[],"files":[],"statusCheckRollup":[]}\n' "$PR_NUMBER" \
              > .autofix/context/pr-view.json
          fi

          QUERY='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved path line comments(first:20) { nodes { author { login } body createdAt url } } } } } } } }'

          if ! gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query="$QUERY" \
            > .autofix/context/review-threads-raw.json; then
            echo "::warning::Could not fetch review threads; continuing with empty review thread context"
            echo '{"data":{"repository":{"pullRequest":{"reviewThreads":{"nodes":[]}}}}}' \
              > .autofix/context/review-threads-raw.json
          fi

          if ! jq -c '.data.repository.pullRequest.reviewThreads.nodes[]?
            | select(.isResolved == false)
            | {
                path,
                line,
                comments: [
                  .comments.nodes[] | {
                    author: .author.login,
                    createdAt,
                    url,
                    body
                  }
                ]
              }' .autofix/context/review-threads-raw.json \
            > .autofix/context/review-threads.jsonl; then
            echo "::warning::Could not parse review threads; continuing with empty review thread context"
            : > .autofix/context/review-threads.jsonl
          fi

          {
            echo "# Codex rich PR context"
            echo
            echo "## PR metadata"
            jq -r '"PR: #\(.number // "'"$PR_NUMBER"'")\nTitle: \(.title // "")\nURL: \(.url // "")\nBranch: \(.headRefName // "")\nHead SHA: \(.headRefOid // "")\nMerge state: \(.mergeStateStatus // "")"' \
              .autofix/context/pr-view.json || true

            echo
            echo "## Blocking checks"
            jq -r '.statusCheckRollup[]?
              | {
                  name: (.name // .context // ""),
                  workflow: (.workflowName // ""),
                  state: (.conclusion // .state // .status // ""),
                  url: (.detailsUrl // .targetUrl // "")
                }
              | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL" and .state != "CANCELLED")
              | "- \(.name) [\(.state)] \(.url)"' \
              .autofix/context/pr-view.json || true

            echo
            echo "## PR comments"
            jq -r '.comments[]?
              | "- @" + (.author.login // "unknown") + ": " + ((.body // "") | gsub("\n"; " ") | .[0:2000])' \
              .autofix/context/pr-view.json || true

            echo
            echo "## Reviews"
            jq -r '.reviews[]?
              | "- @" + (.author.login // "unknown") + " [" + (.state // "") + "]: " + ((.body // "") | gsub("\n"; " ") | .[0:2000])' \
              .autofix/context/pr-view.json || true

            echo
            echo "## Review threads / inline review comments"
            if [ -s .autofix/context/review-threads.jsonl ]; then
              cat .autofix/context/review-threads.jsonl
            else
              echo "None fetched or none unresolved."
            fi

            echo
            echo "## Changed files"
            jq -r '.files[]?
              | "- \(.path) additions=\(.additions // 0) deletions=\(.deletions // 0) changeType=\(.changeType // "")"' \
              .autofix/context/pr-view.json || true
          } > .autofix/context/codex-prompt-context.txt

          jq -n \
            --slurpfile pr .autofix/context/pr-view.json \
            --rawfile review_threads .autofix/context/review-threads.jsonl \
            '{
              pr: ($pr[0] // {}),
              unresolved_review_threads_jsonl: $review_threads
            }' \
            > .autofix/context/codex-rich-context.json

          echo "Built rich Codex prompt context:"
          wc -c .autofix/context/codex-prompt-context.txt .autofix/context/codex-rich-context.json
      - name: Copy handoff into repo workspace
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          HANDOFF_SOURCE: ${{ steps.handoff.outputs.handoff_file }}
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail
          cp "$HANDOFF_SOURCE" "codex-task-handoff-pr-${PR_NUMBER}.md"

          {
            echo
            echo "## Rich PR context"
            cat "$RUNNER_TEMP/autofix-context/codex-prompt-context.txt" 2>/dev/null || true
          } >> "codex-task-handoff-pr-${PR_NUMBER}.md"

          echo "Copied enriched handoff into workspace:"
          ls -lh "codex-task-handoff-pr-${PR_NUMBER}.md"

      - name: Run Codex CLI with task handoff
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail

          mkdir -p codex-output
          HANDOFF="codex-task-handoff-pr-${PR_NUMBER}.md"

          echo "Starting Codex CLI..."
          echo "Handoff: $HANDOFF"

          set +e
          codex exec --full-auto \
            --output-last-message "codex-output/codex-result-pr-${PR_NUMBER}.md" \
            < "$HANDOFF" \
            2>&1 | tee "codex-output/codex-cli-pr-${PR_NUMBER}.log"
          CODEX_EXIT="${PIPESTATUS[0]}"
          set -e

          echo "$CODEX_EXIT" > "codex-output/codex-exit-code.txt"

          if [ "$CODEX_EXIT" -ne 0 ]; then
            echo "Codex CLI exited with code $CODEX_EXIT"
            exit "$CODEX_EXIT"
          fi

      - name: Retry Codex once on no-op with unresolved blockers
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail

          mkdir -p codex-output
          HANDOFF="codex-task-handoff-pr-${PR_NUMBER}.md"
          AGGRESSIVE_HANDOFF="codex-task-handoff-pr-${PR_NUMBER}-retry-noop.md"

          git status --porcelain=v1 -- . ':!codex-output' ':!codex-task-handoff-*.md' ':!.autofix' > codex-output/noop-status-before-retry.txt

          if [ -s codex-output/noop-status-before-retry.txt ]; then
            echo "Codex already produced code changes; no no-op retry needed."
            cat codex-output/noop-status-before-retry.txt
            exit 0
          fi

          echo "Codex produced no code changes. Checking whether blockers still exist..."

          gh pr view "$PR_NUMBER" --json statusCheckRollup \
            --jq '.statusCheckRollup[]?
              | {
                  name: (.name // .context // ""),
                  state: (.conclusion // .state // .status // ""),
                  url: (.detailsUrl // .targetUrl // "")
                }
              | select(.state != "SUCCESS" and .state != "SKIPPED" and .state != "NEUTRAL" and .state != "CANCELLED")
              | select((.name | test("Auto PR Codex Fix|Autofix PR until checks are green|PR Autofix Self-hosted")) | not)' \
            > codex-output/blocking-checks.jsonl

          QUERY='query($owner:String!, $repo:String!, $number:Int!) { repository(owner:$owner, name:$repo) { pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved path line comments(first:20) { nodes { author { login } body createdAt url } } } } } } }'

          gh api graphql \
            -f owner="${GITHUB_REPOSITORY_OWNER}" \
            -f repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" \
            -f query="$QUERY" \
            | jq -c '.data.repository.pullRequest.reviewThreads.nodes[]?
              | select(.isResolved == false)
              | {
                  path,
                  line,
                  comments: [
                    .comments.nodes[] | {
                      author: .author.login,
                      createdAt,
                      url,
                      body
                    }
                  ]
                }' \
            > codex-output/unresolved-review-threads.jsonl

          BLOCKING_CHECKS_COUNT="$(wc -l < codex-output/blocking-checks.jsonl | tr -d ' ')"
          UNRESOLVED_REVIEW_COUNT="$(wc -l < codex-output/unresolved-review-threads.jsonl | tr -d ' ')"

          echo "Blocking external checks: $BLOCKING_CHECKS_COUNT"
          echo "Unresolved review threads: $UNRESOLVED_REVIEW_COUNT"

          if [ "$BLOCKING_CHECKS_COUNT" -eq 0 ] && [ "$UNRESOLVED_REVIEW_COUNT" -eq 0 ]; then
            echo "No external blockers remain after no-op. Leaving workflow successful."
            exit 0
          fi

          cp "$HANDOFF" "$AGGRESSIVE_HANDOFF"

          {
            echo
            echo "## HARD NO-OP RETRY"
            echo
            echo "The previous Codex pass produced NO code changes, but this PR still has blocking checks or unresolved review threads."
            echo "You must make a minimal commit-worthy code/test/config change on the current PR branch, or explicitly fix the stale committed artifacts causing review failures."
            echo
            echo "Rules:"
            echo "- Do not exit without changes while blockers below remain."
            echo "- Prioritize unresolved review threads and failing external checks."
            echo "- Do not edit main/master."
            echo "- Do not commit codex-output, codex-task-handoff files, or .autofix/context artifacts."
            echo "- Keep the patch minimal and limited to the PR."
            echo
            echo "### Blocking external checks"
            if [ -s codex-output/blocking-checks.jsonl ]; then
              cat codex-output/blocking-checks.jsonl
            else
              echo "None."
            fi
            echo
            echo "### Unresolved review threads"
            if [ -s codex-output/unresolved-review-threads.jsonl ]; then
              cat codex-output/unresolved-review-threads.jsonl
            else
              echo "None."
            fi
          } >> "$AGGRESSIVE_HANDOFF"

          echo "Running aggressive no-op retry with blocker context..."

          set +e
          codex exec --full-auto \
            --output-last-message "codex-output/codex-result-pr-${PR_NUMBER}-retry-noop.md" \
            < "$AGGRESSIVE_HANDOFF" \
            2>&1 | tee "codex-output/codex-cli-pr-${PR_NUMBER}-retry-noop.log"
          CODEX_RETRY_EXIT="${PIPESTATUS[0]}"
          set -e

          echo "$CODEX_RETRY_EXIT" > "codex-output/codex-retry-exit-code.txt"

          if [ "$CODEX_RETRY_EXIT" -ne 0 ]; then
            echo "::error::Codex aggressive retry exited with code $CODEX_RETRY_EXIT"
            exit "$CODEX_RETRY_EXIT"
          fi

          git status --porcelain=v1 -- . ':!codex-output' ':!codex-task-handoff-*.md' ':!.autofix' > codex-output/noop-status-after-retry.txt

          if [ ! -s codex-output/noop-status-after-retry.txt ]; then
            {
              echo "Codex made no code changes even after aggressive retry."
              echo "Blocking external checks: $BLOCKING_CHECKS_COUNT"
              echo "Unresolved review threads: $UNRESOLVED_REVIEW_COUNT"
              echo
              echo "Blocking checks:"
              cat codex-output/blocking-checks.jsonl
              echo
              echo "Unresolved review threads:"
              cat codex-output/unresolved-review-threads.jsonl
            } > codex-output/noop-blockers.txt

            cat codex-output/noop-blockers.txt
            echo "::error::Codex no-op while blockers remain. See codex-output/noop-blockers.txt"
            exit 1
          fi

          echo "Aggressive retry produced changes:"
          cat codex-output/noop-status-after-retry.txt

      - name: Validate scope of changed files
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import os

          pr_number = os.environ["PR_NUMBER"]
          handoff = Path(f"codex-task-handoff-pr-{pr_number}.md")
          text = handoff.read_text(encoding="utf-8")

          def read_list_after(marker):
              lines = text.splitlines()
              values = []
              inside = False

              for line in lines:
                  stripped = line.strip()

                  if stripped == marker:
                      inside = True
                      continue

                  if inside:
                      if not stripped:
                          break
                      if stripped.startswith("- "):
                          value = stripped[2:].strip()
                          if (
                              value
                              and not value.lower().startswith("none detected")
                              and "*" not in value
                              and value.endswith(".py")
                              and " " not in value
                          ):
                              values.append(value)
                      elif stripped.startswith("## "):
                          break

              return values

          allowed = []
          allowed.extend(read_list_after("Allowed production files:"))
          allowed.extend(read_list_after("Allowed test files:"))

          allowed_set = set(allowed)

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1"],
              text=True,
          ).splitlines()

          changed = []

          for line in status:
              if not line.strip():
                  continue

              path = line[3:].strip()

              if " -> " in path:
                  path = path.split(" -> ", 1)[1].strip()

              changed.append(path)

          ignored_exact = {
              f"codex-task-handoff-pr-{pr_number}.md",
          }

          ignored_prefixes = (
              "codex-output/",
              ".autofix/",
              ".git/",
          )

          changed = sorted(
              set(
                  c for c in changed
                  if c not in ignored_exact
                  and not any(c.startswith(prefix) for prefix in ignored_prefixes)
              )
          )

          Path("codex-output/changed-files.txt").write_text(
              "\n".join(changed) + ("\n" if changed else ""),
              encoding="utf-8",
          )

          Path("codex-output/allowed-files.txt").write_text(
              "\n".join(sorted(allowed_set)) + ("\n" if allowed_set else ""),
              encoding="utf-8",
          )

          if not changed:
              print("No code changes detected.")
              sys.exit(0)

          if allowed_set:
              unexpected = [c for c in changed if c not in allowed_set]

              if unexpected:
                  print("Scope violation: Codex changed files outside allowed list.")
                  print("Allowed:")
                  for item in sorted(allowed_set):
                      print(f"  - {item}")
                  print("Unexpected:")
                  for item in unexpected:
                      print(f"  - {item}")
                  sys.exit(1)

          print("Changed files are within allowed scope:")
          for item in changed:
              print(f"  - {item}")
          PY

      - name: Smoke check changed Python files
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        run: |
          set -euo pipefail

          CHANGED_PY="$(cat codex-output/changed-files.txt 2>/dev/null | grep '\.py$' || true)"

          if [ -z "$CHANGED_PY" ]; then
            echo "No changed Python files to py_compile."
            exit 0
          fi

          echo "Running py_compile on changed Python files:"
          echo "$CHANGED_PY"

          python3 -m py_compile $CHANGED_PY

      - name: Show diff summary
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        run: |
          set -euo pipefail
          git status --short
          git diff --stat || true
          git diff -- . ':!codex-output' ':!codex-task-handoff-*.md' > codex-output/git-diff.patch || true

      - name: Commit and push changes
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true' && github.event.inputs.dry_run != 'true'
        id: push
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
          BRANCH: ${{ steps.handoff.outputs.branch }}
        run: |
          set -euo pipefail

          if [ ! -s codex-output/changed-files.txt ]; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            git add -- "$file"
          done < codex-output/changed-files.txt

          if git diff --cached --quiet; then
            echo "No staged changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Auto-fix PR ${PR_NUMBER} from Codex task handoff"
          git push origin "HEAD:${BRANCH}"

          NEW_SHA="$(git rev-parse HEAD)"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"

          echo "Pushed new SHA: $NEW_SHA"

      - name: Dry run summary
        if: steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true' && github.event.inputs.dry_run == 'true'
        run: |
          echo "Dry run enabled. No commit/push performed."
          git status --short || true

      - name: Upload Codex auto-fix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-pr-codex-fix-logs-${{ steps.handoff.outputs.pr_number || github.run_id }}
          path: |
            codex-output/**
            codex-task-handoff-pr-*.md
          if-no-files-found: ignore

      - name: Notify Telegram success
        if: success() && steps.handoff.outputs.should_run == 'true' && steps.guard.outputs.should_continue == 'true'
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
          BRANCH: ${{ steps.handoff.outputs.branch }}
          OLD_SHA: ${{ steps.handoff.outputs.head_sha }}
          NEW_SHA: ${{ steps.push.outputs.new_sha }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

            TEXT="$(printf '%s\n' \
              "🤖 Auto PR Codex Fix completato" \
              "" \
              "PR: #${PR_NUMBER}" \
              "Branch: ${BRANCH}" \
              "Old head: ${OLD_SHA:0:12}" \
              "New head: ${NEW_SHA:-unknown}" \
              "Pushed: ${PUSHED:-false}" \
              "Dry run: ${DRY_RUN}" \
              "" \
              "Ora GitHub rilancerà i check." \
              "Se restano rossi, verrà generato un nuovo handoff .md.")"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true" >/dev/null

          if [ -f "codex-output/codex-result-pr-${PR_NUMBER}.md" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@codex-output/codex-result-pr-${PR_NUMBER}.md" \
              -F "caption=Output finale Codex CLI PR #${PR_NUMBER}" >/dev/null
          fi

          if [ -f "codex-output/codex-cli-pr-${PR_NUMBER}.log" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@codex-output/codex-cli-pr-${PR_NUMBER}.log" \
              -F "caption=Log Codex CLI PR #${PR_NUMBER}" >/dev/null
          fi

      - name: Notify Telegram failure
        if: failure()
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number || github.event.inputs.pr_number || 'unknown' }}
          BRANCH: ${{ steps.handoff.outputs.branch || 'unknown' }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping failure notification."
            exit 0
          fi

            TEXT="$(printf '%s\n' \
              "❌ Auto PR Codex Fix fallito" \
              "" \
              "PR: #${PR_NUMBER:-unknown}" \
              "Branch: ${BRANCH:-unknown}" \
              "Dry run: ${DRY_RUN:-false}" \
              "" \
              "Controlla i log del workflow Auto PR Codex Fix.")"


          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true" >/dev/null

          if [ -f "codex-output/codex-result-pr-${PR_NUMBER}.md" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@codex-output/codex-result-pr-${PR_NUMBER}.md" \
              -F "caption=Output Codex CLI prima del fallimento PR #${PR_NUMBER}" >/dev/null
          fi

          if [ -f "codex-output/codex-cli-pr-${PR_NUMBER}.log" ]; then
            curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TELEGRAM_CHAT_ID}" \
              -F "document=@codex-output/codex-cli-pr-${PR_NUMBER}.log" \
              -F "caption=Log Codex CLI fallito PR #${PR_NUMBER}" >/dev/null
          fi
