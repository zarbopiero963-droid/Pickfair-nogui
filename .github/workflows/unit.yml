name: unit-tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    # PFC-002 (M156): solo main. Senza filtro il push sul branch di una PR
    # faceva girare questo workflow due volte, una per `push` e una per
    # `pull_request`, sullo stesso contenuto.
    branches: [main]
    paths:
      - "**.py"
      - "tests/unit/**"
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install -r requirements-test.txt

      - name: Run UNIT tests
        run: |
          pytest tests/unit -q -m "unit"