name: merge-simulation-hard
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# PFC-002 (M156): girava tre volte per push (da solo, annidato in ci-master-gate
# e in ci-dynamic-intelligent), ognuna con la suite completa. Ora parte solo da
# se' e non riesegue piu' pytest: la suite completa gira nel check `full-suite`
# sullo stesso albero (refs/pull/N/merge). Qui restano i controlli propri del
# merge con il main piu' recente: conflitti, marker e JSON dei guardrail.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: merge-simulation-hard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulate-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Simulate merge with main (fail-closed)
        run: |
          set -e
          git fetch origin main
          git checkout -b merge-sim-branch
          git merge --no-ff --no-edit origin/main || {
            echo "❌ MERGE CONFLICT DETECTED"
            exit 1
          }

      - name: Check merge markers
        run: |
          python scripts/check_merge_markers.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate all guardrail JSON
        run: |
          python scripts/validate_guardrails.py
