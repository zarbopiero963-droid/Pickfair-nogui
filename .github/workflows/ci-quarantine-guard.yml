name: CI Quarantine Guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/quarantined-workflows/**"
      - "scripts/ci/check_ci_quarantine.py"
      - "tests/guardrails/test_ci_quarantine.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/quarantined-workflows/**"
      - "scripts/ci/check_ci_quarantine.py"
      - "tests/guardrails/test_ci_quarantine.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quarantine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify privileged workflows remain quarantined
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify quarantine state
        run: python3 scripts/ci/check_ci_quarantine.py

      - name: Run quarantine regression tests
        run: python3 tests/guardrails/test_ci_quarantine.py
