name: CI Quarantine Guard

on:
  # Nessun filtro `paths:` di proposito: è un guard di sicurezza fail-closed e
  # deve girare su OGNI PR e push su main, non solo quando cambiano i file dei
  # workflow. Così una riattivazione/dispatch introdotta altrove non può saltare
  # il controllo per via del path filtering (Qodo). Il job è read-only e breve.
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quarantine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Verify privileged workflows remain quarantined
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify quarantine state
        run: python3 scripts/ci/check_ci_quarantine.py

      - name: Run quarantine regression tests
        run: python3 tests/guardrails/test_ci_quarantine.py
