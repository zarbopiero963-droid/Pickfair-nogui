name: PR Safe Autofix Canary
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "create or cleanup"
        required: false
        default: "create"
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: pr-safe-autofix-canary
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  canary:
    name: Safe autofix canary
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      REPO: ${{ github.repository }}
      MODE: ${{ github.event.inputs.mode || 'create' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "pickfair-safe-autofix-bot"
          git config user.email "pickfair-autofix-bot@users.noreply.github.com"

      - name: Run canary
        run: |
          python3 scripts/pr_flow_automation.py canary \
            --repo "$REPO" \
            --mode "$MODE"
