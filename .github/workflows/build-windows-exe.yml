name: Build Windows EXE

# Builds the Pickfair desktop GUI into a single-file Windows executable and
# uploads it as a downloadable artifact. Run it on demand from the Actions tab
# ("Run workflow"), or it runs automatically when a v* tag is pushed.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  # Validate the build whenever the packaging config itself changes, so a
  # broken spec/workflow is caught on the PR rather than on demand later.
  pull_request:
    paths:
      - ".github/workflows/build-windows-exe.yml"
      - "pickfair.spec"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: build-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # customtkinter is an optional (guarded) runtime import, not pinned in
          # requirements; install it so the bundled GUI uses the modern theme.
          pip install customtkinter
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm --clean pickfair.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-windows-exe
          path: dist/pickfair.exe
          if-no-files-found: error
