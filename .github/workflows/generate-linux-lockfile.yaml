name: Generate Linux Lockfile

# Genera l'hash-lock della toolchain di build Linux
# (requirements-build-linux.lock) a partire da requirements-build-linux.in.
#
# Il lock NON viene committato da questo workflow: viene pubblicato nella Job
# Summary (e nel log, tra marcatori) e va copiato a mano nel repo. Motivo: gli
# hash dei wheel sono specifici per piattaforma + versione di Python del runner,
# quindi la generazione DEVE avvenire QUI (ubuntu-latest / CPython 3.11), non in
# locale, altrimenti `--require-hashes` fallirebbe sul runner di build.
#
# Su PR che toccano il .in / il lock / questo workflow gira anche un gate
# ANTI-STALE: se un lock e' gia' committato deve combaciare bit-a-bit con la
# rigenerazione, altrimenti fallisce (lock stale => rigenera dalla Job Summary).

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "requirements-build-linux.in"
      - "requirements-build-linux.lock"
      - ".github/workflows/generate-linux-lockfile.yaml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Resolver deterministico: pip + pip-tools pinnati, cosi' la stessa .in
      # produce lo stesso lock (bit-identico) a ogni run sullo stesso runner.
      - name: Pin pip + pip-tools
        run: python -m pip install "pip==24.3.1" "pip-tools==7.4.1"

      # CUSTOM_COMPILE_COMMAND fissa l'header del lock (niente path assoluti del
      # runner nel commento "by the following command"); l'input passato come
      # path RELATIVO tiene i commenti "# via -r ..." relativi. Cosi' il lock e'
      # riproducibile e il gate anti-stale piu' sotto e' affidabile.
      - name: Compile lock (hashes)
        env:
          CUSTOM_COMPILE_COMMAND: "pip-compile --generate-hashes --allow-unsafe --output-file requirements-build-linux.lock requirements-build-linux.in"
        run: |
          pip-compile --generate-hashes --allow-unsafe \
            --output-file /tmp/fresh-linux.lock \
            requirements-build-linux.in

      # Pubblica il lock nella Job Summary (da copiare nel repo) e nel log
      # (stdout, tra marcatori) per una lettura affidabile.
      - name: Publish lock to Job Summary
        run: |
          {
            echo '## requirements-build-linux.lock'
            echo ''
            echo 'Copia questo contenuto in `requirements-build-linux.lock` alla root del repo e committa.'
            echo 'NON generarlo in locale: gli hash sono specifici per piattaforma + versione di Python del runner.'
            echo ''
            echo '```'
            cat /tmp/fresh-linux.lock
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "-----BEGIN LINUX LOCK-----"
          cat /tmp/fresh-linux.lock
          echo "-----END LINUX LOCK-----"

      # ANTI-DELETION: se il lock era presente su base ref non deve sparire in
      # una PR (sarebbe una regressione silenziosa a install NON verificati).
      - name: Guard against silent lock deletion
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:requirements-build-linux.lock" 2>/dev/null; then
            if [ ! -f requirements-build-linux.lock ]; then
              echo "::error::requirements-build-linux.lock presente su base ma rimosso nella PR (install non piu' hash-verificati). Ripristinalo."
              exit 1
            fi
          fi

      # ANTI-STALE: se un lock e' committato deve combaciare bit-a-bit con la
      # rigenerazione; altrimenti e' stale (dipendenze cambiate senza aggiornare
      # il lock) => fallisce.
      - name: Anti-stale (committed lock must match regeneration)
        run: |
          if [ -f requirements-build-linux.lock ]; then
            if ! diff -u requirements-build-linux.lock /tmp/fresh-linux.lock; then
              echo "::error::requirements-build-linux.lock e' STALE: rigeneralo dalla Job Summary di questo run e ricommittalo."
              exit 1
            fi
            echo "OK: il lock committato combacia con la rigenerazione."
          else
            echo "::notice::nessun requirements-build-linux.lock committato: copialo dalla Job Summary e committalo per attivare --require-hashes."
          fi
