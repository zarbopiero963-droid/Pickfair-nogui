name: PR Autofix Safe Supervisor
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      max_rounds:
        description: "Maximum safe fix rounds"
        required: false
        default: "3"
      pending_wait_seconds:
        description: "Maximum seconds to wait for pending checks"
        required: false
        default: "2700"
      dry_run:
        description: "Collect context but do not run Codex/push"
        required: false
        default: "false"


  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  check_run:
    types: [completed, rerequested]
  workflow_run:
    workflows:
      - pr-check
      - dutching
      - pnl-engine
      - stateful-integrity
      - merge-simulation-hard
      - CloudCLI PR Fix
    types: [completed]

concurrency:
  group: pr-autofix-safe-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  checks: read
  statuses: read
  actions: read

jobs:
  safe-autofix:
    name: Safe PR autofix
    timeout-minutes: 45
    if: >-
      ${{
        github.event_name != 'check_run' ||
        (
          github.event.check_run.pull_requests[0].number &&
          (
            contains(github.event.check_run.name, 'Codacy') ||
            contains(github.event.check_run.name, 'ultra-check')
          ) &&
          (
            github.event.check_run.conclusion == 'action_required' ||
            github.event.check_run.conclusion == 'failure' ||
            github.event.check_run.conclusion == 'timed_out'
          )
        )
      }}
    runs-on: [self-hosted, Linux, X64, pickfair-fixer, codex]

    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      DEEPSOURCE_API_TOKEN: ${{ secrets.DEEPSOURCE_API_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number }}
      MAX_ROUNDS: ${{ github.event.inputs.max_rounds || '3' }}
      PENDING_WAIT_SECONDS: ${{ github.event.inputs.pending_wait_seconds || '2700' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      CODEX_MODEL: gpt-5.3-codex
      HAS_CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN != '' }}
      HAS_PICKFAIR_ACTIONS_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN != '' }}

    steps:
      - name: Checkout supervisor source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          fetch-depth: 0

      - name: Copy safe collector
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/safe-autofix-tools"
          cp .github/scripts/pr_autofix_safe_context.py "$RUNNER_TEMP/safe-autofix-tools/pr_autofix_safe_context.py"
          chmod +x "$RUNNER_TEMP/safe-autofix-tools/pr_autofix_safe_context.py"

      - name: Configure git identity
        run: |
          git config --global user.name "pickfair-safe-autofix-bot"
          git config --global user.email "pickfair-autofix-bot@users.noreply.github.com"

      - name: Preflight safe autofix flow
        run: |
          python3 scripts/pr_flow_automation.py preflight \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --comment

      - name: Cleanup stale safe-autofix runs
        run: |
          set -euo pipefail
          keep="${GITHUB_RUN_ID}"
          echo "Current run: $keep"
          gh run list \
            --repo "$REPO" \
            --workflow=277606083 \
            --limit 80 \
            --json databaseId,status,event,createdAt,url \
          | jq -r --arg KEEP "$keep" '
              .[]
              | select(.status!="completed")
              | select((.databaseId|tostring) != $KEEP)
              | .databaseId
            ' \
          | while read -r old; do
              [ -z "$old" ] && continue
              echo "Cancel stale safe-autofix run $old"
              gh run cancel "$old" --repo "$REPO" || true
            done
      - name: Safe autofix loop
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::notice::No PR number available for this event. Skipping safe supervisor."
            exit 0
          fi

          PR_META="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,closed,mergedAt,isDraft,headRefName,url)"
          echo "$PR_META" > .autofix-pr-meta.json

          PR_STATE="$(jq -r '.state // ""' .autofix-pr-meta.json)"
          PR_CLOSED="$(jq -r '.closed // false' .autofix-pr-meta.json)"
          PR_MERGED="$(jq -r '(.mergedAt // "") != ""' .autofix-pr-meta.json)"
          PR_DRAFT="$(jq -r '.isDraft // false' .autofix-pr-meta.json)"
          PR_URL="$(jq -r '.url // ""' .autofix-pr-meta.json)"

          echo "PR state: $PR_STATE closed=$PR_CLOSED merged=$PR_MERGED draft=$PR_DRAFT url=$PR_URL"

          if [ "$PR_STATE" != "OPEN" ] || [ "$PR_CLOSED" = "true" ] || [ "$PR_MERGED" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is not open. Safe supervisor will not collect fix context or run Codex."
            exit 0
          fi

          if [ "$PR_DRAFT" = "true" ]; then
            echo "::notice::PR #$PR_NUMBER is draft. Safe supervisor will wait until ready_for_review."
            exit 0
          fi

          BRANCH="$(jq -r '.headRefName' .autofix-pr-meta.json)"
          echo "PR branch: $BRANCH"

          # Checkout robusto:
          # 1. prova branch remoto normale
          # 2. fallback su refs/pull/<PR>/head, che esiste anche quando il branch non è fetchabile direttamente
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Fetching PR branch from refs/heads/$BRANCH"
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          else
            echo "::warning::Remote branch $BRANCH not found directly. Falling back to refs/pull/$PR_NUMBER/head."
            git fetch origin "refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr-$PR_NUMBER-head"
            git checkout -B "$BRANCH" "refs/remotes/origin/pr-$PR_NUMBER-head"
          fi

          round=1
          while [ "$round" -le "$MAX_ROUNDS" ]; do
            echo "=============================="
            echo "SAFE AUTOFIX ROUND $round/$MAX_ROUNDS"
            echo "=============================="

            waited=0
            while true; do
              rm -rf .autofix/context
              mkdir -p .autofix/context

              python3 "$RUNNER_TEMP/safe-autofix-tools/pr_autofix_safe_context.py"
              set -a
              . .autofix/context/decision.env
              set +a

              echo "head=$HEAD_SHA pending=$PENDING_COUNT blockers=$BLOCKER_COUNT safe_files=$SAFE_FILE_COUNT should_fix=$SHOULD_FIX manual=$REQUIRES_MANUAL fatal=$FATAL_CONTEXT_ERROR"

              if [ "$PENDING_COUNT" = "0" ]; then
                break
              fi

              if [ "$waited" -ge "$PENDING_WAIT_SECONDS" ]; then
                echo "::warning::Pending checks did not finish within wait budget."
                exit 0
              fi

              echo "Pending checks remain. Waiting 60s..."
              sleep 60
              waited=$((waited + 60))
            done

            if [ "$BLOCKER_COUNT" = "0" ]; then
              echo "PR #$PR_NUMBER is clean."
              exit 0
            fi

            if [ "$FATAL_CONTEXT_ERROR" = "true" ]; then
              echo "::error::Required analyzer context could not be collected. Refusing to run Codex blindly."
              cat .autofix/context/decision.json
              exit 1
            fi

            if [ "$REQUIRES_MANUAL" = "true" ] || [ "$SAFE_FILE_COUNT" = "0" ]; then
              echo "::warning::Only manual/config/risky issues remain. Refusing unsafe code refactor."
              cat .autofix/context/codex-task.md
              exit 0
            fi

            echo "Allowed files:"
            cat .autofix/context/allowed-files.txt

            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry run requested. Stopping before Codex."
              cat .autofix/context/codex-task.md
              exit 0
            fi

            before_sha="$(git rev-parse HEAD)"
            echo "Before SHA: $before_sha"

            mkdir -p codex-output

            echo "Running Codex with safe handoff..."

            # Codex may edit files, but must not control git history or remote state.
            # The supervisor alone validates scope, stages, commits, pushes and rolls back.
            REAL_GIT="$(command -v git)"
            mkdir -p .autofix/codex-bin

            {
              printf '%s\n' '#!/usr/bin/env bash'
              printf '%s\n' 'cmd="${1:-}"'
              printf '%s\n' 'case "$cmd" in'
              printf '%s\n' '  add|commit|push|reset|merge|rebase|cherry-pick|tag|checkout|switch|restore|stash|clean|am)'
              printf '%s\n' '    echo "safe-autofix: git $cmd is disabled during Codex. Leave edits in the working tree; the supervisor will validate, commit, push, or roll back." >&2'
              printf '%s\n' '    exit 126'
              printf '%s\n' '    ;;'
              printf '%s\n' 'esac'
              printf '%s\n' 'exec "__REAL_GIT__" "$@"'
            } > .autofix/codex-bin/git

            sed -i "s#__REAL_GIT__#$REAL_GIT#g" .autofix/codex-bin/git
            chmod +x .autofix/codex-bin/git

            {
              printf '%s\n' ''
              printf '%s\n' '## Additional supervisor rule'
              printf '%s\n' 'Do not run git add, git commit, git push, git reset, git checkout, git switch, git restore, git stash, git clean, git merge, git rebase, git cherry-pick, or git tag.'
              printf '%s\n' 'Leave all edits unstaged in the working tree. The safe supervisor is the only process allowed to stage, commit, push, or roll back.'
            } >> .autofix/context/codex-task.md

            codex_help="$(codex exec --help 2>&1 || true)"
            codex_args=(exec --model "$CODEX_MODEL")

            if printf '%s\n' "$codex_help" | grep -q -- '--dangerously-bypass-approvals-and-sandbox'; then
              codex_args+=(--dangerously-bypass-approvals-and-sandbox)
            elif printf '%s\n' "$codex_help" | grep -q -- '--sandbox'; then
              codex_args+=(--sandbox danger-full-access)
            fi

            printf 'Codex command: codex'
            printf ' %q' "${codex_args[@]}"
            printf '\n'

            if PATH="$PWD/.autofix/codex-bin:$PATH" codex "${codex_args[@]}" - < .autofix/context/codex-task.md | tee "codex-output/safe-codex-round-${round}.log"; then
              echo "Codex completed."
            else
              echo "::error::Codex failed."
              exit 1
            fi

            if git diff --quiet && git diff --cached --quiet; then
              echo "::warning::Codex produced no changes. Stopping."
              exit 0
            fi

            echo "Validating changed file scope..."
            changed="$(
              {
                git diff --name-only
                git diff --cached --name-only
              } | sort -u
            )"
            echo "$changed"

            bad_files="$(
              comm -23 \
                <(printf '%s\n' "$changed" | sort -u) \
                <(sort -u .autofix/context/allowed-files.txt) || true
            )"

            if [ -n "$bad_files" ]; then
              echo "::error::Codex changed files outside allowlist:"
              echo "$bad_files"
              git diff --stat
              git reset --hard "$before_sha"
              exit 1
            fi

            echo "Compile changed Python files..."
            py_files="$(printf '%s\n' "$changed" | grep -E '\.py$' || true)"
            if [ -n "$py_files" ]; then
              python3 -m compileall $py_files
            fi

            echo "Diff summary:"
            git diff --stat HEAD -- $changed
            git diff HEAD -- $changed | sed -n '1,260p'

            git add -- $changed
            git commit -m "Safe autofix PR ${PR_NUMBER} round ${round}"
            git push origin "HEAD:$BRANCH"

            echo "Waiting for checks after safe push..."
            sleep 90

            # Rollback if core tests become red.
            post_json="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid,statusCheckRollup)"
            echo "$post_json" > .autofix/context/post-push-pr.json

            new_bad="$(
              jq -r '
                .statusCheckRollup[]?
                | {
                    name: (.name // .context // ""),
                    state: (.conclusion // .state // .status // "")
                  }
                | select(.state == "FAILURE" or .state == "ERROR" or .state == "ACTION_REQUIRED")
                | select(.name | test("unit|smoke|test-core-components|Integration Tests|core-invariants|End-to-End Tests"; "i"))
                | "\(.name) \(.state)"
              ' .autofix/context/post-push-pr.json
            )"

            if [ -n "$new_bad" ]; then
              echo "::error::Safe autofix made core checks red. Rolling back."
              echo "$new_bad"
              git reset --hard "$before_sha"
              git push --force-with-lease origin "HEAD:$BRANCH"
              exit 1
            fi

            round=$((round + 1))
          done

          echo "::warning::Reached max safe rounds."
          exit 0

      - name: Upload safe autofix context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-autofix-safe-context-${{ github.event.inputs.pr_number }}
          path: |
            .autofix/context/**
            codex-output/**
          if-no-files-found: ignore
