name: dutching

on:
  workflow_call:
  push:
    # PFC-002 (M156): solo main. Senza filtro il push sul branch di una PR
    # faceva girare questo workflow due volte, una per `push` e una per
    # `pull_request`, sullo stesso contenuto.
    branches: [main]
    paths:
      - "dutching.py"
      # PFC-002: i due path che prima vedeva solo il detector di
      # ci-dynamic-intelligent, che non lancia piu' questa lane (doppio run).
      - "controllers/dutching_controller.py"
      - "dutching_state.py"
      - "guardrails/specs/dutching.json"
      - "guardrails/contracts/dutching.json"
      - "guardrails/state_models/dutching.json"
      - "guardrails/mutations/dutching.json"
      - "tests/**/test_*dutching*.py"
  pull_request:
    paths:
      - "dutching.py"
      # PFC-002: i due path che prima vedeva solo il detector di
      # ci-dynamic-intelligent, che non lancia piu' questa lane (doppio run).
      - "controllers/dutching_controller.py"
      - "dutching_state.py"
      - "guardrails/specs/dutching.json"
      - "guardrails/contracts/dutching.json"
      - "guardrails/state_models/dutching.json"
      - "guardrails/mutations/dutching.json"
      - "tests/**/test_*dutching*.py"

jobs:
  run:
    uses: ./.github/workflows/_module-ultra-check.yml
    with:
      module_path: "dutching.py"
      spec_path: "guardrails/specs/dutching.json"
      contract_path: "guardrails/contracts/dutching.json"
      state_model_path: "guardrails/state_models/dutching.json"
      mutation_path: "guardrails/mutations/dutching.json"
      test_paths: "tests"