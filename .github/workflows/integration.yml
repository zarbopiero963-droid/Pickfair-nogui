name: Integration Tests
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    # PFC-002 (M156): solo main. Senza filtro il push sul branch di una PR
    # faceva girare questo workflow due volte, una per `push` e una per
    # `pull_request`, sullo stesso contenuto.
    branches: [main]
  pull_request:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/integration -q -m "integration"