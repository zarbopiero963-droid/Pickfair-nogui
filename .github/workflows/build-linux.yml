name: Build Linux Binary

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build-linux.yml"
      - "pickfair.spec"
      - "requirements.txt"
      - "main.py"
      - "mini_gui.py"
      - "packaging/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter
          pip install "pyinstaller>=6,<7"

      # Validate the packaging assets (icon reproducible, .desktop fields, bash
      # syntax, script fail-closed, workflow wiring) right in this workflow, so
      # a packaging regression is caught here and not only in the full test job.
      - name: Run packaging guardrail tests
        run: |
          python -m pip install pytest
          python -m pytest tests/packaging -q

      - name: Build executables
        run: pyinstaller --noconfirm --clean pickfair.spec

      # Upload the plain binaries FIRST so a later AppImage-packaging failure can
      # never drop the existing headless/GUI binary artifacts (they must not
      # depend on the new AppImage tooling).
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-binary
          path: |
            dist/pickfair
            dist/pickfair-headless
          if-no-files-found: error

      # Wrap the GUI binary into an AppImage so it installs like a real Linux
      # desktop app (icon + .desktop + application-menu entry, double-click).
      # The headless binary stays a plain server/CLI binary (no AppImage). The
      # packaging logic lives in packaging/build_appimage.sh so it is testable
      # outside CI. appimagetool runs FUSE-less (APPIMAGE_EXTRACT_AND_RUN=1) and
      # its download is integrity-verified against APPIMAGETOOL_SHA256 (pinned,
      # fail-closed on drift — see ops/linux_appimage.md). The pinned value is
      # set below once vetted from a green CI run (the script prints the actual
      # sha256 each run); until pinned, the script prints without enforcing.
      - name: Package GUI as AppImage
        env:
          # sha256 VETTED del binario `appimagetool` (canale ufficiale
          # `continuous`, build 295 del 2025-12-04, catturato da un run CI verde).
          # Enforcement fail-closed: se upstream aggiorna `continuous` l'hash
          # cambia e la CI fallisce di proposito → ri-verificare e aggiornare
          # questo valore (vedi ops/linux_appimage.md).
          APPIMAGETOOL_SHA256: "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0"
        run: |
          chmod +x packaging/build_appimage.sh packaging/AppRun
          packaging/build_appimage.sh dist/pickfair Pickfair-x86_64.AppImage
          test -f Pickfair-x86_64.AppImage
          ls -lh Pickfair-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: Pickfair-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-binary
          path: dist

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: .

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pickfair dist/pickfair-headless Pickfair-x86_64.AppImage \
            --repo "${GITHUB_REPOSITORY}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" \
            dist/pickfair dist/pickfair-headless Pickfair-x86_64.AppImage \
            --repo "${GITHUB_REPOSITORY}" --clobber
