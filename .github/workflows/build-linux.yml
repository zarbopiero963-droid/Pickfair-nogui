name: Build Linux Binary

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/build-linux.yml"
      - "pickfair.spec"
      - "requirements.txt"
      - "main.py"
      - "mini_gui.py"
      - "packaging/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install customtkinter
          pip install "pyinstaller>=6,<7"

      - name: Build executables
        run: pyinstaller --noconfirm --clean pickfair.spec

      # Wrap the GUI binary into an AppImage so it installs like a real Linux
      # desktop app (icon + .desktop + application-menu entry, double-click).
      # The headless binary stays a plain server/CLI binary (no AppImage). The
      # packaging logic lives in packaging/build_appimage.sh so it is testable
      # outside CI. appimagetool runs FUSE-less (APPIMAGE_EXTRACT_AND_RUN=1).
      - name: Package GUI as AppImage
        run: |
          chmod +x packaging/build_appimage.sh packaging/AppRun
          packaging/build_appimage.sh dist/pickfair Pickfair-x86_64.AppImage
          test -f Pickfair-x86_64.AppImage
          ls -lh Pickfair-x86_64.AppImage

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-binary
          path: |
            dist/pickfair
            dist/pickfair-headless
          if-no-files-found: error

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: Pickfair-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-binary
          path: dist

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: .

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/pickfair dist/pickfair-headless Pickfair-x86_64.AppImage \
            --repo "${GITHUB_REPOSITORY}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" \
            dist/pickfair dist/pickfair-headless Pickfair-x86_64.AppImage \
            --repo "${GITHUB_REPOSITORY}" --clobber
