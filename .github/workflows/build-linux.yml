name: Build Linux Binary

on:
  # Gli artefatti si costruiscono SOLO su richiesta esplicita (decisione owner:
  # niente build a ogni push/PR, per non consumare CI): a mano dalla tab Actions
  # oppure automaticamente su un tag di release v* (azione deliberata). La
  # validazione della config del lock resta su PR nel workflow leggero
  # generate-linux-lockfile.yaml (anti-stale), che NON fa il build pesante.
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Toolchain di build hash-verificata (FAIL-CLOSED): la toolchain si
      # installa SOLO dal lock (requirements-build-linux.lock, generato in CI da
      # generate-linux-lockfile.yaml) con --require-hashes — ogni pacchetto DEVE
      # avere un hash pinnato o pip rifiuta l'install (niente sostituzioni a
      # monte non verificate). Se il lock manca/e' stato rimosso si FALLISCE, NON
      # si ripiega su un install non pinnato (che riaprirebbe la supply-chain).
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          # NB: niente `pip install --upgrade pip` — scaricherebbe un pip NON
          # pinnato/non-hash prima del lock, riaprendo la supply-chain che il
          # fail-closed protegge (rilievo GPT-5.6 Sol). Si usa il pip
          # preinstallato del runner (parte dell'immagine, gia' recente e con
          # --require-hashes). Il lock e' l'unica sorgente della toolchain.
          if [ ! -f requirements-build-linux.lock ]; then
            echo "::error::requirements-build-linux.lock mancante: la toolchain di build e' hash-locked (fail-closed). Genera il lock con generate-linux-lockfile.yaml e committalo."
            exit 1
          fi
          echo ">> install hash-locked (requirements-build-linux.lock)"
          python -m pip install --require-hashes -r requirements-build-linux.lock

      # Fail-closed: la GUI usa tkinter/customtkinter; se il Python che compila
      # NON vede Tk (python3-tk mancante), l'eseguibile partirebbe senza
      # interfaccia. Meglio fallire QUI che produrre un binario rotto.
      - name: Verify Tk available (fail-closed)
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Validate the packaging assets (icon reproducible, .desktop fields, bash
      # syntax, script fail-closed, workflow wiring) right in this workflow, so
      # a packaging regression is caught here and not only in the full test job.
      - name: Run packaging guardrail tests
        run: |
          # pytest e' gia' nel lock (via requirements-dev); in legacy va aggiunto.
          python -c "import pytest" 2>/dev/null || python -m pip install pytest
          python -m pytest tests/packaging -q

      # Nome artifact versionato+datato (dalla version di pyproject.toml), così i
      # download sono identificabili senza aprire il file.
      - name: Artifact metadata (version + date)
        id: meta
        run: |
          # usa il `python` di setup-python (3.11 garantito, tomllib in stdlib),
          # non il python3 di sistema che potrebbe cambiare.
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ -n "$ver" ] || { echo "::error::version mancante in pyproject.toml"; exit 1; }
          stamp=$(date -u +%Y%m%d)
          echo "bintar=Pickfair-Linux-bin-v${ver}-${stamp}" >> "$GITHUB_OUTPUT"
          echo "appimage=Pickfair-v${ver}-x86_64.AppImage" >> "$GITHUB_OUTPUT"

      - name: Build executables
        run: pyinstaller --noconfirm --clean pickfair.spec

      # Impacchetta i binari nudi in tar.gz: actions/upload-artifact ZIPpa e NON
      # conserva i permessi POSIX → caricando il binario grezzo, al download il
      # bit +x va perso (mode 644). Un tar preserva mode 755 → scarica, estrai,
      # esegui. Caricati PRIMA dell'AppImage così un fallimento di packaging non
      # può togliere i binari esistenti (upload binari non dipende dall'AppImage).
      - name: Package binaries (tar.gz preserves +x)
        run: |
          chmod +x dist/pickfair dist/pickfair-headless
          tar -czf "${{ steps.meta.outputs.bintar }}.tar.gz" -C dist pickfair pickfair-headless

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-binary
          path: ${{ steps.meta.outputs.bintar }}.tar.gz
          if-no-files-found: error

      # Wrap the GUI binary into an AppImage so it installs like a real Linux
      # desktop app (icon + .desktop + application-menu entry, double-click).
      # The headless binary stays a plain server/CLI binary (tar.gz above). The
      # packaging logic lives in packaging/build_appimage.sh so it is testable
      # outside CI. appimagetool runs FUSE-less (APPIMAGE_EXTRACT_AND_RUN=1) and
      # its download is integrity-verified against APPIMAGETOOL_SHA256 (pinned,
      # fail-closed on drift — see ops/linux_appimage.md).
      - name: Package GUI as AppImage
        env:
          # `appimagetool` dalla release FISSA 1.9.1 (opzione B, owner su #562):
          # il canale `continuous` non conserva le build vecchie (la 295 del
          # 2025-12-04 non e' piu' scaricabile). sha256 osservato su due download
          # indipendenti; upstream non pubblica firme ne' checksum. Fail-closed
          # su drift: un hash diverso ferma la build (vedi ops/linux_appimage.md).
          APPIMAGETOOL_URL: "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
          APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
        run: |
          chmod +x packaging/build_appimage.sh packaging/AppRun
          packaging/build_appimage.sh dist/pickfair "${{ steps.meta.outputs.appimage }}"
          test -f "${{ steps.meta.outputs.appimage }}"
          ls -lh "${{ steps.meta.outputs.appimage }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: ${{ steps.meta.outputs.appimage }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries tarball
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-binary
          path: .

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: pickfair-linux-appimage
          path: .

      # Glob sui nomi versionati (non hardcodati) così il release job non si
      # rompe quando la version cambia.
      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # nullglob: senza, un pattern che non matcha resterebbe letterale e
          # verrebbe passato a `gh` (errore criptico). Validiamo i DUE gruppi
          # SEPARATAMENTE (rilievo Fugu): se manca UNO SOLO dei due asset
          # (tar.gz binari OPPURE AppImage) ci fermiamo FAIL-CLOSED, così non si
          # pubblica mai una release incompleta in silenzio.
          shopt -s nullglob
          bins=(Pickfair-Linux-bin-*.tar.gz)
          appimages=(Pickfair-*-x86_64.AppImage)
          if [ ${#bins[@]} -eq 0 ] || [ ${#appimages[@]} -eq 0 ]; then
            echo "::error::asset mancante (tar.gz binari: ${#bins[@]}, AppImage: ${#appimages[@]}) — release non pubblicata"; exit 1
          fi
          assets=("${bins[@]}" "${appimages[@]}")
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --generate-notes \
          || gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
