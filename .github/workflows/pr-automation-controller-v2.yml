name: PR Automation Controller V2

on:
  repository_dispatch:
    types: [pr_automation_controller_v2]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      dry_run:
        description: "Only report actions without executing"
        required: false
        default: "false"
      pending_wait_seconds:
        description: "Seconds to wait for pending checks"
        required: false
        default: "300"
      clean_scope_rebuild:
        description: "Enable clean scope rebuild escalation (auto/true/false)"
        required: false
        default: "auto"
      clean_scope_rebuild_mode:
        description: "Clean scope rebuild mode"
        required: false
        default: "auto"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_run:
    types: [completed, rerequested]
  workflow_run:
    workflows:
      - PR Autofix Safe Supervisor
      - PR Flow Guardrails
      - PR Merge Readiness
      - pr-check
      - dutching
      - pnl-engine
      - stateful-integrity
      - merge-simulation-hard
      - CloudCLI PR Fix
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pr-automation-controller-v2-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  controller:
    name: PR automation controller
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      REPO: ${{ github.repository }}
      INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
      INPUT_DRY_RUN: ${{ inputs.dry_run || '' }}
      INPUT_PENDING_WAIT_SECONDS: ${{ inputs.pending_wait_seconds || '' }}
      INPUT_CLEAN_SCOPE_REBUILD: ${{ inputs.clean_scope_rebuild || '' }}
      INPUT_CLEAN_SCOPE_REBUILD_MODE: ${{ inputs.clean_scope_rebuild_mode || '' }}
      PAYLOAD_PR_NUMBER: ${{ github.event.client_payload.pr_number || '' }}
      PAYLOAD_DRY_RUN: ${{ github.event.client_payload.dry_run || '' }}
      PAYLOAD_PENDING_WAIT_SECONDS: ${{ github.event.client_payload.pending_wait_seconds || '' }}
      PAYLOAD_CLEAN_SCOPE_REBUILD: ${{ github.event.client_payload.clean_scope_rebuild || '' }}
      PAYLOAD_CLEAN_SCOPE_REBUILD_MODE: ${{ github.event.client_payload.clean_scope_rebuild_mode || '' }}
    outputs:
      next_action: ${{ steps.decision.outputs.next_action }}
      pr_number: ${{ steps.decision.outputs.pr_number }}
      clean_scope_rebuild_mode: ${{ steps.decision.outputs.clean_scope_rebuild_mode }}
    steps:
      - name: Checkout controller source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}

      - name: Resolve controller inputs
        run: |
          set -euo pipefail

          PR_NUMBER="${INPUT_PR_NUMBER:-}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${PAYLOAD_PR_NUMBER:-}"
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            PR_NUMBER="$(
              jq -r '
                .pull_request.number //
                .workflow_run.pull_requests[0].number //
                .check_run.pull_requests[0].number //
                empty
              ' "$GITHUB_EVENT_PATH"
            )"
          fi

          DRY_RUN="${INPUT_DRY_RUN:-}"
          if [ -z "$DRY_RUN" ]; then
            DRY_RUN="${PAYLOAD_DRY_RUN:-false}"
          fi

          PENDING_WAIT_SECONDS="${INPUT_PENDING_WAIT_SECONDS:-}"
          if [ -z "$PENDING_WAIT_SECONDS" ]; then
            PENDING_WAIT_SECONDS="${PAYLOAD_PENDING_WAIT_SECONDS:-300}"
          fi

          CLEAN_SCOPE_REBUILD="${INPUT_CLEAN_SCOPE_REBUILD:-}"
          if [ -z "$CLEAN_SCOPE_REBUILD" ]; then
            CLEAN_SCOPE_REBUILD="${PAYLOAD_CLEAN_SCOPE_REBUILD:-auto}"
          fi

          CLEAN_SCOPE_REBUILD_MODE="${INPUT_CLEAN_SCOPE_REBUILD_MODE:-}"
          if [ -z "$CLEAN_SCOPE_REBUILD_MODE" ]; then
            CLEAN_SCOPE_REBUILD_MODE="${PAYLOAD_CLEAN_SCOPE_REBUILD_MODE:-auto}"
          fi

          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "DRY_RUN=$DRY_RUN" >> "$GITHUB_ENV"
          echo "PENDING_WAIT_SECONDS=$PENDING_WAIT_SECONDS" >> "$GITHUB_ENV"
          echo "CLEAN_SCOPE_REBUILD=$CLEAN_SCOPE_REBUILD" >> "$GITHUB_ENV"
          echo "CLEAN_SCOPE_REBUILD_MODE=$CLEAN_SCOPE_REBUILD_MODE" >> "$GITHUB_ENV"

          echo "event=${GITHUB_EVENT_NAME}"
          echo "PR_NUMBER=${PR_NUMBER:-}"
          echo "DRY_RUN=${DRY_RUN:-}"
          echo "PENDING_WAIT_SECONDS=${PENDING_WAIT_SECONDS:-}"
          echo "CLEAN_SCOPE_REBUILD=${CLEAN_SCOPE_REBUILD:-}"
          echo "CLEAN_SCOPE_REBUILD_MODE=${CLEAN_SCOPE_REBUILD_MODE:-}"

      - name: Run PR automation controller
        run: |
          set -euo pipefail
          mkdir -p pr-controller

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            printf '%s\n' \
              '{' \
              '  "next_action": "skip_no_pr_number",' \
              '  "reason": "event did not include a pull request number"' \
              '}' > pr-controller/decision.json
            cat pr-controller/decision.json
            exit 0
          fi

          controller_args=(
            --repo "$REPO"
            --pr "$PR_NUMBER"
            --pending-wait-seconds "$PENDING_WAIT_SECONDS"
            --output pr-controller/decision.json
          )

          if python3 scripts/pr_automation_controller.py --help | grep -q -- "--clean-scope-rebuild"; then
            controller_args+=(--clean-scope-rebuild "$CLEAN_SCOPE_REBUILD")
          fi
          if python3 scripts/pr_automation_controller.py --help | grep -q -- "--clean-scope-rebuild-mode"; then
            controller_args+=(--clean-scope-rebuild-mode "$CLEAN_SCOPE_REBUILD_MODE")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            controller_args+=(--dry-run)
          fi

          python3 scripts/pr_automation_controller.py "${controller_args[@]}"

      - name: Export controller decision outputs
        id: decision
        if: always()
        run: |
          set -euo pipefail
          next_action="$(jq -r '.next_action // ""' pr-controller/decision.json)"
          pr_number="$(jq -r '.pr // ""' pr-controller/decision.json)"
          csr_mode="$(jq -r '.clean_scope_rebuild_mode // env.CLEAN_SCOPE_REBUILD_MODE // "auto"' pr-controller/decision.json)"
          echo "next_action=$next_action" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "clean_scope_rebuild_mode=$csr_mode" >> "$GITHUB_OUTPUT"

      - name: Ensure controller decision exists
        if: always()
        run: |
          set -euo pipefail
          mkdir -p pr-controller
          if [ ! -f pr-controller/decision.json ]; then
            printf '%s\n' \
              '{' \
              '  "next_action": "controller_no_decision_file",' \
              '  "reason": "controller completed without writing decision.json"' \
              '}' > pr-controller/decision.json
          fi
          echo "=== pr-controller ==="
          find pr-controller -maxdepth 2 -type f -print -exec sed -n '1,220p' {} \;

      - name: Upload controller decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-automation-controller-v2-${{ github.run_id }}
          path: pr-controller/
          if-no-files-found: error

  clean-scope-rebuild:
    name: Clean Scope Rebuild
    needs: [controller]
    if: ${{ needs.controller.outputs.next_action == 'launch_clean_scope_rebuild' && needs.controller.outputs.pr_number != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.controller.outputs.pr_number }}
      CLEAN_SCOPE_REBUILD_MODE: ${{ needs.controller.outputs.clean_scope_rebuild_mode }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}

      - name: Run clean scope rebuild
        run: |
          set -euo pipefail
          mkdir -p pr-clean-scope-rebuild
          python3 scripts/pr_clean_scope_rebuild.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --mode "$CLEAN_SCOPE_REBUILD_MODE" \
            --output "pr-clean-scope-rebuild/decision.json"

      - name: Ensure clean rebuild decision exists
        if: always()
        run: |
          set -euo pipefail
          mkdir -p pr-clean-scope-rebuild
          if [ ! -f pr-clean-scope-rebuild/decision.json ]; then
            printf '%s\n' \
              '{' \
              '  "action": "clean_scope_rebuild",' \
              '  "pr": "'"${PR_NUMBER}"'",' \
              '  "final_status": "missing_decision_file"' \
              '}' > pr-clean-scope-rebuild/decision.json
          fi
          cat pr-clean-scope-rebuild/decision.json

      - name: Upload clean rebuild decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-clean-scope-rebuild-${{ needs.controller.outputs.pr_number }}
          path: pr-clean-scope-rebuild/decision.json
          if-no-files-found: error
