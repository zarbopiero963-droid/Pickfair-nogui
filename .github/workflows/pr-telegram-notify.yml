name: PR Telegram Notify

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to inspect"
        required: true
        type: string

  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

  check_run:
    types: [completed]

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read

concurrency:
  group: pr-telegram-notify-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.sha }}
  cancel-in-progress: false

jobs:
  notify:
    name: Build Codex task handoff and notify Telegram
    runs-on: ubuntu-latest

    steps:
      - name: Collect PR health and build Codex task handoff
        id: collect
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");
            const crypto = require("crypto");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repoFull = `${owner}/${repo}`;

            const IS_MANUAL_RUN = context.eventName === "workflow_dispatch";
            const WAIT_UNTIL_CHECKS_SETTLED = true;

            core.setOutput("is_manual_run", IS_MANUAL_RUN ? "true" : "false");

            const MAX_FAILED_RUNS = 8;
            const MAX_FAILED_JOBS_PER_RUN = 4;
            const MAX_LOG_CHARS_PER_JOB = 4500;
            const MAX_ANNOTATIONS_TOTAL = 140;
            const MAX_ANNOTATION_CHARS = 1000;
            const MAX_REVIEW_THREADS = 80;
            const MAX_THREAD_COMMENT_CHARS = 1800;
            const MAX_NEW_COMMENTS = 80;
            const MAX_NEW_COMMENT_CHARS = 1600;

            function sha256(text) {
              return crypto.createHash("sha256").update(text).digest("hex");
            }

            function shortSha(sha) {
              return sha ? sha.slice(0, 12) : "n/a";
            }

            function clean(text) {
              return String(text || "")
                .replace(/\r/g, "")
                .replace(/[ \t]+$/gm, "")
                .trim();
            }

            function truncate(text, max) {
              text = String(text || "");
              if (text.length <= max) return text;
              return text.slice(0, max) + "\n...[truncated]...";
            }

            function oneLine(text, max = 180) {
              const value = clean(text).replace(/\s+/g, " ");
              if (value.length <= max) return value;
              return value.slice(0, max - 1).trimEnd() + "…";
            }

            function isSelfCheckName(name) {
              const value = String(name || "").toLowerCase();

              return (
                value.includes("pr telegram notify") ||
                value.includes("build codex handoff") ||
                value.includes("codex handoff") ||
                value.includes("send pr status report to telegram") ||
                value.includes("send pr failure/comment report to telegram") ||
                value.includes("pr health monitor") ||
                value.includes("pr-health-monitor") ||
                value.includes("monitor pr health") ||
                value.includes("pr codex monitor") ||
                value.includes("pr-codex-monitor")
              );
            }

            function isMonitorNoise(login, body) {
              const user = String(login || "").toLowerCase();
              const text = String(body || "").toLowerCase();

              const patterns = [
                "pickfair-codex-monitor",
                "pr-health-monitor",
                "pr telegram notify",
                "rilevato dal monitor automatico",
                "monitor automatico",
                "automatic monitor",
                "ho commentato automaticamente la pr con @codex",
                "review comment ai",
                "inoltrato a codex",
                "questo review comment ai",
                "codex-auto:ci-failure",
                "@codex continue on the same open pr",
              ];

              if (user === "github-actions[bot]" && text.includes("monitor")) return true;

              return patterns.some(p => text.includes(p));
            }

            function isAnnotationNoise(annotation, checkName) {
              const text = [
                checkName,
                annotation.title,
                annotation.message,
                annotation.raw_details,
                annotation.path,
              ].join("\n").toLowerCase();

              if (isSelfCheckName(checkName)) return true;
              if (text.includes("node.js 20 actions are deprecated")) return true;
              if (text.includes("node.js 20") && text.includes("deprecated")) return true;
              if (text.includes("actions/upload-artifact") && text.includes("node.js 20")) return true;
              if (text.includes("actions/github-script") && text.includes("node.js 20")) return true;
              if (text.includes("pr-health-monitor")) return true;
              if (text.includes("pr-codex-monitor")) return true;
              if (text.includes("pr telegram notify")) return true;

              return false;
            }

            function normalizeProblem(body) {
              let text = clean(body).toLowerCase();

              text = text.replace(/<!--[\s\S]*?-->/g, " ");
              text = text.replace(/https?:\/\/\S+/g, " ");
              text = text.replace(/```[\s\S]*?```/g, " ");
              text = text.replace(/`[^`]+`/g, " ");
              text = text.replace(/\b[0-9a-f]{7,40}\b/g, "<sha>");
              text = text.replace(/\b\d+\b/g, "<n>");
              text = text.replace(/\s+/g, " ").trim();

              return text.slice(0, 900);
            }

            const ISSUE_DEFINITIONS = {
              tick_staticmethods: {
                title: "Fix tick_dispatcher.py DeepSource staticmethod residues",
                file: "tick_dispatcher.py",
                location: "_invalid_tick_reason / _dispatch_storage_callbacks / _dispatch_batch_callbacks",
                priority: "P2",
                problem:
                  "DeepSource may report helper methods that do not use self and should be static methods.",
                requiredFix:
                  "If these helpers do not use self, decorate them with @staticmethod while preserving behavior. Add/keep helper docstrings only if style/docstring checks require it.",
                expectedShape:
                  "@staticmethod\n" +
                  "def _invalid_tick_reason(...):\n" +
                  "    ...\n\n" +
                  "@staticmethod\n" +
                  "def _dispatch_storage_callbacks(...):\n" +
                  "    ...\n\n" +
                  "@staticmethod\n" +
                  "def _dispatch_batch_callbacks(...):\n" +
                  "    ...",
              },

              executor_wait_cleanup_race: {
                title: "Fix ExecutorManager future cleanup without wait race",
                file: "executor_manager.py",
                location: "ExecutorManager.submit / ExecutorManager.wait / active/status APIs",
                priority: "P1",
                problem:
                  "Completed named futures must remain observable by wait(name), but waited futures must be cleaned afterward. Cleanup must not register callbacks while holding self._lock or create a callback lock/deadlock race.",
                requiredFix:
                  "Use a minimal deterministic design: submit stores the future under lock and returns it; wait(name) retrieves the future under lock, calls future.result(timeout) outside lock, then removes that exact future from _futures under lock. active_tasks/status must not report completed futures as active.",
                expectedShape:
                  "future = self._futures.get(task_name)\n" +
                  "result = future.result(timeout=timeout)\n" +
                  "with self._lock:\n" +
                  "    if self._futures.get(task_name) is future:\n" +
                  "        self._futures.pop(task_name, None)",
              },

              auto_throttle_no_round_up: {
                title: "Fix AutoThrottle api_calls_min conversion so it never rounds upward",
                file: "auto_throttle.py",
                location: "AutoThrottle.update",
                priority: "P1",
                problem:
                  "api_calls_min conversion must not use round(), because rounding can exceed the upstream per-minute cap.",
                requiredFix:
                  "Replace round-based conversion with floor-like conversion using math.floor or int() truncation after positive parse. Keep max_calls at least 1 only for positive api_calls_min where computed allowed calls would otherwise be 0. Ensure accepted update resets _blocked = False.",
                expectedShape:
                  "allowed_calls = int((parsed * self.period) / 60.0)\n" +
                  "self.max_calls = max(1, allowed_calls)\n" +
                  "self._blocked = False",
              },

              callback_exception_logging: {
                title: "Make TickDispatcher callback failures visible via logging",
                file: "tick_dispatcher.py",
                location: "_dispatch_storage_callbacks / _dispatch_batch_callbacks",
                priority: "P2",
                problem:
                  "Callback helper exceptions must not be silently swallowed with bare except Exception: pass.",
                requiredFix:
                  "Replace silent pass with logger.exception(...) or logger.warning(..., exc_info=True). Preserve existing behavior by not raising callback exceptions to the dispatch caller unless existing behavior requires raising.",
                expectedShape:
                  "except Exception:\n" +
                  "    logger.exception(\"...\")",
              },

              invalid_tick_reason_handling: {
                title: "Preserve or log invalid tick reason",
                file: "tick_dispatcher.py",
                location: "_invalid_tick_reason / _record_invalid_tick / dispatch_tick",
                priority: "P2",
                problem:
                  "_invalid_tick_reason may return a reason that is discarded by _record_invalid_tick.",
                requiredFix:
                  "Use the reason minimally: log it when recording the invalid tick, or store minimal last_invalid_reason / count-by-reason only if already consistent with stats. Do not broaden public metrics unless tests require it.",
                expectedShape:
                  "reason = self._invalid_tick_reason(tick)\n" +
                  "if reason is not None:\n" +
                  "    self._record_invalid_tick(tick, reason)\n" +
                  "    return",
              },

              test_codacy_cleanup: {
                title: "Fix focused PR4 test Codacy residues without weakening coverage",
                file: "tests/unit/test_tick_throttle_executor_determinism.py",
                location: "focused PR4 tests",
                priority: "P3",
                problem:
                  "Codacy may flag test-only residues such as no module docstring, bare assert/B101, long test names, method length, invalid type calls, or duplicated clones.",
                requiredFix:
                  "Fix only still-valid test issues. Do not weaken coverage. Use pytest assertions/helpers, module docstring, shorter names, cast(Any, ...) or type ignore for intentional invalid calls, and small helpers only when useful.",
                expectedShape:
                  "\"\"\"Focused PR4 determinism regression tests.\"\"\"\n" +
                  "from typing import Any, cast\n" +
                  "...\n" +
                  "pytest.fail(...) or explicit helper assertions instead of bare assert",
              },

              singleton_race_test: {
                title: "Improve TickDispatcher singleton race test only if still valid",
                file: "tests/unit/test_tick_throttle_executor_determinism.py",
                location: "singleton race test",
                priority: "P3",
                problem:
                  "CodeRabbit may flag that the singleton race test does not actually reset the module global or exercise the lock.",
                requiredFix:
                  "If still valid and low-risk, reset tick_dispatcher._dispatcher to None with cleanup restore and use threading.Barrier to start threads together. If fragile, skip with reason.",
                expectedShape:
                  "old_dispatcher = tick_dispatcher._dispatcher\n" +
                  "tick_dispatcher._dispatcher = None\n" +
                  "barrier = threading.Barrier(worker_count)\n" +
                  "try:\n" +
                  "    ...\n" +
                  "finally:\n" +
                  "    tick_dispatcher._dispatcher = old_dispatcher",
              },

              docstring_changed_helpers: {
                title: "Add docstrings only to changed PR4 helpers/tests if required",
                file: "tick_dispatcher.py / auto_throttle.py / executor_manager.py / tests/unit/test_tick_throttle_executor_determinism.py",
                location: "changed helpers/tests only",
                priority: "P3",
                problem:
                  "Docstring coverage warnings may appear, but they are not a required blocker unless configured as required.",
                requiredFix:
                  "Do not mass-docstring the repository. Add docstrings only to new/changed PR4 helpers/tests where local static tools complain.",
                expectedShape:
                  "Minimal helper/test docstrings only where needed.",
              },
            };

            function classifyText(text, path = "") {
              const value = `${path}\n${text}`.toLowerCase();

              if (
                value.includes("staticmethod") ||
                value.includes("does not use self") ||
                value.includes("_invalid_tick_reason") ||
                value.includes("_dispatch_storage_callbacks") ||
                value.includes("_dispatch_batch_callbacks")
              ) {
                if (value.includes("tick_dispatcher")) return "tick_staticmethods";
              }

              if (
                value.includes("executor_manager") ||
                value.includes("future cleanup") ||
                value.includes("_futures") ||
                value.includes("wait(\"fast\"") ||
                value.includes("fast") && value.includes("wait") && value.includes("future") ||
                value.includes("add_done_callback") ||
                value.includes("callback deadlock")
              ) {
                return "executor_wait_cleanup_race";
              }

              if (
                value.includes("api_calls_min") ||
                value.includes("round(") ||
                value.includes("round upward") ||
                value.includes("per-minute cap") ||
                value.includes("_blocked") ||
                value.includes("max_calls")
              ) {
                return "auto_throttle_no_round_up";
              }

              if (
                value.includes("except exception") ||
                value.includes("bare except") ||
                value.includes("silently swallowed") ||
                value.includes("callback exception") ||
                value.includes("logger.exception") ||
                value.includes("logger.warning")
              ) {
                if (value.includes("tick_dispatcher") || value.includes("callback")) {
                  return "callback_exception_logging";
                }
              }

              if (
                value.includes("invalid reason") ||
                value.includes("invalid_tick_reason") ||
                value.includes("record_invalid") ||
                value.includes("last_invalid") ||
                value.includes("invalid tick reason")
              ) {
                return "invalid_tick_reason_handling";
              }

              if (
                value.includes("b101") ||
                value.includes("bare assert") ||
                value.includes("module docstring") ||
                value.includes("test name") ||
                value.includes("test_tick_throttle_executor_determinism") ||
                value.includes("cast(any") ||
                value.includes("type: ignore")
              ) {
                return "test_codacy_cleanup";
              }

              if (
                value.includes("_dispatcher") ||
                value.includes("barrier") ||
                value.includes("singleton") ||
                value.includes("race test")
              ) {
                return "singleton_race_test";
              }

              if (
                value.includes("docstring coverage") ||
                value.includes("missing function or method docstring") ||
                value.includes("d203") ||
                value.includes("docstring")
              ) {
                return "docstring_changed_helpers";
              }

              return null;
            }

            function issueFromKey(key) {
              return ISSUE_DEFINITIONS[key] ? { key, ...ISSUE_DEFINITIONS[key], evidence: [] } : null;
            }

            function addIssue(map, key, evidence) {
              if (!key || !ISSUE_DEFINITIONS[key]) return;

              if (!map.has(key)) {
                map.set(key, issueFromKey(key));
              }

              if (evidence) {
                map.get(key).evidence.push(evidence);
              }
            }

            async function inferPrNumber() {
              if (context.eventName === "check_run") {
                const checkName = context.payload.check_run?.name || "";
                if (isSelfCheckName(checkName)) {
                  core.info("Skipping self check_run.");
                  return null;
                }
              }

              if (context.payload.pull_request?.number) {
                return context.payload.pull_request.number;
              }

              if (context.payload.inputs?.pr_number) {
                return Number(context.payload.inputs.pr_number);
              }

              if (context.payload.check_run?.pull_requests?.length) {
                return context.payload.check_run.pull_requests[0].number;
              }

              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: "open",
                per_page: 100,
              });

              const nonDraft = openPrs.filter(pr => !pr.draft);

              if (nonDraft.length === 1) {
                return nonDraft[0].number;
              }

              core.info(`Cannot infer PR safely. Open non-draft PR count: ${nonDraft.length}`);
              return null;
            }

            async function getPr(prNumber) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              return data;
            }

            async function getPrFiles(prNumber) {
              try {
                return await github.paginate(github.rest.pulls.listFiles, {
                  owner,
                  repo,
                  pull_number: prNumber,
                  per_page: 100,
                });
              } catch (err) {
                core.warning(`Could not read PR files: ${err.message}`);
                return [];
              }
            }

            async function getHeadCommitDate(headSha) {
              const { data } = await github.rest.repos.getCommit({
                owner,
                repo,
                ref: headSha,
              });

              return new Date(
                data.commit?.committer?.date ||
                data.commit?.author?.date ||
                data.committer?.date ||
                data.author?.date ||
                new Date().toISOString()
              );
            }

            async function getStatuses(headSha) {
              try {
                const { data } = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100,
                });

                const latestByContext = new Map();

                for (const s of data.statuses || []) {
                  const name = s.context || "status";
                  if (isSelfCheckName(name)) continue;

                  if (!latestByContext.has(name)) {
                    latestByContext.set(name, {
                      kind: "status",
                      id: null,
                      name,
                      state: s.state,
                      status: s.state,
                      conclusion: s.state,
                      url: s.target_url || "",
                      description: s.description || "",
                      summary: "",
                    });
                  }
                }

                return Array.from(latestByContext.values());
              } catch (err) {
                core.warning(`Could not read combined statuses: ${err.message}`);
                return [];
              }
            }

            async function getCheckRuns(headSha) {
              try {
                const runs = await github.paginate(github.rest.checks.listForRef, {
                  owner,
                  repo,
                  ref: headSha,
                  per_page: 100,
                });

                return runs
                  .filter(r => !isSelfCheckName(r.name))
                  .map(r => ({
                    kind: "check_run",
                    id: r.id,
                    name: r.name,
                    status: r.status,
                    conclusion: r.conclusion,
                    url: r.html_url || r.details_url || "",
                    details_url: r.details_url || "",
                    description: "",
                    summary: clean(r.output?.summary || r.output?.text || ""),
                    annotations_count: r.output?.annotations_count || 0,
                  }));
              } catch (err) {
                core.warning(`Could not read check runs: ${err.message}`);
                return [];
              }
            }

            async function getCheckAnnotations(checkRunId, checkName) {
              try {
                const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                  owner,
                  repo,
                  check_run_id: checkRunId,
                  per_page: 100,
                });

                return annotations
                  .map(a => ({
                    path: a.path || "",
                    start_line: a.start_line || a.end_line || "",
                    end_line: a.end_line || "",
                    annotation_level: a.annotation_level || "",
                    message: truncate(clean(a.message || ""), MAX_ANNOTATION_CHARS),
                    title: truncate(clean(a.title || ""), MAX_ANNOTATION_CHARS),
                    raw_details: truncate(clean(a.raw_details || ""), MAX_ANNOTATION_CHARS),
                  }))
                  .filter(a => !isAnnotationNoise(a, checkName));
              } catch (err) {
                core.warning(`Could not read annotations for check ${checkRunId}: ${err.message}`);
                return [];
              }
            }

            function isFailedCheck(c) {
              if (c.kind === "status") {
                return ["failure", "error"].includes(c.state);
              }

              if (c.status !== "completed") return false;

              return [
                "failure",
                "timed_out",
                "cancelled",
                "action_required",
                "startup_failure",
              ].includes(c.conclusion || "");
            }

            function isPendingCheck(c) {
              if (c.kind === "status") {
                return c.state === "pending";
              }

              return c.status && c.status !== "completed";
            }

            async function getWorkflowRuns(headSha) {
              try {
                const { data } = await github.request(
                  "GET /repos/{owner}/{repo}/actions/runs",
                  {
                    owner,
                    repo,
                    head_sha: headSha,
                    per_page: 50,
                  }
                );

                return (data.workflow_runs || []).filter(r => !isSelfCheckName(r.name));
              } catch (err) {
                core.warning(`Could not read workflow runs: ${err.message}`);
                return [];
              }
            }

            async function getWorkflowJobs(runId) {
              try {
                return await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner,
                  repo,
                  run_id: runId,
                  per_page: 100,
                });
              } catch (err) {
                core.warning(`Could not read jobs for run ${runId}: ${err.message}`);
                return [];
              }
            }

            async function getJobLog(jobId) {
              try {
                const response = await github.request(
                  "GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs",
                  {
                    owner,
                    repo,
                    job_id: jobId,
                  }
                );

                if (typeof response.data === "string") return response.data;
                if (Buffer.isBuffer(response.data)) return response.data.toString("utf8");
                if (response.data instanceof ArrayBuffer) return Buffer.from(response.data).toString("utf8");

                return String(response.data || "");
              } catch (err) {
                core.warning(`Could not download log for job ${jobId}: ${err.message}`);
                return "";
              }
            }

            function extractFailureSnippet(log) {
              const text = String(log || "").replace(/\r/g, "");
              const lines = text.split("\n");

              const patterns = [
                /FAILURES/i,
                /FAILED /i,
                /AssertionError/i,
                /Traceback/i,
                /Error:/i,
                /ERROR/i,
                /Process completed with exit