name: PR Merge Readiness
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Solo `pull_request`: e' l'UNICO evento il cui esito si attacca all'head
  # della PR. I trigger `check_run`/`workflow_run` che stavano qui rivalutavano
  # nel contesto del branch di DEFAULT, quindi pubblicavano il verdetto su
  # `main` — invisibile sulla PR, e 24 run rosse su 27 lasciate su `main`
  # (misurato sulla #463). Per rivalutare a mano c'e' `workflow_dispatch`.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true

concurrency:
  # Corsia PROPRIA per il verdetto attaccato all'head (`-head-`).
  #
  # Finche' `main` porta la vecchia versione di questo workflow, i suoi trigger
  # `check_run`/`workflow_run` continuano a partire e calcolano il gruppo con
  # la vecchia espressione, che per la stessa PR vale `pr-merge-readiness-<n>`.
  # Con `cancel-in-progress: true` quel gruppo cancellava la run che sta
  # aspettando i check: misurato su dae8a26, la run e' durata 243s (l'attesa
  # funziona) ed e' finita `cancelled` 14s dopo l'avvio di una run
  # `workflow_run`.
  #
  # Il prefisso distinto isola le due cose senza indebolire la supersession: un
  # nuovo push sulla STESSA PR ricade nello stesso gruppo e cancella la run
  # precedente, che e' il comportamento voluto (il verdetto vecchio non serve
  # piu').
  group: pr-merge-readiness-head-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read
  # PF-REVIEW-ATTESTATION v2: lettura delle attestazioni Sigstore delle review (gh attestation verify)
  attestations: read

jobs:
  readiness:
    name: Merge readiness
    runs-on: ubuntu-latest
    # Il gate ora ASPETTA che i check dell'head finiscano: serve un tetto, o una
    # suite bloccata terrebbe occupato un runner per il default di 6 ore.
    # 120 minuti: il budget d'attesa (6600 s) piu' checkout e verdetto finale.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      # PF-MERGE-READINESS-FAST-01: ogni chiamata `gh` ha una scadenza; gli errori transitori (timeout, 5xx, rete,
      # rate limit) si ritentano al massimo 3 volte con backoff 2 s / 4 s, poi il gate decide "API non disponibile".
      PF_GH_CALL_TIMEOUT_SECONDS: "60"
      PF_GH_RETRIES: "3"
      REPO: ${{ github.repository }}
      PR: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout PR merge ref
        if: env.PR != '' && env.PR != 'null'
        run: |
          git fetch origin "pull/${PR}/merge:pr-${PR}-merge"
          git checkout "pr-${PR}-merge"

      - name: Validate merge readiness
        run: |
          set -euo pipefail

          if [ -z "${PR:-}" ] || [ "$PR" = "null" ]; then
            echo "::notice::No PR number for this event. Skipping."
            exit 0
          fi

          mkdir -p .merge-readiness
          # Senza budget il gate decide ~20s dopo il push, con i check ancora in
          # volo: "non pronta" garantito. Il budget deve coprire il reviewer
          # piu' lento, non la suite media: con 900 s una review di Sol a
          # effort `max` valida ma lenta lasciava il gate rosso. Con Sol a
          # 105 min, 6600 s coprono il job piu' lungo piu' il ritardo con cui
          # parte rispetto a questo
          # (tests/guardrails/test_ai_review_timeout.py). Il gate esce appena
          # i check sono settled e stabili: il budget lungo costa solo quando
          # qualcosa e' davvero lento. Scaduto il budget si giudica lo stato
          # reale: se i check non sono finiti il gate FALLISCE (fail-closed).
          # Uscita anticipata PENDING_EXTERNAL (owner PF-POST-602-MASTER-EXECUTION-01 §4: nessun runner occupato
          # durante le certificazioni esterne). La rivalutazione la fa pr-readiness-retrigger.yml; se non scattasse,
          # la readiness resta ROSSA (mai un falso PASS) e basta rilanciarla: prova reale dopo il merge.
          python3 scripts/pr_merge_readiness.py \
            --repo "$REPO" \
            --pr "$PR" \
            --ignore-safe-autofix \
            --wait-pending-seconds 6600 \
            --poll-seconds 15 \
            --max-poll-seconds 60 \
            --backoff-after-seconds 300 \
            --deadline-seconds 6900 \
            --pending-external-exit-after 300 \
            --output .merge-readiness/decision.json

          CAN_MERGE="$(jq -r '.can_merge' .merge-readiness/decision.json)"
          {
            echo "## PR Merge Readiness"
            echo ""
            echo "- PR: #$PR"
            echo "- can_merge: \`$CAN_MERGE\`"
            echo "- mergeable: \`$(jq -r '.mergeable' .merge-readiness/decision.json)\`"
            echo "- mergeStateStatus: \`$(jq -r '.mergeStateStatus' .merge-readiness/decision.json)\`"
            echo "- blockers: \`$(jq '.blockers | length' .merge-readiness/decision.json)\`"
            echo "- pending: \`$(jq '.pending | length' .merge-readiness/decision.json)\`"
            echo "- ignored checks: \`$(jq '.ignored_self_checks | length' .merge-readiness/decision.json)\`"
            # PF-REVIEW-RECOVERY-01 (#550): gate Sol/Grok dai commenti grezzi, INFORMATIVO (non cambia can_merge).
            echo "- ai_review_gate: \`$(jq -r '.ai_review_gate_status // "UNKNOWN"' .merge-readiness/decision.json)\`"
            # PF-CI-PERFORMANCE-FINAL-01: stato leggibile (solo READY = can_merge) e tempo impiegato.
            echo "- readiness_status: \`$(jq -r '.readiness_status // "UNKNOWN"' .merge-readiness/decision.json)\`"
            echo "- elapsed: \`$(jq -r '.readiness_elapsed_seconds // "?"' .merge-readiness/decision.json)\` s"
            # PF-DUAL-CERTIFICATION-01: INFORMATIVO, mai requisito di merge. LIVE_READINESS_PASS != LIVE_CERTIFIED.
            echo "- live_certification: \`$(jq -r '.live_certification // "UNKNOWN"' .merge-readiness/decision.json)\`"
            echo "- live_readiness: \`$(jq -r '.live_readiness // "UNKNOWN"' .merge-readiness/decision.json)\`"
            echo ""
            echo "### Reasons"
            jq -r '.reasons[]? | "- " + .' .merge-readiness/decision.json
          } >> "$GITHUB_STEP_SUMMARY"

          # Un check ESCLUSO che e' ROSSO non deve sparire in silenzio (rilievo
          # Claude Fable 5 su #462). L'esclusione resta — self-check del flow,
          # oppure il check della GitHub App Codacy dismessa — ma viene DETTA,
          # con nome e stato, sia nel riepilogo sia come ::warning:: in Actions.
          # Prima questa riga leggeva `.ignored`, una chiave che la decisione non
          # produce: jq restituiva null e il riepilogo non mostrava nulla.
          EXCLUDED_BAD="$(
            jq -r '[.ignored_self_checks[]? | select(((.state // "") | ascii_upcase) as $s
                   | $s != "" and $s != "SUCCESS" and $s != "SKIPPED" and $s != "NEUTRAL")] | length' \
              .merge-readiness/decision.json
          )"
          if [ "${EXCLUDED_BAD:-0}" != "0" ]; then
            echo "::warning::$EXCLUDED_BAD excluded check(s) are NOT green. They do not block the merge gate by design - listed in the job summary."
            {
              echo ""
              echo "### Excluded checks that are not green"
              echo ""
              jq -r '.ignored_self_checks[]? | select(((.state // "") | ascii_upcase) as $s
                     | $s != "" and $s != "SUCCESS" and $s != "SKIPPED" and $s != "NEUTRAL")
                     | "- `" + (.name // "?") + "` = `" + (.state // "?") + "`"
                       + (if .decommissioned then " (decommissioned service)" else " (flow self-check)" end)' \
                .merge-readiness/decision.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Fail-closed sui blocker REALI: se la readiness dice che non si puo'
          # mergiare, il gate FALLISCE. Codacy e' dismesso (nessuna API, nessun
          # token, nessun caso speciale): non esiste piu' alcun ramo che rende
          # verde una readiness negativa.
          if [ "$CAN_MERGE" != "true" ]; then
            echo "::warning::PR is not merge-ready yet."
            jq '.reasons' .merge-readiness/decision.json
            exit 1
          fi

      # PF-REVIEW-ATTESTATION v2 (#586): oltre al gate esistente (che resta), le review di Sol e Grok contano solo
      # con un'attestazione firmata dal workflow trusted su main che copre l'head; e il PRE-LIVE di Pickfair
      # Dedicated deve essere SUCCESS sull'head esatto. Il check LIVE non e' un gate delle PR di sviluppo.
      - name: Verify signed review attestations
        if: env.PR != '' && env.PR != 'null'
        run: |
          set -euo pipefail
          mkdir -p .merge-readiness
          # Sol/Grok girano da pull_request_target e possono finire DOPO la CI dell'head: attesa limitata (30 min)
          # finche' manca solo la copertura; bloccanti, firme non valide o API non leggibile non si aspettano.
          python3 scripts/pr_review_attestation.py verify-pr --repo "$REPO" --pr "$PR" --wait-seconds 1800 \
            --output .merge-readiness/review-attestation.json

      - name: Verify PRE-LIVE Betfair certification
        if: env.PR != '' && env.PR != 'null'
        run: |
          set -euo pipefail
          mkdir -p .merge-readiness
          python3 scripts/pr_review_attestation.py verify-prelive --repo "$REPO" --pr "$PR" \
            --output .merge-readiness/prelive.json

      - name: Upload readiness decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-merge-readiness-${{ env.PR }}
          path: .merge-readiness/
          if-no-files-found: ignore
