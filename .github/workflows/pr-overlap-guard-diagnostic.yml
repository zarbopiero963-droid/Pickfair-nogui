name: PR Overlap Guard (diagnostica manuale, non required)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Collaudo manuale dell'overlap guard (PF-GOV-DOC-WORKFLOW-ALIGN-01, review indipendente su #564). NON e' il
# controllo obbligatorio: quello e' il job `overlap-check` di `pr-overlap-guard.yml`, solo su `pull_request`.
# Separazione:
# - nome del check diverso (`overlap-diagnostic`): non puo' soddisfare il required check `overlap-check`;
# - solo da `main`: un dispatch da un altro branch fallisce prima del checkout, quindi gira soltanto codice di
#   `main` e il check run si attacca al commit di `main`, mai all'head di una PR;
# - stesso isolamento del token del check obbligatorio: file 0600 temporaneo, mai un argomento.
# Limite: GitHub esegue `workflow_dispatch` col file del workflow del ref scelto; il blocco sul ref vale per il
# file di `main`. Per questo ogni workflow e' a merge owner.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      head_sha:
        description: "Head SHA della PR da valutare (40 esadecimali)"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  overlap-diagnostic:
    name: overlap-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Refuse any ref other than main (trusted code only)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::diagnostica ammessa solo da main (ref: $GITHUB_REF)"
            exit 1
          fi

      - name: Checkout main (trusted code only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Overlap guard diagnostic (scripts/ci/pr_overlap_guard.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          PF_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PF_PR_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          PF_RESULT_DIR: ${{ runner.temp }}/trusted-guard
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/github-token"
          trap 'rm -f "$token_file"' EXIT
          ( umask 077 && printf '%s' "$GH_TOKEN" > "$token_file" )
          unset GH_TOKEN
          PF_GITHUB_TOKEN_FILE="$token_file" ./scripts/ci/pr_overlap_guard.sh

      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-overlap-diagnostic-report
          path: ${{ runner.temp }}/trusted-guard/overlap.json
          if-no-files-found: ignore
