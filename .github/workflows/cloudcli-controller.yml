name: CloudCLI Controller
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: "Command mode"
        required: true
        default: "health"
        type: choice
        options:
          - "health"
          - "new-task"
          - "pr-fix"
      pr_number:
        description: "PR number for pr-fix mode"
        required: false
        type: string
      task_title:
        description: "Task title for new-task mode"
        required: false
        type: string
      task_text:
        description: "Task text for new-task mode"
        required: false
        type: string
      dry_run:
        description: "Run without commit/push/PR"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Force PR fix execution"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      run_agent_smoke:
        description: "Run CloudCLI health agent smoke test"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      extra_handoff:
        description: "Optional extra handoff text for PR fix"
        required: false
        type: string

  repository_dispatch:
    types:
      - cloudcli_controller
      - telegram_cloudcli_command
      - telegram_new_task
      - telegram_pr_fix_latest
      - telegram_cloudcli_health

permissions:
  actions: write
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: cloudcli-controller-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  controller:
    name: Dispatch CloudCLI workflow
    runs-on: ubuntu-latest

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Resolve command
        id: command
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");

            const payload = context.payload.client_payload || {};
            const inputs = context.payload.inputs || {};
            const action = context.payload.action || "";

            let mode = String(inputs.mode || payload.mode || "").trim();

            if (!mode) {
              if (action === "telegram_new_task") {
                mode = "new-task";
              } else if (action === "telegram_pr_fix_latest") {
                mode = "pr-fix";
              } else if (action === "telegram_cloudcli_health") {
                mode = "health";
              } else {
                mode = "health";
              }
            }

            const prNumber = String(inputs.pr_number || payload.pr_number || payload.pr || "").trim();
            const taskTitle = String(inputs.task_title || payload.task_title || "").trim();
            const taskText = String(inputs.task_text || payload.task_text || "").trim();
            const dryRun = String(inputs.dry_run || payload.dry_run || "true").trim() === "true";
            const force = String(inputs.force || payload.force || "false").trim() === "true";
            const runAgentSmoke = String(inputs.run_agent_smoke || payload.run_agent_smoke || "false").trim() === "true";
            const extraHandoff = String(inputs.extra_handoff || payload.extra_handoff || payload.handoff_text || "").trim();

            const allowedModes = new Set(["health", "new-task", "pr-fix"]);

            if (!allowedModes.has(mode)) {
              core.setFailed(`Invalid mode: ${mode}`);
              return;
            }

            if (mode === "new-task") {
              if (!taskTitle) {
                core.setFailed("task_title is required for new-task mode.");
                return;
              }

              if (!taskText) {
                core.setFailed("task_text is required for new-task mode.");
                return;
              }
            }

            if (mode === "pr-fix") {
              if (!prNumber || !/^\d+$/.test(prNumber)) {
                core.setFailed("pr_number is required for pr-fix mode.");
                return;
              }
            }

            fs.mkdirSync("cloudcli-controller-output", { recursive: true });

            fs.writeFileSync(
              "cloudcli-controller-output/command.json",
              JSON.stringify(
                {
                  mode,
                  prNumber,
                  taskTitle,
                  taskText,
                  dryRun,
                  force,
                  runAgentSmoke,
                  extraHandoff,
                },
                null,
                2
              ),
              "utf8"
            );

            core.setOutput("mode", mode);
            core.setOutput("pr_number", prNumber);
            core.setOutput("task_title", taskTitle);
            core.setOutput("task_text", taskText);
            core.setOutput("dry_run", dryRun ? "true" : "false");
            core.setOutput("force", force ? "true" : "false");
            core.setOutput("run_agent_smoke", runAgentSmoke ? "true" : "false");
            core.setOutput("extra_handoff", extraHandoff);

            core.info(`mode=${mode}`);
            core.info(`pr_number=${prNumber}`);
            core.info(`task_title=${taskTitle}`);
            core.info(`dry_run=${dryRun}`);
            core.info(`force=${force}`);
            core.info(`run_agent_smoke=${runAgentSmoke}`);

      - name: Notify Telegram command accepted
        env:
          MODE: ${{ steps.command.outputs.mode }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          TASK_TITLE: ${{ steps.command.outputs.task_title }}
          DRY_RUN: ${{ steps.command.outputs.dry_run }}
          FORCE: ${{ steps.command.outputs.force }}
          RUN_AGENT_SMOKE: ${{ steps.command.outputs.run_agent_smoke }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Controller command accepted",
              "",
              f"Mode: {os.environ.get('MODE', '')}",
              f"PR: {os.environ.get('PR_NUMBER', '') or 'n/a'}",
              f"Task title: {os.environ.get('TASK_TITLE', '') or 'n/a'}",
              f"Dry run: {os.environ.get('DRY_RUN', '')}",
              f"Force: {os.environ.get('FORCE', '')}",
              f"Agent smoke: {os.environ.get('RUN_AGENT_SMOKE', '')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY

      - name: Dispatch target workflow
        uses: actions/github-script@v7
        env:
          MODE: ${{ steps.command.outputs.mode }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          TASK_TITLE: ${{ steps.command.outputs.task_title }}
          TASK_TEXT: ${{ steps.command.outputs.task_text }}
          DRY_RUN: ${{ steps.command.outputs.dry_run }}
          FORCE: ${{ steps.command.outputs.force }}
          RUN_AGENT_SMOKE: ${{ steps.command.outputs.run_agent_smoke }}
          EXTRA_HANDOFF: ${{ steps.command.outputs.extra_handoff }}
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const mode = process.env.MODE;
            const prNumber = process.env.PR_NUMBER || "";
            const taskTitle = process.env.TASK_TITLE || "";
            const taskText = process.env.TASK_TEXT || "";
            const dryRun = process.env.DRY_RUN || "true";
            const force = process.env.FORCE || "false";
            const runAgentSmoke = process.env.RUN_AGENT_SMOKE || "false";
            const extraHandoff = process.env.EXTRA_HANDOFF || "";

            const repoInfo = await github.rest.repos.get({
              owner,
              repo,
            });

            const ref = repoInfo.data.default_branch || "main";

            if (mode === "health") {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "cloudcli-health.yml",
                ref,
                inputs: {
                  run_agent_smoke: runAgentSmoke,
                },
              });

              core.info("Dispatched cloudcli-health.yml");
              return;
            }

            if (mode === "new-task") {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "cloudcli-new-task.yml",
                ref,
                inputs: {
                  task_title: taskTitle,
                  task_text: taskText,
                  dry_run: dryRun,
                },
              });

              core.info("Dispatched cloudcli-new-task.yml");
              return;
            }

            if (mode === "pr-fix") {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: "cloudcli-pr-fix.yml",
                ref,
                inputs: {
                  pr_number: prNumber,
                  dry_run: dryRun,
                  force,
                  extra_handoff: extraHandoff,
                },
              });

              core.info("Dispatched cloudcli-pr-fix.yml");
              return;
            }

            core.setFailed(`Unhandled mode: ${mode}`);

      - name: Upload controller logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-controller-logs-${{ github.run_id }}
          path: cloudcli-controller-output/**
          if-no-files-found: ignore

      - name: Notify Telegram dispatched
        if: success()
        env:
          MODE: ${{ steps.command.outputs.mode }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          TASK_TITLE: ${{ steps.command.outputs.task_title }}
          DRY_RUN: ${{ steps.command.outputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Controller dispatched workflow",
              "",
              f"Mode: {os.environ.get('MODE', '')}",
              f"PR: {os.environ.get('PR_NUMBER', '') or 'n/a'}",
              f"Task title: {os.environ.get('TASK_TITLE', '') or 'n/a'}",
              f"Dry run: {os.environ.get('DRY_RUN', '')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY

      - name: Notify Telegram failure
        if: failure()
        env:
          MODE: ${{ steps.command.outputs.mode }}
          PR_NUMBER: ${{ steps.command.outputs.pr_number }}
          TASK_TITLE: ${{ steps.command.outputs.task_title }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI Controller failed",
              "",
              f"Mode: {os.environ.get('MODE', 'unknown')}",
              f"PR: {os.environ.get('PR_NUMBER', 'unknown')}",
              f"Task title: {os.environ.get('TASK_TITLE', 'unknown')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "",
              "Check artifact: cloudcli-controller-logs",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY