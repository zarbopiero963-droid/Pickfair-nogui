name: PR Automation Controller

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
      dry_run:
        description: "Only report actions without executing"
        required: false
        default: "false"
      pending_wait_seconds:
        description: "Seconds to wait for pending checks"
        required: false
        default: "300"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_run:
    types: [completed, rerequested]
  workflow_run:
    workflows:
      - PR Autofix Safe Supervisor
      - PR Flow Guardrails
      - PR Merge Readiness
      - pr-check
      - dutching
      - pnl-engine
      - stateful-integrity
      - merge-simulation-hard
      - CloudCLI PR Fix
    types: [completed]

concurrency:
  group: pr-automation-controller-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

permissions:
  actions: write
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  controller:
    name: PR automation controller
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.PICKFAIR_ACTIONS_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.check_run.pull_requests[0].number }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      PENDING_WAIT_SECONDS: ${{ github.event.inputs.pending_wait_seconds || '300' }}
    steps:
      - name: Checkout controller source
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN || github.token }}

      - name: Run PR automation controller
        run: |
          set -euo pipefail
          mkdir -p pr-controller

          if [ -z "${PR_NUMBER:-}" ] || [ "$PR_NUMBER" = "null" ]; then
            cat > pr-controller/decision.json <<'JSON'
          {
            "next_action": "skip_no_pr_number",
            "reason": "event did not include a pull request number"
          }
          JSON
            cat pr-controller/decision.json
            exit 0
          fi

          args=""
          if [ "$DRY_RUN" = "true" ]; then
            args="--dry-run"
          fi

          python3 scripts/pr_automation_controller.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --pending-wait-seconds "$PENDING_WAIT_SECONDS" \
            --output pr-controller/decision.json \
            $args

      - name: Ensure controller decision exists
        if: always()
        run: |
          set -euo pipefail
          mkdir -p pr-controller
          if [ ! -f pr-controller/decision.json ]; then
            cat > pr-controller/decision.json <<'JSON'
{
  "next_action": "controller_no_decision_file",
  "reason": "controller completed without writing decision.json"
}
JSON
          fi
          echo "=== pr-controller ==="
          find pr-controller -maxdepth 2 -type f -print -exec sed -n '1,220p' {} \;

      - name: Upload controller decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-automation-controller-${{ env.PR_NUMBER || github.run_id }}
          path: pr-controller/
          if-no-files-found: error
