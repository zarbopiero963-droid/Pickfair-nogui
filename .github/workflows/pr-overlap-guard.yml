name: PR Overlap Guard (Smart Critical Mode)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Riserva GitHub Actions della lane Buildkite trusted (#562/#563, PF-GOV-DOC-WORKFLOW-ALIGN-01): la logica non
# sta piu' qui inline ma nello script canonico `scripts/ci/pr_overlap_guard.sh` (contratto in
# docs/ci_trusted_lane.md), lo stesso che usa la pipeline Buildkite `pr-overlap-guard`. Regola «una sola PR
# aperta» e sovrapposizione sui file critici, fail-closed (tutte le pagine, PR illeggibile = FAIL).
#
# Codice non fidato: il checkout e' il commit BASE della PR (mai il codice della PR), senza credenziali
# persistite; i dati della PR arrivano solo dalla GitHub API. Il token del job va in un file 0600 temporaneo,
# letto dallo script e cancellato a fine job; non e' mai un argomento.
# Solo `pull_request`: questo workflow pubblica il check obbligatorio `overlap-check` e nient'altro. Un tempo
# accettava anche `workflow_dispatch`, che da un branch eseguiva lo script di quel branch e attaccava al suo head
# un secondo `overlap-check` verde accanto a quello rosso (stessa app, stesso SHA: su #564, b4e6604). Il collaudo
# manuale sta in `pr-overlap-guard-diagnostic.yml`, con un nome di check diverso che non puo' soddisfare il
# required check.
# `edited` serve al cambio di base: una PR aperta su un branch con uno script compiacente e poi spostata su `main`
# terrebbe il verde calcolato sul vecchio base; con `edited` il check si ricalcola sul base nuovo (review
# indipendente su #567).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  overlap-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted base (never the PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Overlap guard (scripts/ci/pr_overlap_guard.sh)
        env:
          GH_TOKEN: ${{ github.token }}
          PF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PF_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PF_RESULT_DIR: ${{ runner.temp }}/trusted-guard
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/github-token"
          trap 'rm -f "$token_file"' EXIT
          ( umask 077 && printf '%s' "$GH_TOKEN" > "$token_file" )
          unset GH_TOKEN
          PF_GITHUB_TOKEN_FILE="$token_file" ./scripts/ci/pr_overlap_guard.sh

      - name: Upload overlap result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-overlap-report
          path: ${{ runner.temp }}/trusted-guard/overlap.json
          if-no-files-found: ignore
