name: PR Overlap Guard (Smart Critical Mode)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  overlap-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch open PRs
        id: fetch_prs
        run: |
          REPO="${{ github.repository }}"
          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls?state=open&per_page=100" \
            > open_prs.json

      - name: Una sola PR aperta alla volta
        run: |
          python3 <<'PY'
          import json
          import sys

          def pr_di_troppo(prs_aperte, numero_corrente):
              """Le PR aperte di troppo. Lista vuota = regola rispettata.

              La regola sta fra le NON NEGOZIABILI di CLAUDE.md: una sola PR
              aperta, un solo task attivo, e una nuova PR solo dopo che la
              precedente e' merged o closed.

              E' stata violata due volte senza che niente diventasse rosso.
              `overlap-check`, in questo stesso workflow, esce 1 soltanto se la
              sovrapposizione tocca cinque file critici scritti a mano: su
              `.guardrails/` e `.github/workflows/` stampava
              "Non-critical overlap detected (allowed, but be careful)" e usciva
              0. Un controllo sul NUMERO di PR aperte non esisteva affatto.

              Di troppo sono quelle aperte dopo la prima: la piu' vecchia e'
              quella legittima, le successive non andavano aperte. Si ordina per
              numero, che in GitHub cresce con l'ordine di apertura.

              Le bozze contano: una draft e' comunque una PR aperta e un task in
              volo. Nel repo non ci sono dependabot ne' renovate configurati,
              quindi nessun bot puo' far diventare rosso questo check da solo;
              se un domani ne venisse aggiunto uno, questa scelta va rivista qui
              e non aggirata a valle.

              `numero_corrente` non filtra niente: serve solo a marcare nel
              report quale PR sta girando, perche' il check e' rosso su TUTTE le
              PR aperte finche' la situazione non rientra — che e' il punto.
              """
              numeri = sorted(p["number"] for p in prs_aperte)
              return numeri[1:]

          with open("open_prs.json", encoding="utf-8") as fh:
              aperte = json.load(fh)

          corrente = int("${{ github.event.pull_request.number }}")
          di_troppo = pr_di_troppo(aperte, corrente)

          print("=" * 80)
          print("UNA SOLA PR APERTA ALLA VOLTA")
          print("=" * 80)

          for pr in sorted(aperte, key=lambda p: p["number"]):
              marcatori = []
              if pr["number"] == corrente:
                  marcatori.append("<- questa")
              if pr["number"] in di_troppo:
                  marcatori.append("DI TROPPO")
              if pr.get("draft"):
                  marcatori.append("draft")
              print(f'  #{pr["number"]:<5} {pr.get("title", "")[:70]}'
                    f'{"  [" + ", ".join(marcatori) + "]" if marcatori else ""}')

          if not di_troppo:
              print()
              print(f"OK: {len(aperte)} PR aperta.")
              sys.exit(0)

          print()
          print("❌ REGOLA NON NEGOZIABILE VIOLATA (CLAUDE.md):")
          print(f"   {len(aperte)} PR aperte contemporaneamente.")
          print(f"   Di troppo: {', '.join('#' + str(n) for n in di_troppo)}")
          print()
          print("   Lavoro NON correlato a una PR gia' aperta -> fermarsi,")
          print("   non aprire la seconda. Lavoro di fix sulla PR aperta ->")
          print("   continuare sullo STESSO branch.")
          print("   Si rientra mergiando o chiudendo, non ignorando questo check.")
          sys.exit(1)
          PY

      - name: Fetch current PR files
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            > current_pr_files.json

      - name: Run smart overlap check
        run: |
          python - <<'PY'
          import json
          import sys

          CRITICAL_FILES = {
              "core/trading_engine.py",
              "order_manager.py",
              "core/reconciliation_engine.py",
              "core/state_recovery.py",
              "database.py",
          }

          with open("open_prs.json", "r", encoding="utf-8") as f:
              open_prs = json.load(f)

          with open("current_pr_files.json", "r", encoding="utf-8") as f:
              current_files = {x["filename"] for x in json.load(f)}

          current_pr_number = int("${{ github.event.pull_request.number }}")

          overlapping = []
          critical_overlap = []

          import urllib.request

          for pr in open_prs:
              pr_number = pr["number"]

              if pr_number == current_pr_number:
                  continue

              url = pr["url"] + "/files"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Bearer ${{ secrets.GITHUB_TOKEN }}",
                      "Accept": "application/vnd.github+json"
                  }
              )

              try:
                  with urllib.request.urlopen(req) as resp:
                      pr_files = {x["filename"] for x in json.load(resp)}
              except Exception:
                  continue

              overlap = current_files & pr_files
              if overlap:
                  overlapping.append((pr_number, overlap))

                  for f in overlap:
                      if f in CRITICAL_FILES:
                          critical_overlap.append((pr_number, f))

          print("=" * 80)
          print("PR OVERLAP REPORT")
          print("=" * 80)

          if not overlapping:
              print("No overlapping files with other PRs")
              sys.exit(0)

          print("Overlapping files detected:")

          for pr_number, files in overlapping:
              print(f"\nPR #{pr_number}")
              for f in files:
                  print(f" - {f}")

          print()

          if critical_overlap:
              print("❌ CRITICAL OVERLAP DETECTED:")
              for pr_number, f in critical_overlap:
                  print(f" - PR #{pr_number} touches critical file: {f}")
              sys.exit(1)

          print("⚠️ Non-critical overlap detected (allowed, but be careful)")
          sys.exit(0)
          PY

      - name: Upload overlap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-overlap-report
          path: |
            open_prs.json
            current_pr_files.json