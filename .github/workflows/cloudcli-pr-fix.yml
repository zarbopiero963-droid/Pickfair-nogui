name: CloudCLI PR Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to fix"
        required: true
        type: string
      dry_run:
        description: "Inspect only. Do not edit/commit/push."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      force:
        description: "Force run even if guard conditions would normally skip"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      extra_handoff:
        description: "Optional extra handoff text"
        required: false
        type: string

  repository_dispatch:
    types:
      - cloudcli_pr_fix
      - telegram_pr_fix

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read
  actions: read
  security-events: read

concurrency:
  group: cloudcli-pr-fix-${{ github.event.inputs.pr_number || github.event.client_payload.pr_number || github.event.client_payload.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  pr-fix:
    name: Send lite full-context instructions to CloudCLI Codex
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDCLI_API_KEY: ${{ secrets.CLOUDCLI_API_KEY }}
      CLOUDCLI_BASE_URL: ${{ vars.CLOUDCLI_BASE_URL || secrets.CLOUDCLI_BASE_URL || 'https://cloudcli.ai/api/v1' }}
      CLOUDCLI_ENVIRONMENT_ID: ${{ secrets.CLOUDCLI_ENVIRONMENT_ID || vars.CLOUDCLI_ENVIRONMENT_ID }}
      CLOUDCLI_PROJECT_NAME: ${{ secrets.CLOUDCLI_PROJECT_NAME || vars.CLOUDCLI_PROJECT_NAME }}
      CLOUDCLI_REPO_PATH: ${{ secrets.CLOUDCLI_REPO_PATH || vars.CLOUDCLI_REPO_PATH }}
      CLOUDCLI_PROVIDER: ${{ vars.CLOUDCLI_PROVIDER || secrets.CLOUDCLI_PROVIDER || 'codex' }}
      CLOUDCLI_MODEL: ${{ vars.CLOUDCLI_MODEL || secrets.CLOUDCLI_MODEL || 'gpt-5.2' }}
      GH_TOKEN_FOR_AGENT: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Build lite handoff and full context artifact
        id: handoff
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repository = `${owner}/${repo}`;

            const payload = context.payload.client_payload || {};
            const inputs = context.payload.inputs || {};

            const prNumberRaw = String(inputs.pr_number || payload.pr_number || payload.pr || "").trim();
            const dryRun = String(inputs.dry_run || payload.dry_run || "true").trim() === "true";
            const force = String(inputs.force || payload.force || "false").trim() === "true";
            const extraHandoff = String(inputs.extra_handoff || payload.extra_handoff || payload.handoff_text || "").trim();

            if (!prNumberRaw || !/^\d+$/.test(prNumberRaw)) {
              core.setFailed("Missing or invalid pr_number.");
              return;
            }

            const prNumber = Number(prNumberRaw);

            fs.mkdirSync("cloudcli-output/context", { recursive: true });

            async function paginateSafe(label, fn, args) {
              try {
                return await github.paginate(fn, args);
              } catch (err) {
                core.warning(`${label} failed: ${err.message}`);
                return [
                  {
                    __fetch_error: true,
                    label,
                    message: err.message,
                  },
                ];
              }
            }

            async function restSafe(label, fn, args, fallback) {
              try {
                const response = await fn(args);
                return response.data;
              } catch (err) {
                core.warning(`${label} failed: ${err.message}`);
                return fallback;
              }
            }

            async function graphqlSafe(label, query, variables, fallback) {
              try {
                return await github.graphql(query, variables);
              } catch (err) {
                core.warning(`${label} failed: ${err.message}`);
                return fallback;
              }
            }

            function writeJson(name, value) {
              fs.writeFileSync(
                `cloudcli-output/context/${name}`,
                JSON.stringify(value, null, 2),
                "utf8"
              );
            }

            function clip(value, max = 1200) {
              const text = String(value || "").trim();
              if (text.length <= max) return text;
              return text.slice(0, max) + "\n...[truncated]";
            }

            function authorOf(item) {
              return item.user?.login || item.author?.login || "unknown";
            }

            function shortComment(item) {
              return {
                id: item.id || item.databaseId || null,
                author: authorOf(item),
                path: item.path || null,
                line: item.line || item.original_line || item.originalLine || null,
                state: item.state || null,
                created_at: item.created_at || item.createdAt || null,
                updated_at: item.updated_at || item.updatedAt || null,
                url: item.html_url || item.url || null,
                body: clip(item.body || "", 900),
              };
            }

            function shortCheck(check) {
              return {
                id: check.id,
                name: check.name,
                status: check.status,
                conclusion: check.conclusion,
                started_at: check.started_at,
                completed_at: check.completed_at,
                details_url: check.details_url,
                html_url: check.html_url,
                output_title: clip(check.output?.title || "", 500),
                output_summary: clip(check.output?.summary || "", 1200),
                output_text: clip(check.output?.text || "", 1200),
              };
            }

            function shortStatus(status) {
              return {
                context: status.context,
                state: status.state,
                description: status.description,
                target_url: status.target_url,
                created_at: status.created_at,
                updated_at: status.updated_at,
              };
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.state !== "open") {
              core.setFailed(`PR #${prNumber} is not open. Current state: ${pr.state}`);
              return;
            }

            const prPatch = await restSafe(
              "pull request patch",
              (args) =>
                github.request("GET /repos/{owner}/{repo}/pulls/{pull_number}", {
                  ...args,
                  headers: {
                    accept: "application/vnd.github.patch",
                  },
                }),
              {
                owner,
                repo,
                pull_number: prNumber,
              },
              ""
            );

            const prDiff = await restSafe(
              "pull request diff",
              (args) =>
                github.request("GET /repos/{owner}/{repo}/pulls/{pull_number}", {
                  ...args,
                  headers: {
                    accept: "application/vnd.github.diff",
                  },
                }),
              {
                owner,
                repo,
                pull_number: prNumber,
              },
              ""
            );

            const files = await paginateSafe(
              "changed files",
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            const issueComments = await paginateSafe(
              "issue comments",
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const reviewCommentsRest = await paginateSafe(
              "pull request review comments",
              github.rest.pulls.listReviewComments,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            const reviewsRest = await paginateSafe(
              "pull request reviews",
              github.rest.pulls.listReviews,
              {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
              }
            );

            const timelineEvents = await paginateSafe(
              "issue timeline events",
              github.rest.issues.listEventsForTimeline,
              {
                owner,
                repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const checkRuns = await paginateSafe(
              "check runs",
              github.rest.checks.listForRef,
              {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              }
            );

            const checkSuites = await paginateSafe(
              "check suites",
              github.rest.checks.listSuitesForRef,
              {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              }
            );

            const commitStatuses = await paginateSafe(
              "commit statuses",
              github.rest.repos.listCommitStatusesForRef,
              {
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              }
            );

            const workflowRuns = await paginateSafe(
              "workflow runs for PR head sha",
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                head_sha: pr.head.sha,
                per_page: 100,
              }
            );

            const annotationsByCheckRunId = {};

            for (const check of checkRuns.filter((item) => !item.__fetch_error && item.id)) {
              const conclusion = String(check.conclusion || "").toLowerCase();
              const status = String(check.status || "").toLowerCase();

              if (
                status !== "completed" ||
                !["success", "neutral"].includes(conclusion)
              ) {
                annotationsByCheckRunId[String(check.id)] = await paginateSafe(
                  `annotations for check run ${check.id} ${check.name || ""}`,
                  github.rest.checks.listAnnotations,
                  {
                    owner,
                    repo,
                    check_run_id: check.id,
                    per_page: 100,
                  }
                );
              }
            }

            const codeScanningAlerts = await paginateSafe(
              "code scanning alerts",
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner,
                repo,
                state: "open",
                per_page: 100,
              }
            );

            async function fetchAllReviewThreads() {
              const query = `
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo {
                          hasNextPage
                          endCursor
                        }
                        nodes {
                          id
                          isResolved
                          isOutdated
                          path
                          line
                          startLine
                          originalLine
                          originalStartLine
                          resolvedBy {
                            login
                          }
                          comments(first: 100) {
                            nodes {
                              id
                              databaseId
                              author {
                                login
                              }
                              body
                              createdAt
                              updatedAt
                              url
                              path
                              line
                              originalLine
                              diffHunk
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const threads = [];
              let cursor = null;

              while (true) {
                const data = await graphqlSafe(
                  "review threads graphql",
                  query,
                  {
                    owner,
                    repo,
                    number: prNumber,
                    cursor,
                  },
                  {
                    __fetch_error: true,
                    label: "review threads graphql",
                    message: "GraphQL request failed",
                  }
                );

                if (data.__fetch_error) {
                  return [data];
                }

                const connection = data?.repository?.pullRequest?.reviewThreads;
                if (!connection) {
                  break;
                }

                for (const thread of connection.nodes || []) {
                  threads.push({
                    ...thread,
                    comments: thread.comments?.nodes || [],
                  });
                }

                if (!connection.pageInfo?.hasNextPage) {
                  break;
                }

                cursor = connection.pageInfo.endCursor;
              }

              return threads;
            }

            const reviewThreadsGraphql = await fetchAllReviewThreads();

            const allCheckRuns = checkRuns.filter((item) => !item.__fetch_error);

            const failedCheckRuns = allCheckRuns.filter((check) => {
              const conclusion = String(check.conclusion || "").toLowerCase();
              const status = String(check.status || "").toLowerCase();
              return status === "completed" && !["success", "neutral", "skipped"].includes(conclusion);
            });

            const skippedCheckRuns = allCheckRuns.filter((check) => {
              return String(check.conclusion || "").toLowerCase() === "skipped";
            });

            const pendingCheckRuns = allCheckRuns.filter((check) => {
              return String(check.status || "").toLowerCase() !== "completed";
            });

            const latestStatusesByContext = new Map();

            for (const status of commitStatuses.filter((item) => !item.__fetch_error)) {
              const key = status.context || String(status.id) || "unknown";
              if (!latestStatusesByContext.has(key)) {
                latestStatusesByContext.set(key, status);
              }
            }

            const latestStatuses = Array.from(latestStatusesByContext.values());

            const failedOrPendingStatuses = latestStatuses.filter((status) => {
              const state = String(status.state || "").toLowerCase();
              return state !== "success";
            });

            const botCommentSummary = {};

            for (const comment of [
              ...issueComments.filter((item) => !item.__fetch_error),
              ...reviewCommentsRest.filter((item) => !item.__fetch_error),
            ]) {
              const login = authorOf(comment);
              botCommentSummary[login] = (botCommentSummary[login] || 0) + 1;
            }

            const unresolvedThreads = reviewThreadsGraphql.filter((thread) => {
              return !thread.__fetch_error && thread.isResolved === false;
            });

            const resolvedThreads = reviewThreadsGraphql.filter((thread) => {
              return !thread.__fetch_error && thread.isResolved === true;
            });

            const outdatedThreads = reviewThreadsGraphql.filter((thread) => {
              return !thread.__fetch_error && thread.isOutdated === true;
            });

            const contextSummary = {
              repository,
              prNumber,
              prUrl: pr.html_url,
              title: pr.title,
              state: pr.state,
              draft: pr.draft,
              mergeable: pr.mergeable,
              baseBranch: pr.base.ref,
              baseSha: pr.base.sha,
              headBranch: pr.head.ref,
              headSha: pr.head.sha,
              dryRun,
              force,
              counts: {
                changedFiles: files.length,
                issueComments: issueComments.length,
                reviewCommentsRest: reviewCommentsRest.length,
                reviewsRest: reviewsRest.length,
                reviewThreadsGraphql: reviewThreadsGraphql.length,
                unresolvedThreads: unresolvedThreads.length,
                resolvedThreads: resolvedThreads.length,
                outdatedThreads: outdatedThreads.length,
                timelineEvents: timelineEvents.length,
                checkRuns: checkRuns.length,
                failedCheckRuns: failedCheckRuns.length,
                skippedCheckRuns: skippedCheckRuns.length,
                pendingCheckRuns: pendingCheckRuns.length,
                checkSuites: checkSuites.length,
                commitStatusesRaw: commitStatuses.length,
                commitStatusesLatestByContext: latestStatuses.length,
                failedOrPendingStatuses: failedOrPendingStatuses.length,
                workflowRuns: workflowRuns.length,
                codeScanningAlerts: codeScanningAlerts.length,
              },
              botCommentSummary,
              changedFiles: files.map((file) => ({
                filename: file.filename,
                status: file.status,
                additions: file.additions,
                deletions: file.deletions,
                changes: file.changes,
                blob_url: file.blob_url,
                raw_url: file.raw_url,
              })),
              failedCheckRuns: failedCheckRuns.map(shortCheck),
              skippedCheckRuns: skippedCheckRuns.map(shortCheck),
              pendingCheckRuns: pendingCheckRuns.map(shortCheck),
              failedOrPendingStatuses: failedOrPendingStatuses.map(shortStatus),
              recentIssueComments: issueComments.filter((item) => !item.__fetch_error).slice(-25).map(shortComment),
              recentReviewComments: reviewCommentsRest.filter((item) => !item.__fetch_error).slice(-45).map(shortComment),
              unresolvedThreads: unresolvedThreads.slice(0, 100).map((thread) => ({
                id: thread.id,
                isResolved: thread.isResolved,
                isOutdated: thread.isOutdated,
                path: thread.path,
                line: thread.line,
                originalLine: thread.originalLine,
                resolvedBy: thread.resolvedBy?.login || null,
                comments: (thread.comments || []).map(shortComment),
              })),
            };

            const fullContext = {
              summary: contextSummary,
              pr,
              files,
              prDiff,
              prPatch,
              issueComments,
              reviewCommentsRest,
              reviewsRest,
              reviewThreadsGraphql,
              timelineEvents,
              checkRuns,
              checkSuites,
              commitStatuses,
              latestStatuses,
              failedOrPendingStatuses,
              workflowRuns,
              annotationsByCheckRunId,
              codeScanningAlerts,
              extraHandoff,
            };

            writeJson("summary.json", contextSummary);
            writeJson("pr.json", pr);
            writeJson("files.json", files);
            writeJson("issue-comments.json", issueComments);
            writeJson("review-comments-rest.json", reviewCommentsRest);
            writeJson("reviews-rest.json", reviewsRest);
            writeJson("review-threads-graphql.json", reviewThreadsGraphql);
            writeJson("timeline-events.json", timelineEvents);
            writeJson("check-runs.json", checkRuns);
            writeJson("check-suites.json", checkSuites);
            writeJson("commit-statuses.json", commitStatuses);
            writeJson("latest-statuses.json", latestStatuses);
            writeJson("workflow-runs.json", workflowRuns);
            writeJson("annotations-by-check-run-id.json", annotationsByCheckRunId);
            writeJson("code-scanning-alerts.json", codeScanningAlerts);
            writeJson("full-context.json", fullContext);

            fs.writeFileSync("cloudcli-output/context/pr.diff", String(prDiff || ""), "utf8");
            fs.writeFileSync("cloudcli-output/context/pr.patch", String(prPatch || ""), "utf8");

            const apiCommands = [
              "mkdir -p /tmp/pickfair-pr-context",
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/pulls/${prNumber}" > /tmp/pickfair-pr-context/pr.json`,
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/pulls/${prNumber}/files?per_page=100" > /tmp/pickfair-pr-context/files-page-1.json`,
              `for p in 1 2 3 4 5; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/issues/${prNumber}/comments?per_page=100&page=$p" > "/tmp/pickfair-pr-context/issue-comments-$p.json"; done`,
              `for p in 1 2 3 4 5; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/pulls/${prNumber}/comments?per_page=100&page=$p" > "/tmp/pickfair-pr-context/review-comments-$p.json"; done`,
              `for p in 1 2 3 4 5; do curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/pulls/${prNumber}/reviews?per_page=100&page=$p" > "/tmp/pickfair-pr-context/reviews-$p.json"; done`,
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/commits/${pr.head.sha}/check-runs?per_page=100" > /tmp/pickfair-pr-context/check-runs.json`,
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${repository}/commits/${pr.head.sha}/statuses?per_page=100" > /tmp/pickfair-pr-context/statuses.json`,
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github.diff" "https://api.github.com/repos/${repository}/pulls/${prNumber}" > /tmp/pickfair-pr-context/pr.diff`,
              `curl -fsSL -H "Authorization: Bearer $GH_TOKEN_FOR_AGENT" -H "Accept: application/vnd.github.patch" "https://api.github.com/repos/${repository}/pulls/${prNumber}" > /tmp/pickfair-pr-context/pr.patch`,
            ];

            const liteHandoff = [
              "# CLOUDCLI PR FIX LITE HANDOFF",
              "",
              "This is intentionally small to avoid CloudCLI HTTP 413 payload limit.",
              "The full context bundle is uploaded as workflow artifact, but Codex must re-fetch current PR context directly from GitHub inside CloudCLI.",
              "",
              "## PR",
              "",
              `Repository: ${repository}`,
              `PR: #${prNumber}`,
              `PR URL: ${pr.html_url}`,
              `Title: ${pr.title}`,
              `Base branch: ${pr.base.ref}`,
              `Head branch: ${pr.head.ref}`,
              `Head SHA: ${pr.head.sha}`,
              `Dry run: ${dryRun}`,
              `Force: ${force}`,
              "",
              "## Context counts collected by GitHub Actions",
              "",
              "```json",
              JSON.stringify(contextSummary.counts, null, 2),
              "```",
              "",
              "## Bot/comment author counts",
              "",
              "```json",
              JSON.stringify(botCommentSummary, null, 2),
              "```",
              "",
              "## Changed files",
              "",
              "```json",
              JSON.stringify(contextSummary.changedFiles, null, 2),
              "```",
              "",
              "## Failed checks",
              "",
              "```json",
              JSON.stringify(contextSummary.failedCheckRuns, null, 2),
              "```",
              "",
              "## Skipped checks",
              "",
              "```json",
              JSON.stringify(contextSummary.skippedCheckRuns, null, 2),
              "```",
              "",
              "## Pending checks",
              "",
              "```json",
              JSON.stringify(contextSummary.pendingCheckRuns, null, 2),
              "```",
              "",
              "## Failed or pending statuses",
              "",
              "```json",
              JSON.stringify(contextSummary.failedOrPendingStatuses, null, 2),
              "```",
              "",
              "## Unresolved review threads sample",
              "",
              "```json",
              JSON.stringify(contextSummary.unresolvedThreads, null, 2),
              "```",
              "",
              "## Recent issue comments sample",
              "",
              "```json",
              JSON.stringify(contextSummary.recentIssueComments, null, 2),
              "```",
              "",
              "## Recent review comments sample",
              "",
              "```json",
              JSON.stringify(contextSummary.recentReviewComments, null, 2),
              "```",
              "",
              "## Commands Codex must run inside CloudCLI to re-fetch full live context",
              "",
              "```bash",
              ...apiCommands,
              "```",
              "",
              "## Extra handoff",
              "",
              extraHandoff || "No extra handoff text provided.",
              "",
              "## Hard rules",
              "",
              "- Do not rely only on this summary.",
              "- Re-fetch PR comments, review comments, checks, statuses, diff, and changed files inside CloudCLI before deciding.",
              "- Continue on the existing PR branch only.",
              "- Do not create a new branch.",
              "- Do not create a new PR.",
              "- Do not merge.",
              "- Do not work directly on main/master.",
              "- Do not force-push unless explicitly required and safe.",
              "- Do not use rg. ripgrep is not installed in this environment. Use grep, sed, find, or python instead.",
              "- Fix all still-valid blocking issues from Codacy, DeepSource, CodeRabbit, Codex review comments, GitHub checks, statuses, skipped checks, issue comments, and review comments.",
              "- Ignore duplicates/outdated/resolved items only after explaining why.",
              "",
            ].join("\n");

            fs.writeFileSync("cloudcli-output/handoff-lite.md", liteHandoff, "utf8");

            fs.writeFileSync(
              "cloudcli-output/pr-metadata.json",
              JSON.stringify(
                {
                  owner,
                  repo,
                  repository,
                  prNumber,
                  prUrl: pr.html_url,
                  title: pr.title,
                  baseBranch: pr.base.ref,
                  baseSha: pr.base.sha,
                  headBranch: pr.head.ref,
                  headSha: pr.head.sha,
                  dryRun,
                  force,
                  counts: contextSummary.counts,
                },
                null,
                2
              ),
              "utf8"
            );

            core.setOutput("repository", repository);
            core.setOutput("pr_number", String(prNumber));
            core.setOutput("pr_url", pr.html_url);
            core.setOutput("title", pr.title);
            core.setOutput("base_branch", pr.base.ref);
            core.setOutput("head_branch", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("dry_run", dryRun ? "true" : "false");
            core.setOutput("force", force ? "true" : "false");
            core.setOutput("failed_checks", String(failedCheckRuns.length));
            core.setOutput("skipped_checks", String(skippedCheckRuns.length));
            core.setOutput("review_threads", String(reviewThreadsGraphql.length));
            core.setOutput("issue_comments", String(issueComments.length));
            core.setOutput("review_comments", String(reviewCommentsRest.length));
            core.setOutput("prompt_mode", "lite-refetch");

      - name: Execute CloudCLI PR fix
        id: execute
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          out_dir = Path("cloudcli-output")
          out_dir.mkdir(exist_ok=True)

          api_key = os.environ.get("CLOUDCLI_API_KEY", "").strip()
          base_url = os.environ.get("CLOUDCLI_BASE_URL", "").strip() or "https://cloudcli.ai/api/v1"
          env_id = os.environ.get("CLOUDCLI_ENVIRONMENT_ID", "").strip()
          project = os.environ.get("CLOUDCLI_PROJECT_NAME", "").strip()
          repo_path = os.environ.get("CLOUDCLI_REPO_PATH", "").strip()
          provider = os.environ.get("CLOUDCLI_PROVIDER", "").strip() or "codex"
          model = os.environ.get("CLOUDCLI_MODEL", "").strip() or "gpt-5.2"
          github_token = os.environ.get("GH_TOKEN_FOR_AGENT", "").strip()

          metadata = json.loads(Path("cloudcli-output/pr-metadata.json").read_text(encoding="utf-8"))
          handoff_lite = Path("cloudcli-output/handoff-lite.md").read_text(encoding="utf-8")

          repository = metadata["repository"]
          pr_number = metadata["prNumber"]
          pr_url = metadata["prUrl"]
          title = metadata["title"]
          base_branch = metadata["baseBranch"]
          head_branch = metadata["headBranch"]
          head_sha = metadata["headSha"]
          dry_run = bool(metadata["dryRun"])

          required = {
              "CLOUDCLI_API_KEY": api_key,
              "CLOUDCLI_ENVIRONMENT_ID": env_id,
              "CLOUDCLI_PROJECT_NAME": project,
              "CLOUDCLI_REPO_PATH": repo_path,
              "PICKFAIR_ACTIONS_TOKEN": github_token,
          }

          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit("Missing required config: " + ", ".join(missing))

          if len(handoff_lite) > 120000:
              handoff_lite = handoff_lite[:120000] + "\n\n...[handoff-lite truncated to avoid CloudCLI payload limit]"

          def request_json(method, path, payload=None):
              url = base_url.rstrip("/") + path
              data = None
              headers = {
                  "X-API-KEY": api_key,
                  "Accept": "application/json",
              }

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(url, data=data, headers=headers, method=method)

              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"HTTP {exc.code} {method} {url}\n{body}") from exc

              if not raw.strip():
                  return {}

              return json.loads(raw)

          env_info = request_json("GET", f"/environments/{env_id}")
          status = str(env_info.get("status", ""))

          print(f"CloudCLI environment status: {status}")

          if status != "running":
              print("Starting CloudCLI environment...")
              request_json("POST", f"/environments/{env_id}/start")

              for attempt in range(1, 49):
                  time.sleep(5)
                  env_info = request_json("GET", f"/environments/{env_id}")
                  status = str(env_info.get("status", ""))
                  print(f"Start poll {attempt}: {status}")

                  if status == "running":
                      break

              if status != "running":
                  raise SystemExit("CloudCLI environment did not become running.")

          if dry_run:
              execution_rules = """
          DRY RUN MODE.

          Do not edit files.
          Do not commit.
          Do not push.
          Do not create a PR.

          You must still re-fetch full live GitHub context and produce a concrete fix plan.
          """
          else:
              execution_rules = f"""
          REAL EXECUTION MODE.

          You must:
          - Work only in this repo path: {repo_path}
          - Fetch latest refs.
          - Checkout the existing PR branch: {head_branch}
          - Pull latest origin/{head_branch}.
          - Do NOT create a new branch.
          - Do NOT create a new PR.
          - Do NOT merge.
          - Do NOT work directly on main/master.
          - Re-fetch full live GitHub PR context before editing.
          - Fix all still-valid blocking issues.
          - Run relevant checks/tests.
          - Commit only intended changes.
          - Push only to the same PR branch: {head_branch}
          - Prefer: git push origin HEAD:{head_branch}
          - If push fails, report NEEDS_MANUAL_UPDATE_BRANCH and Push: failed.
          """

          message = f"""
          CTO MODE: LOCKED IN - CLOUDCLI EXISTING PR FIX - LITE REFRESH MODE

          Repository: {repository}
          Repo path: {repo_path}
          PR: #{pr_number}
          PR URL: {pr_url}
          PR title: {title}
          Base branch: {base_branch}
          Existing PR branch: {head_branch}
          Current PR head SHA before work: {head_sha}

          {execution_rules}

          Why this prompt is lite:
          - The previous full-context prompt was too large and CloudCLI returned HTTP 413.
          - GitHub Actions collected the context and uploaded it as an artifact.
          - You must NOT rely only on the summary.
          - You must re-fetch full live GitHub context directly inside CloudCLI using the commands in the handoff.

          Non-negotiable context rules:
          - This PR has review comments and bot comments beyond failing checks.
          - Do not rely only on DeepSource.
          - Do not rely only on failed checks.
          - Review comments, review threads, skipped checks, neutral checks, commit statuses, annotations, workflow jobs, issue comments, and timeline events matter.
          - Treat Codacy, DeepSource, CodeRabbit, Codex review comments, GitHub checks, GitHub statuses, and human comments as potential blockers.
          - Fix every still-valid blocking issue.
          - Ignore duplicates/outdated/resolved comments only after explaining why.
          - Do not use rg. ripgrep is not installed in this environment. Use grep, sed, find, or python instead.
          - End your final response with the marker CLOUDCLI_PR_FIX_DONE.

          Initial commands:
          - pwd
          - cd "{repo_path}" && git status --short
          - cd "{repo_path}" && git branch --show-current
          - cd "{repo_path}" && git remote -v
          - cd "{repo_path}" && git fetch origin
          - cd "{repo_path}" && git checkout "{head_branch}"
          - cd "{repo_path}" && git pull --ff-only origin "{head_branch}"

          GitHub context re-fetch:
          - Use curl or gh to fetch PR metadata, files, diff, issue comments, review comments, reviews, check runs, and statuses.
          - Store fetched JSON/text under /tmp/pickfair-pr-context.
          - Do not paste huge JSON into the final answer.
          - Inspect it locally and act on it.
          - Prefer authenticated requests with the provided GitHub token.
          - If GraphQL review threads are unavailable, use REST review comments plus current code to decide validity.

          Handoff-lite follows:

          {handoff_lite}

          Return final output only in this format:

          CLOUDCLI_PR_FIX_DONE

          Final factual status:
          - DONE / PARTIAL / NOT DONE

          PR:
          - {pr_url}

          Branch:
          - {head_branch}

          Commit:
          - <new commit SHA or none>

          Checks:
          - <exact commands and results>

          Files changed:
          - <files>

          Files created:
          - <files>

          Issues fixed:
          - <items>

          Findings skipped with reason:
          - <items>

          What was not done:
          - <items>

          Push:
          - succeeded / failed / skipped dry-run
          """

          payload = {
              "environmentId": env_id,
              "projectName": project,
              "message": message,
              "provider": provider,
              "model": model,
              "createBranch": False,
              "createPR": False,
              "githubToken": github_token,
          }

          redacted_payload = dict(payload)
          redacted_payload["githubToken"] = "***"
          redacted_payload["message_length"] = len(message)
          redacted_payload["message"] = message[:20000] + ("\n...[truncated in redacted log only]" if len(message) > 20000 else "")

          Path("cloudcli-output/agent-payload-redacted.json").write_text(
              json.dumps(redacted_payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          url = base_url.rstrip("/") + "/agent/execute"

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "X-API-KEY": api_key,
                  "Content-Type": "application/json",
                  "Accept": "text/event-stream",
              },
              method="POST",
          )

          print("Calling CloudCLI agent execute...")
          print(f"Prompt length: {len(message)} characters")

          chunks = []

          try:
              with urllib.request.urlopen(req, timeout=7200) as resp:
                  for raw_line in resp:
                      line = raw_line.decode("utf-8", errors="replace")
                      print(line, end="")
                      chunks.append(line)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"HTTP {exc.code} POST {url}\n{body}") from exc

          sse_text = "".join(chunks)
          Path("cloudcli-output/agent-sse.log").write_text(sse_text, encoding="utf-8")

          plain_parts = []

          for line in sse_text.splitlines():
              line = line.strip()

              if not line.startswith("data:"):
                  continue

              raw = line[5:].strip()

              if not raw:
                  continue

              try:
                  obj = json.loads(raw)
              except Exception:
                  plain_parts.append(raw)
                  continue

              for key in ("content", "output", "message", "text"):
                  value = obj.get(key)
                  if isinstance(value, str) and value.strip():
                      plain_parts.append(value)

              tool_input = obj.get("toolInput")
              if isinstance(tool_input, dict):
                  command = tool_input.get("command")
                  if isinstance(command, str) and command.strip():
                      plain_parts.append("$ " + command)

          plain_text = "\n".join(plain_parts)
          Path("cloudcli-output/agent-text.log").write_text(plain_text, encoding="utf-8")

          combined_lower = (sse_text + "\n" + plain_text).lower()
          plain_lower = plain_text.lower()

          marker_found = "cloudcli_pr_fix_done" in combined_lower

          Path("cloudcli-output/agent-marker-status.txt").write_text(
              "marker_found=true\n" if marker_found else "marker_found=false\n",
              encoding="utf-8",
          )

          if not marker_found:
              if dry_run:
                  print("WARNING: CLOUDCLI_PR_FIX_DONE marker not found in dry-run output.")
                  print("Dry-run will not fail only for missing marker.")
              else:
                  raise SystemExit("CloudCLI PR fix marker CLOUDCLI_PR_FIX_DONE not found in agent output.")

          hard_fail_indicators = [
              "needs_manual_update_branch",
              "fatal: could not read username",
              "authentication failed",
              "permission denied",
              "push:\n- failed",
              "push failed",
              "failed to push",
              "could not read from remote repository",
          ]

          if any(indicator in combined_lower for indicator in hard_fail_indicators):
              raise SystemExit("CloudCLI reported push/auth/manual-update failure. Failing workflow intentionally.")

          if not dry_run:
              real_mode_bad_indicators = [
                  "push:\n- skipped dry-run",
              ]

              if any(indicator in plain_lower for indicator in real_mode_bad_indicators):
                  raise SystemExit("CloudCLI real mode did not push or reported dry-run push. Failing workflow intentionally.")

              if "final factual status:\n- not done" in combined_lower:
                  raise SystemExit("CloudCLI reported NOT DONE. Failing workflow intentionally.")

          print("CloudCLI PR fix execution completed.")
          PY

      - name: Verify PR state after fix
        id: verify
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number("${{ steps.handoff.outputs.pr_number || github.event.inputs.pr_number || github.event.client_payload.pr_number || github.event.client_payload.pr || 0 }}");

            if (!prNumber) {
              core.setOutput("pr_url", "");
              core.setOutput("head_sha", "");
              core.setOutput("head_branch", "");
              core.setOutput("state", "");
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            core.setOutput("pr_url", pr.html_url);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("head_branch", pr.head.ref);
            core.setOutput("state", pr.state);

      - name: Upload CloudCLI PR fix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-pr-fix-lite-context-${{ github.run_id }}
          path: cloudcli-output/**
          if-no-files-found: ignore

      - name: Notify Telegram success
        if: success()
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number }}
          PR_URL: ${{ steps.verify.outputs.pr_url || steps.handoff.outputs.pr_url }}
          BRANCH: ${{ steps.verify.outputs.head_branch || steps.handoff.outputs.head_branch }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha || steps.handoff.outputs.head_sha }}
          DRY_RUN: ${{ steps.handoff.outputs.dry_run }}
          FAILED_CHECKS: ${{ steps.handoff.outputs.failed_checks }}
          SKIPPED_CHECKS: ${{ steps.handoff.outputs.skipped_checks }}
          REVIEW_THREADS: ${{ steps.handoff.outputs.review_threads }}
          ISSUE_COMMENTS: ${{ steps.handoff.outputs.issue_comments }}
          REVIEW_COMMENTS: ${{ steps.handoff.outputs.review_comments }}
          PROMPT_MODE: ${{ steps.handoff.outputs.prompt_mode }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI PR fix completed",
              "",
              f"PR: #{os.environ.get('PR_NUMBER', '')}",
              f"URL: {os.environ.get('PR_URL', '')}",
              f"Branch: {os.environ.get('BRANCH', '')}",
              f"Head SHA: {os.environ.get('HEAD_SHA', '')}",
              f"Dry run: {os.environ.get('DRY_RUN', '')}",
              f"Prompt mode: {os.environ.get('PROMPT_MODE', '')}",
              "",
              "Context collected:",
              f"- Failed checks: {os.environ.get('FAILED_CHECKS', '')}",
              f"- Skipped checks: {os.environ.get('SKIPPED_CHECKS', '')}",
              f"- Review threads: {os.environ.get('REVIEW_THREADS', '')}",
              f"- Issue comments: {os.environ.get('ISSUE_COMMENTS', '')}",
              f"- Review comments: {os.environ.get('REVIEW_COMMENTS', '')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY

      - name: Notify Telegram failure
        if: failure()
        env:
          PR_NUMBER: ${{ steps.handoff.outputs.pr_number || github.event.inputs.pr_number || github.event.client_payload.pr_number || github.event.client_payload.pr || 'unknown' }}
          PR_URL: ${{ steps.verify.outputs.pr_url || steps.handoff.outputs.pr_url || '' }}
          BRANCH: ${{ steps.verify.outputs.head_branch || steps.handoff.outputs.head_branch || '' }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha || steps.handoff.outputs.head_sha || '' }}
          DRY_RUN: ${{ steps.handoff.outputs.dry_run || github.event.inputs.dry_run || github.event.client_payload.dry_run || 'unknown' }}
          FAILED_CHECKS: ${{ steps.handoff.outputs.failed_checks || 'unknown' }}
          SKIPPED_CHECKS: ${{ steps.handoff.outputs.skipped_checks || 'unknown' }}
          REVIEW_THREADS: ${{ steps.handoff.outputs.review_threads || 'unknown' }}
          ISSUE_COMMENTS: ${{ steps.handoff.outputs.issue_comments || 'unknown' }}
          REVIEW_COMMENTS: ${{ steps.handoff.outputs.review_comments || 'unknown' }}
          PROMPT_MODE: ${{ steps.handoff.outputs.prompt_mode || 'unknown' }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          python3 <<'PY'
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          text = "\n".join([
              "CloudCLI PR fix failed",
              "",
              f"PR: #{os.environ.get('PR_NUMBER', '')}",
              f"URL: {os.environ.get('PR_URL', '')}",
              f"Branch: {os.environ.get('BRANCH', '')}",
              f"Head SHA: {os.environ.get('HEAD_SHA', '')}",
              f"Dry run: {os.environ.get('DRY_RUN', '')}",
              f"Prompt mode: {os.environ.get('PROMPT_MODE', '')}",
              "",
              "Context collected before failure:",
              f"- Failed checks: {os.environ.get('FAILED_CHECKS', '')}",
              f"- Skipped checks: {os.environ.get('SKIPPED_CHECKS', '')}",
              f"- Review threads: {os.environ.get('REVIEW_THREADS', '')}",
              f"- Issue comments: {os.environ.get('ISSUE_COMMENTS', '')}",
              f"- Review comments: {os.environ.get('REVIEW_COMMENTS', '')}",
              "",
              f"Run: https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "",
              "Open artifact cloudcli-pr-fix-lite-context-* for logs and context bundle.",
          ])

          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
              "disable_web_page_preview": "true",
          }).encode()

          urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              timeout=60,
          ).read()
          PY