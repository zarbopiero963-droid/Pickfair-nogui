name: CloudCLI New Task

on:
  workflow_dispatch:
    inputs:
      task_title:
        description: "Task title / PR title"
        required: true
        type: string
      task_text:
        description: "Task text to implement"
        required: true
        type: string
      dry_run:
        description: "Run agent without commit/push/PR"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  repository_dispatch:
    types:
      - cloudcli_new_task
      - telegram_new_task

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: cloudcli-new-task-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  new-task:
    name: Send new task to CloudCLI Codex
    runs-on: ubuntu-latest

    env:
      CLOUDCLI_API_KEY: ${{ secrets.CLOUDCLI_API_KEY }}
      CLOUDCLI_BASE_URL: ${{ secrets.CLOUDCLI_BASE_URL }}
      CLOUDCLI_ENVIRONMENT_ID: ${{ secrets.CLOUDCLI_ENVIRONMENT_ID }}
      CLOUDCLI_PROJECT_NAME: ${{ secrets.CLOUDCLI_PROJECT_NAME }}
      CLOUDCLI_REPO_PATH: ${{ secrets.CLOUDCLI_REPO_PATH }}
      CLOUDCLI_PROVIDER: ${{ secrets.CLOUDCLI_PROVIDER }}
      CLOUDCLI_MODEL: ${{ secrets.CLOUDCLI_MODEL }}
      GH_TOKEN_FOR_AGENT: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Resolve task and guard open PRs
        id: resolve
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const fs = require("fs");
            const crypto = require("crypto");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const payload = context.payload.client_payload || {};
            const inputs = context.payload.inputs || {};

            const taskTitleRaw = String(inputs.task_title || payload.task_title || "").trim();
            const taskText = String(inputs.task_text || payload.task_text || "").trim();
            const dryRun = String(inputs.dry_run || payload.dry_run || "true").trim() === "true";

            if (!taskTitleRaw) {
              core.setFailed("Missing task_title.");
              return;
            }

            if (!taskText) {
              core.setFailed("Missing task_text.");
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const nonDraftOpenPrs = openPrs.filter(pr => !pr.draft);

            if (!dryRun && nonDraftOpenPrs.length > 0) {
              const list = nonDraftOpenPrs
                .map(pr => `#${pr.number} ${pr.head.ref} ${pr.html_url}`)
                .join("\n");

              core.setFailed(
                [
                  "BLOCKED",
                  "",
                  "Reason:",
                  "- An open PR already exists. New tasks cannot start while another PR is open.",
                  "",
                  "Open PRs:",
                  list,
                  "",
                  "Required action:",
                  "- Finish/merge/close the open PR first, or use the PR fix workflow instead.",
                ].join("\n")
              );
              return;
            }

            const repoInfo = await github.rest.repos.get({
              owner,
              repo,
            });

            const baseBranch = repoInfo.data.default_branch || "main";

            function slugify(value) {
              return value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 60) || "cloudcli-task";
            }

            const taskTitle = taskTitleRaw.slice(0, 120);
            const hash = crypto.createHash("sha256").update(taskText).digest("hex").slice(0, 10);
            const branch = `cloudcli/${slugify(taskTitle)}-${hash}`;

            fs.mkdirSync("cloudcli-output", { recursive: true });
            fs.writeFileSync("cloudcli-output/task-title.txt", taskTitle, "utf8");
            fs.writeFileSync("cloudcli-output/task-text.txt", taskText, "utf8");

            fs.writeFileSync(
              "cloudcli-output/task-metadata.json",
              JSON.stringify(
                {
                  owner,
                  repo,
                  repository: `${owner}/${repo}`,
                  taskTitle,
                  branch,
                  baseBranch,
                  dryRun,
                },
                null,
                2
              ),
              "utf8"
            );

            core.setOutput("repository", `${owner}/${repo}`);
            core.setOutput("task_title", taskTitle);
            core.setOutput("branch", branch);
            core.setOutput("base_branch", baseBranch);
            core.setOutput("dry_run", dryRun ? "true" : "false");

      - name: Execute CloudCLI new task
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          out_dir = Path("cloudcli-output")
          out_dir.mkdir(exist_ok=True)

          api_key = os.environ.get("CLOUDCLI_API_KEY", "").strip()
          base_url = os.environ.get("CLOUDCLI_BASE_URL", "").strip() or "https://cloudcli.ai/api/v1"
          env_id = os.environ.get("CLOUDCLI_ENVIRONMENT_ID", "").strip()
          project = os.environ.get("CLOUDCLI_PROJECT_NAME", "").strip()
          repo_path = os.environ.get("CLOUDCLI_REPO_PATH", "").strip()
          provider = os.environ.get("CLOUDCLI_PROVIDER", "").strip() or "codex"
          model = os.environ.get("CLOUDCLI_MODEL", "").strip() or "gpt-5.3-codex"
          github_token = os.environ.get("GH_TOKEN_FOR_AGENT", "").strip()

          metadata = json.loads(Path("cloudcli-output/task-metadata.json").read_text(encoding="utf-8"))
          task_title = Path("cloudcli-output/task-title.txt").read_text(encoding="utf-8").strip()
          task_text = Path("cloudcli-output/task-text.txt").read_text(encoding="utf-8").strip()

          repository = metadata["repository"]
          branch = metadata["branch"]
          base_branch = metadata["baseBranch"]
          dry_run = bool(metadata["dryRun"])

          required = {
              "CLOUDCLI_API_KEY": api_key,
              "CLOUDCLI_ENVIRONMENT_ID": env_id,
              "CLOUDCLI_PROJECT_NAME": project,
              "CLOUDCLI_REPO_PATH": repo_path,
              "PICKFAIR_ACTIONS_TOKEN": github_token,
          }

          missing = [name for name, value in required.items() if not value]

          if missing:
              raise SystemExit("Missing required config: " + ", ".join(missing))

          def request_json(method, path, payload=None):
              url = base_url.rstrip("/") + path
              data = None
              headers = {
                  "X-API-KEY": api_key,
                  "Accept": "application/json",
              }

              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              req = urllib.request.Request(url, data=data, headers=headers, method=method)

              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      raw = resp.read().decode("utf-8", errors="replace")
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"HTTP {exc.code} {method} {url}\n{body}") from exc

              if not raw.strip():
                  return {}

              return json.loads(raw)

          env_info = request_json("GET", f"/environments/{env_id}")
          status = str(env_info.get("status", ""))

          print(f"CloudCLI environment status: {status}")

          if status != "running":
              print("Starting CloudCLI environment...")
              request_json("POST", f"/environments/{env_id}/start")

              for attempt in range(1, 37):
                  time.sleep(5)
                  env_info = request_json("GET", f"/environments/{env_id}")
                  status = str(env_info.get("status", ""))
                  print(f"Start poll {attempt}: {status}")

                  if status == "running":
                      break

              if status != "running":
                  raise SystemExit("CloudCLI environment did not become running.")

          if dry_run:
              execution_rules = f"""
          DRY RUN MODE.

          Do not edit files.
          Do not commit.
          Do not push.
          Do not create a PR.

          Inspect only this repo path:
          {repo_path}
          """
          else:
              execution_rules = f"""
          REAL EXECUTION MODE.

          You must:
          - Work only in this repo path: {repo_path}
          - Fetch latest refs.
          - Start from base branch: {base_branch}
          - Create and use exactly this branch: {branch}
          - Implement only the requested task.
          - Run relevant checks/tests.
          - Commit the changes.
          - Push only this branch to origin: {branch}
          - Create exactly one PR from {branch} into {base_branch}.
          - Do not merge.
          - Do not work directly on main/master.
          - Do not create a second PR.
          """

          message = f"""
          CTO MODE: LOCKED IN — CLOUDCLI NEW TASK

          Repository: {repository}
          Repo path: {repo_path}
          Base branch: {base_branch}
          Required task branch: {branch}
          PR title: {task_title}

          {execution_rules}

          Strict scope:
          - Implement only the task below.
          - Do not broad-refactor.
          - Do not modify unrelated workflows.
          - Do not modify unrelated scripts.
          - Do not modify unrelated tests.
          - Do not modify guardrail JSON unless the task explicitly requires it.
          - Do not touch secrets, credentials, generated caches, or local logs.
          - Follow existing project rules and AGENTS.md if present.

          Task:
          {task_text}

          First inspect:
          - pwd
          - cd "{repo_path}" && git status --short
          - cd "{repo_path}" && git branch --show-current
          - cd "{repo_path}" && git remote -v

          If this is real execution mode:
          - cd "{repo_path}"
          - git fetch origin
          - git checkout "{base_branch}"
          - git pull --ff-only origin "{base_branch}"
          - git checkout -B "{branch}"
          - implement the task
          - run relevant checks/tests
          - git status --short
          - git diff --stat
          - git add only intended files
          - git commit -m "Implement task: {task_title}"
          - git push origin "HEAD:{branch}"
          - create PR with title: {task_title}

          If GitHub auth or PR creation is unavailable, still push the branch if possible and report NEEDS_MANUAL_PR_CREATE.
          If push is unavailable, report NEEDS_MANUAL_UPDATE_BRANCH.

          Return final output only in this format:

          CLOUDCLI_NEW_TASK_DONE

          Final factual status:
          - DONE / PARTIAL / NOT DONE

          Branch:
          - {branch}

          PR:
          - <PR URL or none>

          Commit:
          - <commit SHA or none>

          Checks:
          - <exact commands and results>

          Files changed:
          - <files>

          Files created:
          - <files>

          What was not done:
          - <items>

          Push:
          - succeeded / failed / skipped dry-run
          """

          payload = {
              "environmentId": env_id,
              "projectName": project,
              "message": message,
              "provider": provider,
              "model": model,
              "createBranch": False,
              "createPR": False,
              "githubToken": github_token,
          }

          redacted_payload = dict(payload)
          redacted_payload["githubToken"] = "***"

          Path("cloudcli-output/agent-payload-redacted.json").write_text(
              json.dumps(redacted_payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          url = base_url.rstrip("/") + "/agent/execute"
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "X-API-KEY": api_key,
                  "Content-Type": "application/json",
                  "Accept": "text/event-stream",
              },
              method="POST",
          )

          print("Calling CloudCLI agent execute...")
          chunks = []

          try:
              with urllib.request.urlopen(req, timeout=3600) as resp:
                  for raw_line in resp:
                      line = raw_line.decode("utf-8", errors="replace")
                      print(line, end="")
                      chunks.append(line)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"HTTP {exc.code} POST {url}\n{body}") from exc

          sse_text = "".join(chunks)

          Path("cloudcli-output/agent-sse.log").write_text(
              sse_text,
              encoding="utf-8",
          )

          if "CLOUDCLI_NEW_TASK_DONE" not in sse_text:
              raise SystemExit("CloudCLI new task marker CLOUDCLI_NEW_TASK_DONE not found in agent output.")

          print("CloudCLI new task execution completed.")
          PY

      - name: Verify PR created
        if: steps.resolve.outputs.dry_run != 'true'
        id: verify_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PICKFAIR_ACTIONS_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = "${{ steps.resolve.outputs.branch }}";

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              per_page: 20,
            });

            if (!pulls.length) {
              core.setFailed(`No open PR found for branch ${branch}. Check CloudCLI logs.`);
              return;
            }

            const pr = pulls[0];

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("pr_url", pr.html_url);
            core.setOutput("head_sha", pr.head.sha);

      - name: Upload CloudCLI new task logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudcli-new-task-logs-${{ github.run_id }}
          path: cloudcli-output/**
          if-no-files-found: ignore

      - name: Notify Telegram success
        if: success()
        env:
          TASK_TITLE: ${{ steps.resolve.outputs.task_title }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          PR_URL: ${{ steps.verify_pr.outputs.pr_url }}
          HEAD_SHA: ${{ steps.verify_pr.outputs.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          PR_URL="${PR_URL:-dry-run/no-pr}"
          HEAD_SHA="${HEAD_SHA:-n/a}"

          TEXT="$(cat <<EOF
✅ CloudCLI new task completed

Title: $TASK_TITLE
Branch: $BRANCH
Dry run: $DRY_RUN
PR: $PR_URL
Head SHA: $HEAD_SHA

Run:
https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
EOF
)"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true" >/dev/null

      - name: Notify Telegram failure
        if: failure()
        env:
          TASK_TITLE: ${{ steps.resolve.outputs.task_title }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "Telegram secrets missing. Skipping notification."
            exit 0
          fi

          TASK_TITLE="${TASK_TITLE:-unknown}"
          BRANCH="${BRANCH:-unknown}"
          DRY_RUN="${DRY_RUN:-unknown}"

          TEXT="$(cat <<EOF
❌ CloudCLI new task failed

Title: $TASK_TITLE
Branch: $BRANCH
Dry run: $DRY_RUN

Run:
https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

Check artifact:
cloudcli-new-task-logs
EOF
)"

          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=$TEXT" \
            -d "disable_web_page_preview=true" >/dev/null