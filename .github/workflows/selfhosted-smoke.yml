name: Self-hosted Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, pickfair-fixer]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check VPS runner tools
        run: |
          set -euo pipefail

          echo "=== user ==="
          whoami
          echo "$HOME"
          pwd

          echo "=== system ==="
          hostname
          uname -a

          echo "=== git ==="
          git --version

          echo "=== node/npm ==="
          node --version
          npm --version

          echo "=== python ==="
          python3 --version

          echo "=== codex ==="
          codex --version

          echo "=== codex non-interactive test ==="
          timeout 180s codex exec "Rispondi solo: OK_CODEX_SELFHOSTED"

          echo "=== gh ==="
          gh --version
          gh auth status || true

          echo "=== repo ==="
          git status --short
          git branch --show-current || true

          echo "SELFHOSTED_SMOKE_OK"