name: mutation-guardrails
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-xdist

      - name: Run mutation guardrails
        run: |
          python scripts/run_mutation_guardrails.py --fail-under 80 --output mutation_guardrails_report.json

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        with:
          # #525: nome unico per job. ci-master-gate lancia questa lane due volte
          # nello stesso run (diretta e via ci-dynamic-intelligent) e
          # upload-artifact@v4 rifiuta un secondo artifact con lo stesso nome.
          name: mutation-guardrails-report-${{ job.check_run_id }}
          path: mutation_guardrails_report.json 